description: |
  Bem-vindo ao **Dojo Oficial de Treinamento da Cyberguard** na plataforma **pwn.college**.

  Desenvolvido sob medida para nivelar, consolidar e elevar as habilidades técnicas da nossa equipe, este dojo oferece uma progressão pedagógica estruturada que vai desde os fundamentos de linha de comando no Linux e redes de computadores até tópicos avançados de engenharia reversa x86_64, exploração de vulnerabilidades de memória (pwn), segurança defensiva (Blue Team/DFIR) e infraestrutura corporativa (Active Directory).

  Cada módulo foi calibrado com base no diagnóstico técnico de competências do time, atacando gargalos críticos (como arquitetura de CPU, registradores EIP/RIP, análise estática vs. dinâmica, ordem de volatilidade RFC 3227 e modelo de permissões Unix).

  Explore as aulas, estude as leituras teóricas e resolva os desafios práticos diretamente nos containers do pwn.college.
modules:
- id: fundamentos-linux
  name: 'Módulo 1: Fundamentos de Linux & Linha de Comando'
  description: |
    O Linux é a espinha dorsal da segurança ofensiva e defensiva contemporânea. Este módulo constrói a fluência essencial no terminal do pwn.college: navegação eficiente pela hierarquia de arquivos, operadores de redirecionamento de entrada/saída (stdin, stdout, stderr), concatenação de comandos com pipes (|), manipulação de variáveis de ambiente e o modelo rigoroso de permissões POSIX.

    Serão desmistificados os cálculos octais e simbólicos (como a diferença entre chmod 640 e 755), a posse de arquivos (chown/chgrp) e os bits especiais SUID, SGID e Sticky Bit, fundamentais para a compreensão de escalação de privilégios.
