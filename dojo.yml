description: |
  Bem-vindo ao **Linux Luminarium** oficial da **Cyberguard** na plataforma **pwn.college**!
  
  Este Dojo ensina de forma progressiva e didática como dominar a linha de comando do Linux e os principais conceitos do sistema operacional:
  navegação pelo sistema de arquivos, manipulação de processos e fluxos de I/O, permissões e variáveis de ambiente, até multiplexação de terminais e redirecionamento de comandos.
  
  Todo o material e os desafios práticos foram traduzidos para Português do Brasil (PT-BR) para oferecer a melhor experiência de aprendizagem à equipe.

